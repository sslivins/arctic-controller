  /api/heatpump/diagnostic:
    get:
      tags:
        - HeatPump
      summary: Download diagnostic CSV report
      description: |
        Returns a comprehensive system diagnostic as a downloadable CSV file.
        Includes all cached register values, sensor readings, component status,
        active errors, and advanced (AP) parameters with current values.
        Useful for remote troubleshooting with Arctic support.
        
        CSV columns: Category, Name, P-Code, Register Address, Value, Unit
        
        Sections:
        - System State (power, mode, connection)
        - Temperatures (all sensor readings in °C)
        - Setpoints (cooling, heating, hot water)
        - System Readings (compressor freq, fan RPM, voltages, currents, pressures)
        - Component Status (individual bits from registers 2135/2136)
        - Raw Register Values (hex values of status/error registers)
        - Active Errors (individual error flags from registers 2137/2138)
        - P-Parameters (all technician settings with live values)
      responses:
        '200':
          description: CSV diagnostic file
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'attachment; filename="arctic-diagnostic-YYYYMMDD-HHMMSS.csv"'
          content:
            text/csv:
              schema:
                type: string
                description: CSV formatted diagnostic data
        '401':
          description: API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/heatpump/errors:
    get:
      tags:
        - HeatPump
      summary: Get error information and history
      description: |
        Returns detailed information about active errors and error history.
        Each error includes Arctic error code, name, description, resolution steps, and severity.
        History shows when errors occurred and cleared with UTC timestamps.
        In demo mode, returns sample errors for testing.
        All timestamps are Unix epoch seconds in UTC.
      operationId: getHeatpumpErrors
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        '200':
          description: Error information
          content:
            application/json:
              schema:
                type: object
                properties:
                  demo_mode:
                    type: boolean
                    description: Whether demo mode is enabled
                  connected:
                    type: boolean
                    description: Whether heat pump is connected
                  has_errors:
                    type: boolean
                    description: Whether any errors are currently active
                  error_count:
                    type: integer
                    description: Number of active errors
                  highest_severity:
                    type: string
                    enum: [info, warning, error, critical]
                    description: Highest severity among active errors
                  active:
                    type: array
                    description: List of currently active errors
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Arctic error code (e.g., "P02", "E01", "r01", "FA")
                          example: "P02"
                        name:
                          type: string
                          description: Short error name
                          example: "HIGH_PRESSURE"
                        description:
                          type: string
                          description: Human-readable description
                          example: "High pressure protection activated"
                        resolution:
                          type: string
                          description: Suggested resolution steps
                          example: "1) Check whether the water temperature is too high or blocked. 2) Check whether the fan blades are blocked."
                        severity:
                          type: string
                          enum: [info, warning, error, critical]
                          example: "warning"
                        occurred:
                          type: integer
                          nullable: true
                          description: Unix timestamp (UTC) when error first appeared
                          example: 1739145600
                        active:
                          type: boolean
                          description: Whether error is currently active
                  history:
                    type: array
                    description: Error history (most recent first, up to 10 entries)
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Arctic error code
                        occurred:
                          type: integer
                          nullable: true
                          description: Unix timestamp (UTC) when error occurred
                        cleared:
                          type: integer
                          nullable: true
                          description: Unix timestamp (UTC) when error cleared
                        active:
                          type: boolean
                          description: Whether error is still active
              example:
                demo_mode: true
                connected: true
                has_errors: true
                error_count: 3
                highest_severity: "warning"
                active:
                  - code: "P02"
                    name: "HIGH_PRESSURE"
                    description: "High pressure protection activated"
                    resolution: "1) Check whether the water temperature is too high or blocked. 2) Check whether the fan blades are blocked."
                    severity: "warning"
                    occurred: 1739145600
                    active: true
                history:
                  - code: "E26"
                    occurred: 1739138400
                    cleared: 1739142000
                    active: false
                  - code: "E19"
                    occurred: 1739131200
                    cleared: 1739134800
                    active: false
        '401':
          description: API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/heatpump/errors/history:
    delete:
      tags:
        - HeatPump
      summary: Clear heat-pump error history
      description: Deletes cleared error-history entries while preserving active errors.
      operationId: clearHeatpumpErrorHistory
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        '200':
          description: Error history cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Error history cleared
        '401':
          description: API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/heatpump/advanced:
    get:
      tags:
