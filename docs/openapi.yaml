      operationId: clearEvents
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        '200':
          description: Event log cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          description: API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/brownout/clear:
    post:
      tags:
        - Events
      summary: Clear persistent brownout statistics
      description: Resets the persistent brownout counter and stored reset statistics.
      operationId: clearBrownoutStatistics
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        '200':
          description: Brownout statistics cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          description: API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/display/brightness:
    get:
      tags: [Status]
      summary: Get saved display brightness
      operationId: getDisplayBrightness
      responses:
        '200':
          description: Saved brightness
          content:
            application/json:
              schema:
                type: object
                properties:
                  brightness:
                    type: integer
                    minimum: 5
                    maximum: 100
    put:
      tags: [Status]
      summary: Save and apply display brightness
      operationId: setDisplayBrightness
      security:
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brightness]
              properties:
                brightness:
                  type: integer
                  minimum: 5
                  maximum: 100
      responses:
        '200':
          description: Brightness saved and applied

  /api/preferences:
    get:
      tags: [Status]
      summary: Get application preferences
      operationId: getPreferences
      responses:
        '200':
          description: Current preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
    patch:
      tags: [Status]
      summary: Update application preferences
      operationId: updatePreferences
      security:
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                demo_mode:
                  type: boolean
                temp_unit:
                  type: string
                  enum: [celsius, fahrenheit]
                language:
                  type: string
                  enum: [en, fr, es]
      responses:
        '200':
          description: Updated preferences

  /api/factory-reset:
    post:
      tags: [Status]
      summary: Erase controller data and restore factory defaults
      operationId: factoryReset
      security:
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: string
                  enum: [factory-reset]
      responses:
        '200':
          description: Reset started; controller will restart

  /api/logs:
    get:
      tags:
        - Logs
      summary: Get system log entries
      description: |
        Returns ESP_LOG output captured in a RAM ring buffer (max 256 entries).
        Supports incremental fetching via the `since` parameter and filtering by log level.
        Entries are returned in chronological order (oldest first).
      operationId: getLogs
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - name: since
          in: query
          description: Only return entries with sequence number greater than this value (for incremental polling)
          required: false
          schema:
            type: integer
            example: 0
        - name: level
          in: query
          description: |
            Minimum log level filter:
            - `E` — errors only
            - `W` — warnings and errors
            - `I` — info, warnings, and errors
            - `D` — debug and above
            - `V` — all (verbose), this is the default
          required: false
          schema:
            type: string
            enum: [E, W, I, D, V]
            default: V
        - name: limit
          in: query
          description: Maximum number of entries to return
          required: false
          schema:
            type: integer
            default: 256
      responses:
        '200':
          description: Log entries retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Total number of entries currently in the buffer
                    example: 42
                  latest_seq:
                    type: integer
                    description: Sequence number of the most recent entry (use as `since` for next poll)
                    example: 128
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/LogEntry'
        '401':
          description: API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Logs
      summary: Clear log buffer
      description: Deletes all entries from the log buffer. Sequence numbers continue to increment.
      operationId: clearLogs
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        '200':
          description: Log buffer cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          description: API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/screenshot:
    get:
      tags:
        - Display
      summary: Capture live screen as PNG
      description: |
        Returns a PNG screenshot of the current LVGL display.
        The image is encoded as an **uncompressed PNG** (DEFLATE stored blocks)
        for minimal CPU overhead on the ESP32. The response is streamed via
        HTTP chunked transfer — no extra memory allocation beyond the
        framebuffer capture (~2.7 MB in PSRAM).

        Image dimensions: 720×1280 (portrait), RGB888 color.
        Typical response size: ~2.77 MB.
      operationId: getScreenshot
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        '200':
          description: PNG screenshot of the current display
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          description: API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Capture or encoding failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/capabilities:
    get:
      tags:
        - HomeAssistant
      summary: Home Assistant integration capabilities
      description: |
        Returns the stable device identity, protocol version, supported
        transports, read/control capabilities, and setpoint limits. Production
        firmware exposes this endpoint only over HTTPS.
      operationId: getHomeAssistantCapabilities
      security:
        - integrationBearer: []
      responses:
        '200':
          description: Integration capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeAssistantCapabilities'
        '401':
          description: Missing or invalid integration token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/state:
    get:
      tags:
        - HomeAssistant
      summary: Coherent Home Assistant state snapshot
      description: |
        Returns a complete versioned state snapshot. Revisions are monotonic
        within one boot and change whenever an exposed state field changes.
        Production firmware exposes this endpoint only over HTTPS.
      operationId: getHomeAssistantState
      security:
        - integrationBearer: []
      responses:
        '200':
          description: Versioned state snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeAssistantStateSnapshot'
        '401':
          description: Missing or invalid integration token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for programmatic access (32-character hex string)
    sessionCookie:
      type: apiKey
      in: cookie
      name: arctic_session
      description: Session cookie obtained from /login endpoint
    integrationBearer:
      type: http
      scheme: bearer
      bearerFormat: 256-bit integration token
      description: |
        Dedicated token issued only by the physical Home Assistant pairing
        flow. Existing web/API authentication settings never bypass it.

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message

    HomeAssistantCapabilities:
      type: object
      required:
        - protocol_version
        - device_id
        - model
        - firmware_version
        - transports
        - capabilities
        - setpoint_limits_c
      properties:
        protocol_version:
          type: integer
          example: 1
        device_id:
          type: string
          pattern: '^arctic-[0-9a-f]{12}$'
        model:
          type: string
        firmware_version:
          type: string
        transports:
          type: object
          required: [rest, websocket]
          properties:
            rest:
              type: boolean
            websocket:
              type: boolean
        capabilities:
          type: object
          required:
            - read_state
            - control_power
            - control_mode
            - control_setpoints
            - advanced_parameters
            - raw_registers
          properties:
            read_state:
              type: boolean
            control_power:
              type: boolean
            control_mode:
              type: boolean
            control_setpoints:
              type: boolean
            advanced_parameters:
              type: boolean
              enum: [false]
            raw_registers:
              type: boolean
              enum: [false]
        setpoint_limits_c:
          type: object

    HomeAssistantStateSnapshot:
      type: object
      required:
        - protocol_version
        - device_id
        - boot_id
        - revision
        - captured_at_ms
        - state
      properties:
        protocol_version:
          type: integer
          example: 1
        device_id:
          type: string
          pattern: '^arctic-[0-9a-f]{12}$'
        boot_id:
          type: string
          pattern: '^[0-9a-f]{32}$'
        revision:
          type: integer
          minimum: 1
        captured_at_ms:
          type: integer
          minimum: 0
        state:
          type: object
          required:
            - connected
            - unit_on
            - mode
            - operation
            - defrosting
            - components
            - temperatures_c
            - setpoints_c
            - readings
            - error


    LogEntry:
      type: object
      description: A single captured ESP_LOG entry
      properties:
        seq:
          type: integer
          description: Monotonically increasing sequence number (unique across clears)
          example: 42
        uptime_ms:
          type: integer
          description: Device uptime in milliseconds when logged
          example: 12345
        level:
          type: string
          description: Log level character
          enum: [E, W, I, D, V]
          example: I
        tag:
          type: string
          description: ESP_LOG component tag
          example: api_server
        message:
          type: string
          description: Log message text (without level/tag prefix)
          example: HTTP server started successfully

    EventEntry:
      type: object
      description: A single operational event
      properties:
        type:
          type: string
          description: Event type identifier
          enum:
            - system_start
            - power_on
            - power_off
            - mode_changed
            - setpoint_changed
            - compressor_on
            - compressor_off
            - fan_on
            - fan_off
            - pump_on
            - pump_off
            - aux_heater_on
            - aux_heater_off
            - defrost_start
            - defrost_end
            - error_appeared
            - error_cleared
            - connected
            - disconnected
            - brownout_reset
            - application_crash
            - watchdog_reset
          example: power_on
        category:
          type: string
          enum: [problems, equipment, changes, system]
        boot_id:
          type: integer
          format: uint32
        timestamp:
          type: integer
          description: Unix timestamp (seconds since epoch), 0 if NTP not synced
          example: 1739404800
        uptime_ms:
          type: integer
          description: Device uptime in milliseconds when event occurred
          example: 125340
        payload:
          type: integer
          description: |
            Event-specific payload data:
            - `mode_changed`: `(old_mode << 8) | new_mode`
            - `setpoint_changed`: `(type << 16) | (old_val << 8) | new_val` where type: 0=cooling, 1=heating, 2=hot_water
            - `error_appeared` / `error_cleared`: `(register << 16) | bit_mask` where register is 1 or 2
            - All other events: 0
          example: 0

    AdvancedParam:
      type: object
      description: Advanced ("AP") heat-pump parameter definition and value
      properties:
        ap:
          type: integer
          description: AP parameter number
          example: 13
        name:
          type: string
          description: Human-readable English name (fallback when name_msg_id is untranslated)
          example: Defrost Cycle
        detail:
          type: string
          description: >-
            Human-readable English detail/help text (fallback when detail_msg_id
            is untranslated). May contain `{T:<celsius>}` temperature tokens the
            UI substitutes with a converted, unit-labelled value.
          example: Time between defrost cycles.
        name_msg_id:
          type: string
          description: >-
            Stable translation key for `name` (e.g. `ap.max_hw_setpoint.name`).
            UIs translate by this key and fall back to `name` when untranslated.
          example: ap.max_hw_setpoint.name
        detail_msg_id:
          type: string
          description: >-
            Stable translation key for `detail` (e.g. `ap.max_hw_setpoint.detail`).
            UIs translate by this key and fall back to `detail` when untranslated.
          example: ap.max_hw_setpoint.detail
        unit:
          type: string
          description: Unit of measurement
          example: min
        temperature_kind:
          type: string
          enum: [none, absolute, differential]
          description: Conversion semantics for temperature-valued parameters
        min:
          type: integer
          description: Minimum allowed value
          example: 30
        max:
          type: integer
          description: Maximum allowed value
          example: 120
        category:
          type: string
          description: Parameter category for grouping
          example: Defrost
        read_only:
          type: boolean
          description: Register known but purpose unclear — displayed, not writable
        is_trigger:
          type: boolean
          description: Momentary/self-clearing command register
        writable:
          type: boolean
          description: Whether the parameter can be written via PUT
        value:
          type: integer
          nullable: true
          description: Current value (null if disconnected and not in demo mode)
          example: 45

    Preferences:
      type: object
      properties:
        demo_mode:
          type: boolean
        temp_unit:
          type: string
          enum: [celsius, fahrenheit]
        brightness:
          type: integer
          minimum: 5
          maximum: 100
        language:
          type: string
        language_code:
          type: string
          enum: [en, fr, es]
        format_24h:
          type: boolean
        timezone:
          type: string
        success:
          type: boolean
        reboot_required:
          type: boolean
