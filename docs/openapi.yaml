                        example: 35
                      indoor_coil:
                        type: integer
                        description: Indoor coil temperature
                        example: 40
                      ipm:
                        type: integer
                        description: IPM (Intelligent Power Module) temperature
                        example: 55
                  setpoints:
                    type: object
                    description: Temperature setpoints in degrees Celsius
                    properties:
                      cooling:
                        type: integer
                        description: Cooling mode setpoint
                        example: 7
                      heating:
                        type: integer
                        description: Heating mode setpoint
                        example: 45
                      hot_water:
                        type: integer
                        description: Hot water mode setpoint
                        example: 55
                  readings:
                    type: object
                    description: System readings
                    properties:
                      compressor_freq:
                        type: integer
                        description: Compressor frequency in Hz
                        example: 60
                      fan_rpm:
                        type: integer
                        description: Fan speed in RPM
                        example: 850
                      ac_voltage:
                        type: integer
                        description: AC input voltage
                        example: 230
                      ac_current:
                        type: integer
                        description: AC current draw in amps
                        example: 5
                      dc_voltage:
                        type: number
                        description: DC bus voltage
                        example: 380.0
                      dc_current:
                        type: integer
                        description: DC current in amps
                        example: 4
                      high_pressure:
                        type: number
                        description: High side pressure in MPa
                        example: 2.50
                      low_pressure:
                        type: number
                        description: Low side pressure in MPa
                        example: 0.85
                      primary_eev:
                        type: integer
                        description: Primary EEV opening in steps
                        example: 350
                      secondary_eev:
                        type: integer
                        description: Secondary EEV opening in steps
                        example: 200
                      power_consumption:
                        type: integer
                        description: Calculated power consumption in watts (AC voltage × AC current)
                        example: 1150
                  has_error:
                    type: boolean
                    description: Whether the unit has any active errors
                    example: false
                  error:
                    type: string
