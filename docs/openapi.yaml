openapi: 3.0.3
info:
  title: Arctic Heat Pump Controller API
  description: |
    REST API for the Arctic Heat Pump Controller running on ESP32-P4 with ESP32-C6 WiFi.
    
    The device is discoverable via mDNS at `http://arctic.local` when connected to your local network.
    
    ## Features
    - Device status and health monitoring
    - WiFi connection status with signal strength
    - Time/NTP synchronization and configuration
    - Over-the-Air (OTA) firmware updates (URL download or file upload)
    - Web interface authentication with session management
    - API key authentication for programmatic access
    - Heat pump status monitoring
    
    ## Authentication
    
    The API supports two optional authentication mechanisms:
    
    ### Web Authentication (Session-based)
    When enabled, users must log in via `/login` with username/password. 
    A session cookie (`arctic_session`) is returned and must be included in subsequent requests.
    
    ### API Key Authentication
    When enabled, programmatic API access requires the `X-API-Key` header.
    The API key can be retrieved from the web interface settings.
    
    Both authentication types can be independently enabled/disabled via `/api/auth/config`.
  version: 2.0.0
  contact:
    name: Arctic Controller
  license:
    name: MIT

servers:
  - url: http://arctic.local
    description: Local mDNS hostname
  - url: http://{ip_address}
    description: Direct IP address
    variables:
      ip_address:
        default: 192.168.1.100
        description: Device IP address

tags:
  - name: Health
    description: Health check endpoints
  - name: Status
    description: Device status information
  - name: WiFi
    description: WiFi connection information
  - name: Time
    description: Time and NTP configuration
  - name: Info
    description: Device information
  - name: OTA
    description: Over-the-Air firmware updates
  - name: Authentication
    description: Session and API key authentication
  - name: HeatPump
    description: Heat pump status and control

paths:
  /login:
    post:
      tags:
        - Authentication
      summary: Login with credentials
      description: |
        Authenticates a user and returns a session cookie.
        The session cookie is automatically set via `Set-Cookie` header.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: arctic
                password:
                  type: string
                  format: password
                  example: arctic
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: Session cookie
              schema:
                type: string
                example: arctic_session=abc123...; Path=/; Max-Age=86400; HttpOnly; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid credentials

  /logout:
    post:
      tags:
        - Authentication
      summary: Logout and invalidate session
      description: Invalidates the current session and clears the session cookie.
      operationId: logout
      responses:
        '200':
          description: Logout successful
          headers:
            Set-Cookie:
              description: Cleared session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /api/health:
    get:
      tags:
        - Health
      summary: Health check
      description: Simple health check endpoint to verify the device is responding.
      operationId: getHealth
      responses:
        '200':
          description: Device is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime_ms:
                    type: number
                    description: Device uptime in milliseconds
                    example: 123456789

  /api/status:
    get:
      tags:
        - Status
      summary: Full device status
      description: Returns comprehensive device status including WiFi and time information.
      operationId: getStatus
      responses:
        '200':
          description: Device status
          content:
            application/json:
              schema:
                type: object
                properties:
                  device:
                    type: string
                    example: Arctic Heat Pump Controller
                  hostname:
                    type: string
                    example: arctic
                  uptime_ms:
                    type: number
                    example: 123456789
                  wifi:
                    type: object
                    properties:
                      state:
                        type: string
                        enum: [not_initialized, disconnected, connecting, connected, error]
                        example: connected
                      ssid:
                        type: string
                        example: MyNetwork
                      ip:
                        type: string
                        example: 192.168.1.100
                  time:
                    type: object
                    properties:
                      local:
                        type: string
                        example: "14:30:45"
                      timezone:
                        type: string
                        example: EST5EDT,M3.2.0,M11.1.0
                      synced:
                        type: boolean
                        example: true
                      epoch:
                        type: number
                        description: Unix timestamp
                        example: 1738766400

  /api/time:
    get:
      tags:
        - Time
      summary: Current time information
      description: Returns current time in various formats with NTP sync status.
      operationId: getTime
      responses:
        '200':
          description: Time information
          content:
            application/json:
              schema:
                type: object
                properties:
                  time_24h:
                    type: string
                    example: "14:30:45"
                  time_12h:
                    type: string
                    example: "02:30:45 PM"
                  date:
                    type: string
                    format: date
                    example: "2026-02-05"
                  iso:
                    type: string
                    format: date-time
                    example: "2026-02-05T14:30:45"
                  timezone:
                    type: string
                    example: EST5EDT,M3.2.0,M11.1.0
                  epoch:
                    type: number
                    description: Unix timestamp
                    example: 1738766400
                  ntp_synced:
                    type: boolean
                    description: Whether time has been synchronized via NTP
                    example: true

  /api/time/config:
    get:
      tags:
        - Time
      summary: Get time configuration
      description: Returns current timezone and time format settings.
      operationId: getTimeConfig
      responses:
        '200':
          description: Time configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  timezone:
                    type: string
                    description: POSIX timezone string
                    example: EST5EDT,M3.2.0,M11.1.0
                  format_24h:
                    type: boolean
                    description: Use 24-hour time format
                    example: true
                  synced:
                    type: boolean
                    description: Whether NTP sync has occurred
                    example: true
    post:
      tags:
        - Time
      summary: Set time configuration
      description: Updates timezone and time format settings.
      operationId: setTimeConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                timezone:
                  type: string
                  description: POSIX timezone string
                  example: PST8PDT,M3.2.0,M11.1.0
                format_24h:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /api/time/sync:
    post:
      tags:
        - Time
      summary: Force NTP sync
      description: Triggers an immediate NTP time synchronization.
      operationId: syncTime
      responses:
        '200':
          description: Sync initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: NTP sync initiated

  /api/wifi:
    get:
      tags:
        - WiFi
      summary: WiFi connection status
      description: Returns current WiFi connection state and signal strength.
      operationId: getWifi
      responses:
        '200':
          description: WiFi status
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                    enum: [not_initialized, disconnected, connecting, connected, error]
                    example: connected
                  connected:
                    type: boolean
                    example: true
                  ssid:
                    type: string
                    description: Connected network name (only when connected)
                    example: MyNetwork
                  ip:
                    type: string
                    description: Device IP address (only when connected)
                    example: 192.168.1.100
                  rssi:
                    type: integer
                    description: Signal strength in dBm (only when connected). Typical range -30 (excellent) to -90 (weak).
                    example: -45
                  hostname:
                    type: string
                    description: mDNS hostname (only when connected)
                    example: arctic
                  local_url:
                    type: string
                    description: Full mDNS URL (only when connected)
                    example: http://arctic.local

  /api/info:
    get:
      tags:
        - Info
      summary: Device information
      description: Returns device hardware/software information.
      operationId: getInfo
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        '200':
          description: Device information
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Arctic Heat Pump Controller
                  hostname:
                    type: string
                    example: arctic
                  platform:
                    type: string
                    example: ESP32-P4
                  wifi_module:
                    type: string
                    example: ESP32-C6
                  version:
                    type: string
                    example: "1.2.3"
                  free_heap:
                    type: integer
                    description: Free heap memory in bytes
                    example: 4194304
                  min_free_heap:
                    type: integer
                    description: Minimum free heap since boot
                    example: 4000000
                  uptime_ms:
                    type: number
                    example: 123456789
                  api_version:
                    type: string
                    example: "2.0"
        '401':
          description: API key required (when API auth is enabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/ota/status:
    get:
      tags:
        - OTA
      summary: OTA update status
      description: Returns current OTA update status, progress, and partition information.
      operationId: getOtaStatus
      responses:
        '200':
          description: OTA status
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                    enum: [idle, uploading, downloading, verifying, ready_to_reboot, failed]
                    description: |
                      - `idle`: No update in progress
                      - `uploading`: Receiving firmware via file upload
                      - `downloading`: Downloading firmware from URL
                      - `verifying`: Validating downloaded/uploaded firmware
                      - `ready_to_reboot`: Update complete, awaiting reboot
                      - `failed`: Update failed
                    example: idle
                  progress:
                    type: integer
                    description: Download/upload progress percentage (0-100)
                    minimum: 0
                    maximum: 100
                    example: 0
                  bytes_downloaded:
                    type: integer
                    example: 0
                  total_bytes:
                    type: integer
                    example: 0
                  current_version:
                    type: string
                    example: "1.2.3"
                  new_version:
                    type: string
                    description: Version being installed (only during URL update)
                    example: "1.2.4"
                  error:
                    type: string
                    description: Error message (only when state is failed)
                  partition:
                    type: object
                    properties:
                      label:
                        type: string
                        example: ota_0
                      address:
                        type: integer
                        example: 131072
                      size:
                        type: integer
                        example: 4194304

  /api/ota/update:
    post:
      tags:
        - OTA
      summary: Start OTA update from URL
      description: |
        Initiates an OTA firmware update from the specified URL.
        
        **Security**: Only URLs starting with `https://github.com/sslivins/arctic-controller/` are allowed.
        
        The device will automatically reboot after a successful update.
      operationId: startOtaUpdate
      security:
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                  description: URL to download firmware from (must be from official GitHub repo)
                  example: https://github.com/sslivins/arctic-controller/releases/download/v1.2.4/arctic_controller.bin
      responses:
        '200':
          description: OTA update started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: started
                  message:
                    type: string
                    example: OTA update started. Poll /api/ota/status for progress.
        '400':
          description: Invalid request or URL not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                urlNotAllowed:
                  value:
                    error: URL not allowed. Must be from official GitHub repository.
        '401':
          description: API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: OTA already in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: OTA already in progress

  /api/ota/upload:
    post:
      tags:
        - OTA
      summary: Upload firmware file
      description: |
        Uploads a firmware binary file directly to the device.
        
        The file must be a valid ESP32-P4 firmware binary (.bin file starting with magic byte 0xE9).
        
        **Note**: The device will automatically reboot after successful upload.
        
        Only one OTA operation (upload or URL download) can be in progress at a time.
      operationId: uploadFirmware
      security:
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Raw firmware binary data
      responses:
        '200':
          description: Firmware uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  bytes_received:
                    type: integer
                    example: 1725696
                  message:
                    type: string
                    example: Firmware uploaded. Rebooting...
        '400':
          description: Invalid firmware file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid firmware file (not an ESP32 binary)
        '401':
          description: API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Another OTA update is in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Another OTA update is already in progress
        '500':
          description: Upload or flash failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/ota/reboot:
    post:
      tags:
        - OTA
      summary: Reboot device
      description: Immediately reboots the device. Can be used to apply updates or restart the system.
      operationId: reboot
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        '200':
          description: Device is rebooting
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: rebooting
                  message:
                    type: string
                    example: Device will reboot now
        '401':
          description: API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/config:
    get:
      tags:
        - Authentication
      summary: Get authentication configuration
      description: Returns current authentication settings. This endpoint is always accessible.
      operationId: getAuthConfig
      responses:
        '200':
          description: Authentication configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  web_auth_enabled:
                    type: boolean
                    description: Whether web interface requires login
                    example: true
                  api_auth_enabled:
                    type: boolean
                    description: Whether API requires X-API-Key header
                    example: false
                  username:
                    type: string
                    description: Current username (for display)
                    example: arctic
                  authenticated:
                    type: boolean
                    description: Whether current request is authenticated
                    example: true
    post:
      tags:
        - Authentication
      summary: Set authentication configuration
      description: Updates authentication settings. Requires authentication if web auth is enabled.
      operationId: setAuthConfig
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                web_auth_enabled:
                  type: boolean
                  description: Enable/disable web interface authentication
                api_auth_enabled:
                  type: boolean
                  description: Enable/disable API key authentication
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          description: Login required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/status:
    get:
      tags:
        - Authentication
      summary: Quick auth status check
      description: Returns whether authentication is required and if current session is valid.
      operationId: getAuthStatus
      responses:
        '200':
          description: Authentication status
          content:
            application/json:
              schema:
                type: object
                properties:
                  web_auth_enabled:
                    type: boolean
                    example: true
                  session_valid:
                    type: boolean
                    description: Whether the current session cookie is valid
                    example: true

  /api/auth/credentials:
    post:
      tags:
        - Authentication
      summary: Update login credentials
      description: |
        Updates username and/or password. 
        
        **Note**: Changing credentials invalidates all active sessions.
      operationId: setCredentials
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: New username (omit to keep current)
                  example: admin
                password:
                  type: string
                  format: password
                  description: New password (omit or empty to keep current)
                  example: newpassword123
      responses:
        '200':
          description: Credentials updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          description: Login required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/apikey:
    get:
      tags:
        - Authentication
      summary: Get API key
      description: Returns the current API key. Requires authentication.
      operationId: getApiKey
      security:
        - sessionCookie: []
      responses:
        '200':
          description: API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key:
                    type: string
                    description: 32-character hex API key
                    example: a1b2c3d4e5f6789012345678abcdef01
        '401':
          description: Login required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/apikey/regenerate:
    post:
      tags:
        - Authentication
      summary: Regenerate API key
      description: |
        Generates a new random API key. 
        
        **Warning**: Existing API integrations using the old key will stop working.
      operationId: regenerateApiKey
      security:
        - sessionCookie: []
      responses:
        '200':
          description: New API key generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key:
                    type: string
                    description: New 32-character hex API key
                    example: fedcba9876543210fedcba9876543210
        '401':
          description: Login required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/heatpump/status:
    get:
      tags:
        - HeatPump
      summary: Heat pump status
      description: |
        Returns comprehensive heat pump status including connection state, operating mode,
        component states, temperatures, setpoints, and any error conditions.
      operationId: getHeatpumpStatus
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        '200':
          description: Heat pump status
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected:
                    type: boolean
                    description: Whether the heat pump is connected via Modbus
                    example: true
                  unit_on:
                    type: boolean
                    description: Whether the unit is powered on
                    example: true
                  mode:
                    type: string
                    enum: [cooling, floor_heating, fan_coil_heating, hot_water, auto, unknown]
                    description: Current operating mode
                    example: floor_heating
                  defrosting:
                    type: boolean
                    description: Whether the unit is in defrost cycle
                    example: false
                  compressor:
                    type: boolean
                    description: Compressor running state
                    example: true
                  fans:
                    type: boolean
                    description: Fan running state
                    example: true
                  fan_speed:
                    type: integer
                    minimum: 0
                    maximum: 3
                    description: Fan speed level (0=off, 1=low, 2=med, 3=high)
                    example: 2
                  pump:
                    type: boolean
                    description: Water circulation pump running state
                    example: true
                  aux_heater:
                    type: boolean
                    description: Auxiliary/backup electrical heater running state
                    example: false
                  temperatures:
                    type: object
                    description: Temperature readings in degrees Celsius
                    properties:
                      tank:
                        type: integer
                        description: Water tank temperature
                        example: 45
                      outlet:
                        type: integer
                        description: Water outlet temperature
                        example: 48
                      inlet:
                        type: integer
                        description: Water inlet temperature
                        example: 42
                      outdoor:
                        type: integer
                        description: Outdoor ambient temperature
                        example: 5
                  setpoints:
                    type: object
                    description: Temperature setpoints in degrees Celsius
                    properties:
                      cooling:
                        type: integer
                        description: Cooling mode setpoint
                        example: 7
                      heating:
                        type: integer
                        description: Heating mode setpoint
                        example: 45
                      hot_water:
                        type: integer
                        description: Hot water mode setpoint
                        example: 55
                  readings:
                    type: object
                    description: System readings
                    properties:
                      compressor_freq:
                        type: integer
                        description: Compressor frequency in Hz
                        example: 60
                      fan_rpm:
                        type: integer
                        description: Fan speed in RPM
                        example: 800
                      ac_voltage:
                        type: integer
                        description: AC input voltage
                        example: 230
                      ac_current:
                        type: integer
                        description: AC current draw
                        example: 5
                  has_error:
                    type: boolean
                    description: Whether the unit has any active errors
                    example: false
                  error:
                    type: string
                    nullable: true
                    description: Comma-separated list of active errors, or null if no errors
                    example: null
        '401':
          description: API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/heatpump/params:
    get:
      tags:
        - HeatPump
      summary: Get all P-parameters
      description: |
        Returns all configurable P-parameters with their current values.
        In demo mode, returns simulated values. When disconnected, values are null.
      operationId: getHeatpumpParams
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        '200':
          description: All P-parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected:
                    type: boolean
                    description: Whether heat pump is connected (or demo mode active)
                  demo_mode:
                    type: boolean
                    description: Whether demo mode is active
                  params:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/HeatPumpParam'
        '401':
          description: API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/heatpump/params/{id}:
    get:
      tags:
        - HeatPump
      summary: Get single P-parameter
      description: |
        Returns a single P-parameter by its key (e.g., `defrost_cycle`) or P-code (e.g., `P29`).
        P-code lookup is case-insensitive.
      operationId: getHeatpumpParam
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Parameter key (e.g., `defrost_cycle`) or P-code (e.g., `P29`)
          schema:
            type: string
          examples:
            by_key:
              value: defrost_cycle
              summary: By descriptive key
            by_pcode:
              value: P29
              summary: By P-code
      responses:
        '200':
          description: Parameter details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/HeatPumpParam'
                  - type: object
                    properties:
                      connected:
                        type: boolean
                      demo_mode:
                        type: boolean
        '404':
          description: Unknown parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - HeatPump
      summary: Set P-parameter value
      description: |
        Sets a P-parameter value. The request body is a plain integer (not JSON).
        Values are validated against min/max range. Works in demo mode (updates in-memory values).
      operationId: setHeatpumpParam
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Parameter key or P-code
          schema:
            type: string
      requestBody:
        required: true
        description: Plain integer value (not JSON)
        content:
          text/plain:
            schema:
              type: integer
            example: 45
      responses:
        '200':
          description: Value set successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  key:
                    type: string
                  p_code:
                    type: string
                  value:
                    type: integer
                  demo_mode:
                    type: boolean
        '400':
          description: Invalid value or out of range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Heat pump not connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for programmatic access (32-character hex string)
    sessionCookie:
      type: apiKey
      in: cookie
      name: arctic_session
      description: Session cookie obtained from /login endpoint

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message

    HeatPumpParam:
      type: object
      description: Heat pump P-parameter definition and value
      properties:
        key:
          type: string
          description: Descriptive API key
          example: defrost_cycle
        p_code:
          type: string
          description: Arctic P-code identifier
          example: P29
        name:
          type: string
          description: Human-readable name
          example: Defrost Cycle
        description:
          type: string
          description: Detailed description
          example: Minimum time between defrost cycles during heating operation.
        unit:
          type: string
          description: Unit of measurement
          enum: ['', steps, min, sec, °C]
          example: min
        min:
          type: integer
          description: Minimum allowed value
          example: 30
        max:
          type: integer
          description: Maximum allowed value
          example: 120
        category:
          type: string
          description: Parameter category for grouping
          example: Defrost
        value:
          type: integer
          nullable: true
          description: Current value (null if disconnected and not in demo mode)
          example: 45
