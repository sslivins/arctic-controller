        When disconnected, values are null. Only parameters whose wire register has
        been change-and-capture verified are included.
      operationId: getHeatpumpAdvanced
      security:
        - apiKey: []
        - sessionCookie: []
      responses:
        '200':
          description: All advanced parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected:
                    type: boolean
                    description: Whether heat pump is connected (or demo mode active)
                  demo_mode:
                    type: boolean
                    description: Whether demo mode is active
                  params:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/AdvancedParam'
        '401':
          description: API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/heatpump/advanced/{id}:
    get:
      tags:
        - HeatPump
      summary: Get single advanced (AP) parameter
      description: |
        Returns a single advanced parameter by its key (e.g., `AP13`) or bare AP
        number (e.g., `13`).
      operationId: getHeatpumpAdvancedParam
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: AP key (e.g., `AP13`) or bare AP number (e.g., `13`)
          schema:
            type: string
          examples:
            by_key:
              value: AP13
              summary: By AP key
            by_number:
              value: '13'
              summary: By bare AP number
      responses:
        '200':
          description: Parameter details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdvancedParam'
                  - type: object
                    properties:
                      key:
                        type: string
                      connected:
                        type: boolean
                      demo_mode:
                        type: boolean
        '404':
          description: Unknown parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - HeatPump
      summary: Set advanced (AP) parameter value
      description: |
        Sets an advanced parameter value. The request body is a plain integer (not JSON).
        The write passes through the arctic-macon guardrail (range/enum validation,
        confirmed-register check, and write-lock), so read-only, trigger, and
        unverified parameters are refused. Works in demo mode (updates in-memory values).
      operationId: setHeatpumpAdvancedParam
      security:
        - apiKey: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: AP key or bare AP number
          schema:
            type: string
      requestBody:
        required: true
        description: Plain integer value (not JSON)
        content:
          text/plain:
            schema:
              type: integer
            example: 45
      responses:
        '200':
          description: Value set successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  ap:
                    type: integer
                  value:
                    type: integer
                  demo_mode:
                    type: boolean
        '400':
          description: Invalid value, out of range, or write refused by guardrail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Heat pump not connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

