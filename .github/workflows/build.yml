name: Build

on:
  push:
    branches:
      - main
    paths:
      - 'main/**'
      - 'components/**'
      - 'managed_components/**'
      - 'dependencies/**'
      - 'CMakeLists.txt'
      - 'sdkconfig*'
      - 'partitions.csv'
      - 'lv_conf.h'
      - 'repos.json'
      - 'fetch_repos.py'
      - 'patches/**'
      - '.github/workflows/build.yml'
  # No `pull_request` trigger: the PR path runs through ci.yml, which has no
  # paths filter and calls this workflow. An `on:`-level paths filter creates
  # NO check run, so a required context never reports and the PR blocks
  # forever; ci.yml always reports instead. `merge_group` is driven by ci.yml
  # for the same reason.
  workflow_call:
  workflow_dispatch:
    inputs:
      target:
        description: 'ESP32 target chip'
        required: false
        default: 'esp32p4'
        type: choice
        options:
          - esp32p4

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.target || 'esp32p4' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Extract version from CMakeLists.txt
        id: version
        run: |
          VERSION=$(grep -oP 'set\(PROJECT_VER\s*"\K[^"]+' CMakeLists.txt)
          if [ -z "$VERSION" ]; then
            echo "::warning::Could not extract PROJECT_VER from CMakeLists.txt, using 'unknown'"
            VERSION="unknown"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building version: $VERSION"

      - name: Fetch dependencies
        run: python3 fetch_repos.py

      - name: Stamp build fingerprint
        run: |
          echo -n "${GITHUB_SHA}" > build_sha.txt
          echo "Baked build_sha=${GITHUB_SHA}"

      - name: Disable test endpoints for production build
        run: |
          echo "CONFIG_TEST_ENDPOINTS=n" >> sdkconfig.defaults

      - name: ESP-IDF Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: ${{ env.TARGET }}
          path: '.'

      - name: Verify production bus mode is the active master
        # The IDF v6.1 sdkconfig regeneration silently reverted the bus mode to
        # passive LISTEN, which never polls the heat pump, and every build
        # stayed green. Assert the EFFECTIVE compiled config instead.
        run: |
          if ! grep -q '^#define CONFIG_ARCTIC_TUYA_MASTER 1$' build/config/sdkconfig.h; then
            echo "::error::CONFIG_ARCTIC_TUYA_MASTER is NOT set in the compiled firmware — this image would never poll the heat pump."
            exit 1
          fi
          echo "OK: CONFIG_ARCTIC_TUYA_MASTER=y in compiled firmware"

      - name: Verify OTA rollback protection is enabled
        # P0 tripwire: assert the EFFECTIVE compiled config (not what
        # sdkconfig.defaults merely requests) has bootloader app rollback
        # enabled. A committed/stale sdkconfig silently overrides the default,
        # which would ship firmware with the OTA rollback safety net disabled
        # (esp_ota_mark_app_valid_cancel_rollback() becomes dead code because
        # the bootloader never arms PENDING_VERIFY). A disabled bool has NO
        # #define in sdkconfig.h, so this fails loudly. If it ever regresses we
        # must know immediately, on every build.
        run: |
          if ! grep -q '^#define CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE 1$' build/config/sdkconfig.h; then
            echo "::error::CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE is NOT enabled in the compiled firmware — OTA rollback protection is OFF. A bad OTA would not auto-roll-back. Set it =y in the committed sdkconfig to match sdkconfig.defaults."
            exit 1
          fi
          echo "OK: CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y in compiled firmware"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-v${{ steps.version.outputs.version }}-${{ env.TARGET }}
          path: |
            build/arctic_controller.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
          retention-days: 30

      - name: Build summary
        run: |
          echo "## Build Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | ${{ env.TARGET }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ESP-IDF | v6.1 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- \`arctic_controller.bin\` - Main firmware (for OTA)" >> $GITHUB_STEP_SUMMARY
          echo "- \`bootloader.bin\` - Bootloader" >> $GITHUB_STEP_SUMMARY
          echo "- \`partition-table.bin\` - Partition table" >> $GITHUB_STEP_SUMMARY
          echo "- \`ota_data_initial.bin\` - OTA data partition" >> $GITHUB_STEP_SUMMARY

  # Compile-only guard for the demo-mode removal path. The production image
  # ships with CONFIG_DEMO_MODE=y, so the =n branches (all the #if
  # CONFIG_DEMO_MODE / #else gating around the demo scaffolding) are never
  # exercised by the main build. Build once with demo disabled AND test
  # endpoints enabled so the trickiest demo-off #else branches in
  # test_endpoints.cpp are actually compiled. No artifacts are published; this
  # job exists solely to keep the "ship without demo" path healthy.
  build-demo-disabled:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.target || 'esp32p4' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Fetch dependencies
        run: python3 fetch_repos.py

      - name: Stamp build fingerprint
        run: |
          echo -n "${GITHUB_SHA}" > build_sha.txt

      - name: Disable demo mode (keep test endpoints to cover demo-off branches)
        # Edit the committed sdkconfig, not sdkconfig.defaults: sdkconfig wins,
        # so a defaults line is silently ignored for any option it already sets
        # (both of these), and this job used to compile demo-off WITHOUT test
        # endpoints. The verify step below asserts the effective config.
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("sdkconfig")
          config = path.read_text(encoding="utf-8")
          for old, new in (
              ("CONFIG_DEMO_MODE=y", "# CONFIG_DEMO_MODE is not set"),
              ("# CONFIG_TEST_ENDPOINTS is not set", "CONFIG_TEST_ENDPOINTS=y"),
          ):
              if old not in config:
                  raise SystemExit(f"expected {old!r} in sdkconfig")
              config = config.replace(old, new, 1)
          path.write_text(config, encoding="utf-8")
          PY
          grep -q '^# CONFIG_DEMO_MODE is not set$' sdkconfig
          grep -q '^CONFIG_TEST_ENDPOINTS=y$' sdkconfig

      - name: ESP-IDF Build (demo disabled)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: ${{ env.TARGET }}
          path: '.'

      - name: Verify demo mode is compiled out
        run: |
          if grep -q '^#define CONFIG_DEMO_MODE 1$' build/config/sdkconfig.h; then
            echo "::error::CONFIG_DEMO_MODE is still enabled in this variant — the demo-disabled build did not take effect."
            exit 1
          fi
          if ! grep -q '^#define CONFIG_TEST_ENDPOINTS 1$' build/config/sdkconfig.h; then
            echo "::error::CONFIG_TEST_ENDPOINTS is NOT set in this variant — the demo-off branches in test_endpoints.cpp were not compiled."
            exit 1
          fi
          echo "OK: CONFIG_DEMO_MODE is disabled and CONFIG_TEST_ENDPOINTS enabled in the compiled firmware"

  # Compile-only guard for the passive LISTEN bus mode. Production (and the
  # device-tests suite) builds the default ARCTIC_TUYA_MASTER branch, so
  # main/tuya/tuya_listener.cpp is otherwise never compiled. This keeps the
  # bench/validation variant buildable.
  build-tuya-listen:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.target || 'esp32p4' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Fetch dependencies
        run: python3 fetch_repos.py

      - name: Stamp build fingerprint
        run: |
          echo -n "${GITHUB_SHA}" > build_sha.txt

      - name: Select the passive Tuya listen bus mode
        # ARCTIC_BUS_MODE is a Kconfig `choice`, so the MASTER member must be
        # cleared as LISTEN is set. Write both the committed sdkconfig (which
        # takes precedence when present) and sdkconfig.defaults, so the variant
        # applies regardless of which one the build regenerates from. The
        # verify step below is the real guard.
        run: |
          sed -i 's/^CONFIG_ARCTIC_TUYA_MASTER=y$/# CONFIG_ARCTIC_TUYA_MASTER is not set/' sdkconfig
          sed -i 's/^# CONFIG_ARCTIC_TUYA_LISTEN is not set$/CONFIG_ARCTIC_TUYA_LISTEN=y/' sdkconfig
          sed -i 's/^CONFIG_ARCTIC_TUYA_MASTER=y$/CONFIG_ARCTIC_TUYA_LISTEN=y/' sdkconfig.defaults

      - name: ESP-IDF Build (passive Tuya listen)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: ${{ env.TARGET }}
          path: '.'

      - name: Verify the passive listen path was actually compiled
        # Without this, a failure to apply the config would silently rebuild the
        # default MASTER variant and report a green "listen builds fine".
        run: |
          if ! grep -q '^#define CONFIG_ARCTIC_TUYA_LISTEN 1$' build/config/sdkconfig.h; then
            echo "::error::CONFIG_ARCTIC_TUYA_LISTEN is NOT set in the compiled firmware — this job rebuilt the default MASTER variant and proved nothing about the listen path."
            exit 1
          fi
          if grep -q '^#define CONFIG_ARCTIC_TUYA_MASTER 1$' build/config/sdkconfig.h; then
            echo "::error::CONFIG_ARCTIC_TUYA_MASTER is still set alongside LISTEN — the bus-mode choice was not switched cleanly."
            exit 1
          fi
          echo "OK: firmware compiled with CONFIG_ARCTIC_TUYA_LISTEN=y"
