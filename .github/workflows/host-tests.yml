name: Host Tests

# Fast, hardware-free gate. These tests read the firmware/web sources and
# static contracts (openapi, partition layout, i18n, etc.) and never touch the
# physical controller, so they run on a hosted runner in seconds. They are
# selected by the `hostside` pytest marker rather than a hard-coded file list,
# so any newly-marked test is automatically covered.
#
# Intentionally has NO `paths:` filter: a required check that gets skipped by a
# path filter stays pending forever and blocks the merge queue. Keeping this
# always-on guarantees it reports a conclusion on every PR and merge group.
#
# The PR and merge-queue paths now arrive via ci.yml (`workflow_call`), which
# is itself unfiltered, so that property is preserved.

on:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run host-side tests (no hardware)
        # tests/web has its own playwright dependency set and is browser-only;
        # exclude it from collection so a missing browser dep can't abort the
        # host-side run. The `hostside` marker still deselects everything else.
        run: >-
          python -m pytest tests -m hostside --ignore=tests/web -v --tb=short
          -p no:cacheprovider --junitxml=host-test-results.xml

      - name: Publish host-side test results
        uses: dorny/test-reporter@v2
        if: always()
        # Publishing is cosmetic: it turns the JUnit XML into a check run.
        # The pytest step above has no continue-on-error, so a real test
        # failure already fails this job on its own. Without this, a transient
        # check-run API error (a bare HttpError from the action's top-level
        # catch, which `fail-on-error` does not suppress) fails a job in which
        # every test passed, fails ci-gate, and blocks the merge.
        continue-on-error: true
        with:
          name: Host-Side Test Results
          path: host-test-results.xml
          reporter: java-junit
          use-actions-summary: 'false'

  # The arctic-macon submodule ships 11 native (host) unit-test binaries and its
  # own native-tests.yml -- but that workflow only gates the SUBMODULE's repo.
  # Nothing here ran them, so a submodule bump could land in this repo entirely
  # unverified, despite arctic-macon owning the Tuya/Modbus codec, fault
  # identity and MaconLink framing that the controller depends on.
  #
  # The tests build against the library's non-ESP (native) CMake branch, so they
  # need no toolchain and finish in seconds on a hosted runner.
  macon-native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Guard against an unpopulated submodule
        # A silently-empty submodule would make cmake fail in a confusing way,
        # or worse, let a future refactor turn this job into a no-op that still
        # reports success.
        run: |
          if [ ! -f components/arctic-macon/tests/CMakeLists.txt ]; then
            echo "::error::components/arctic-macon was not checked out — the native test suite cannot run."
            exit 1
          fi

      - name: Configure native test build
        run: cmake -S components/arctic-macon/tests -B build-macon-tests

      - name: Build native tests
        run: cmake --build build-macon-tests --parallel

      - name: Run native tests
        run: ctest --test-dir build-macon-tests --output-on-failure

      - name: Assert the suite actually executed tests
        # ctest exits 0 when it runs zero tests. Without a floor, dropping or
        # renaming the add_test() calls would leave this job green while
        # testing nothing.
        run: |
          COUNT=$(ctest --test-dir build-macon-tests -N | sed -n 's/^Total Tests: //p')
          echo "ctest reports ${COUNT:-0} registered tests"
          if [ -z "${COUNT}" ] || [ "${COUNT}" -lt 8 ]; then
            echo "::error::Only ${COUNT:-0} arctic-macon native tests were registered (expected at least 8). Tests were dropped, or the suite failed to configure."
            exit 1
          fi

  main-native-tests:
    # Compiles host-testable sources from main/ against the stubs in
    # main/tests/host_stubs/ and runs them. This is the only place firmware
    # code under main/ is executed outside the single physical controller:
    # everything else that claims to test main/ is either a source lint or a
    # black-box HTTP call to the device.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure native test build
        run: cmake -S main/tests -B build-main-tests

      - name: Build native tests
        run: cmake --build build-main-tests --parallel

      - name: Run native tests
        run: ctest --test-dir build-main-tests --output-on-failure

      - name: Assert the suite actually executed tests
        # ctest exits 0 when it runs zero tests, so without a floor an empty or
        # mis-configured suite reports success. Raise this number as sources are
        # added to MAIN_HOST_SRCS.
        run: |
          COUNT=$(ctest --test-dir build-main-tests -N | sed -n 's/^Total Tests: //p')
          echo "ctest reports ${COUNT:-0} registered tests"
          if [ -z "${COUNT}" ] || [ "${COUNT}" -lt 10 ]; then
            echo "::error::Only ${COUNT:-0} main/ native tests were registered (expected at least 10). Tests were dropped, or the suite failed to configure."
            exit 1
          fi

      - name: Assert the host build really compiled main/ sources
        # The stubs make it easy for this job to degrade into "compiled the
        # stubs and the test file, and nothing from main/ at all", which would
        # still link and still pass. Check the object files exist.
        run: |
          for OBJ in i18n.cpp.o history_storage.cpp.o auth_manager.cpp.o log_buffer.cpp.o event_log.cpp.o log_persist.cpp.o boot_stats.cpp.o time_manager.cpp.o iana_tz.cpp.o location_manager.cpp.o; do
            if ! find build-main-tests -name "$OBJ" | grep -q .; then
              echo "::error::$OBJ was not compiled by the host build — MAIN_HOST_SRCS has probably been emptied."
              find build-main-tests -name '*.o' -print
              exit 1
            fi
          done
          echo "Host build compiled:"
          find build-main-tests -name '*.o' -printf '  %f\n'

