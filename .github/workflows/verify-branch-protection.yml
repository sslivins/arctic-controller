name: Verify Branch Protection

on:
  schedule:
    # Run daily at 6 AM UTC to ensure protection rules remain in place
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify branch protection is configured
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking branch protection for main branch..."
          
          # Get branch protection settings
          RESPONSE=$(curl -s -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/branches/main/protection")
          
          # Check if protection exists
          if echo "$RESPONSE" | grep -q '"message": "Branch not protected"'; then
            echo "❌ ERROR: Branch protection is NOT configured for main branch!"
            echo ""
            echo "To fix this, run:"
            echo "  export GITHUB_TOKEN=your_token_here"
            echo "  ./scripts/setup-branch-protection.sh"
            echo ""
            echo "Or manually configure at:"
            echo "  https://github.com/${{ github.repository }}/settings/branches"
            exit 1
          fi
          
          echo "✅ Branch protection is enabled"
          
          # Verify required status checks
          echo ""
          echo "Checking required status checks..."
          
          CHECKS=$(echo "$RESPONSE" | jq -r '.required_status_checks.checks[]?.context' 2>/dev/null || echo "")
          
          if [ -z "$CHECKS" ]; then
            echo "⚠️  WARNING: No required status checks found!"
            echo "Expected checks:"
            echo "  - Build"
            echo "  - Device Tests / build"
            echo "  - Device Tests / device-tests"
            exit 1
          fi
          
          echo "Required checks:"
          echo "$CHECKS"
          
          # Verify specific checks
          MISSING=""
          
          if ! echo "$CHECKS" | grep -q "^Build$"; then
            MISSING="${MISSING}\n  - Build"
          fi
          
          if ! echo "$CHECKS" | grep -q "^Device Tests / build$"; then
            MISSING="${MISSING}\n  - Device Tests / build"
          fi
          
          if ! echo "$CHECKS" | grep -q "^Device Tests / device-tests$"; then
            MISSING="${MISSING}\n  - Device Tests / device-tests"
          fi
          
          if [ -n "$MISSING" ]; then
            echo ""
            echo "❌ ERROR: Missing required status checks:"
            echo -e "$MISSING"
            echo ""
            echo "Run ./scripts/setup-branch-protection.sh to fix"
            exit 1
          fi
          
          echo ""
          echo "✅ All required status checks are configured correctly"
          
          # Check if strict mode is enabled
          STRICT=$(echo "$RESPONSE" | jq -r '.required_status_checks.strict')
          if [ "$STRICT" = "true" ]; then
            echo "✅ Branches must be up to date before merging"
          else
            echo "⚠️  WARNING: Branches are not required to be up to date"
          fi

      - name: Summary
        if: success()
        run: |
          echo "## ✅ Branch Protection Verified" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The main branch is properly protected with required status checks." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Required Status Checks" >> $GITHUB_STEP_SUMMARY
          echo "- Build" >> $GITHUB_STEP_SUMMARY
          echo "- Device Tests / build" >> $GITHUB_STEP_SUMMARY
          echo "- Device Tests / device-tests" >> $GITHUB_STEP_SUMMARY
