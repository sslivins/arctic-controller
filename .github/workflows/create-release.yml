name: Create Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (check version and build without releasing)'
        required: false
        default: false
        type: boolean

# Device serialization is handled by the device-tests.yml reusable workflow's
# own concurrency group — no need to duplicate it here.

permissions:
  contents: write
  checks: write

jobs:
  device-tests:
    uses: ./.github/workflows/device-tests.yml
    secrets: inherit

  build-and-release:
    needs: device-tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: 'recursive'
          token: ${{ secrets.ARCTIC_RELEASE_TOKEN }}

      - name: Extract version from CMakeLists.txt
        id: version
        run: |
          VERSION=$(grep -oP 'set\(PROJECT_VER\s*"\K[^"]+' CMakeLists.txt)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract PROJECT_VER from CMakeLists.txt"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Found version: $VERSION (tag: v$VERSION)"

      - name: Check if tag already exists
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists! Bump PROJECT_VER in CMakeLists.txt first."
            exit 1
          fi
          echo "✅ Tag $TAG does not exist yet"

      - name: Fetch dependencies
        run: python3 fetch_repos.py

      - name: ESP-IDF Production Build (no test endpoints)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32p4
          path: '.'

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "🔍 Dry run complete"
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Tag: ${{ steps.version.outputs.tag }}"
          echo "Build: ✅ Success"
          echo "No tag or release was created."

      - name: Create and push tag
        if: ${{ !inputs.dry_run }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "$TAG"
          
          echo "🏷️ Created tag: $TAG"

      - name: Upload firmware artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ steps.version.outputs.tag }}
          path: |
            build/arctic_controller.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
          retention-days: 90

      - name: Generate changelog from conventional commits
        if: ${{ !inputs.dry_run }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"

          # Find the previous tag
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n1)
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          echo "Generating changelog: ${PREV_TAG:-initial}..${TAG}"

          # Collect commits by category using sed to strip prefix
          FEATURES=$(git log ${RANGE} --oneline --no-merges --grep="^feat" | sed 's/^[a-f0-9]* feat[^:]*: //' || true)
          FIXES=$(git log ${RANGE} --oneline --no-merges --grep="^fix" | sed 's/^[a-f0-9]* fix[^:]*: //' || true)
          REFACTORS=$(git log ${RANGE} --oneline --no-merges --grep="^refactor" | sed 's/^[a-f0-9]* refactor[^:]*: //' || true)
          TESTS=$(git log ${RANGE} --oneline --no-merges --grep="^test" | sed 's/^[a-f0-9]* test[^:]*: //' || true)
          DOCS=$(git log ${RANGE} --oneline --no-merges --grep="^docs" | sed 's/^[a-f0-9]* docs[^:]*: //' || true)
          CI_CHANGES=$(git log ${RANGE} --oneline --no-merges --grep="^ci" | sed 's/^[a-f0-9]* ci[^:]*: //' || true)

          # Build release body
          {
            echo "## Arctic Heat Pump Controller ${TAG}"
            echo ""

            if [ -n "$FEATURES" ]; then
              echo "### ✨ Features"
              echo "$FEATURES" | while IFS= read -r line; do echo "- $line"; done
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Fixes"
              echo "$FIXES" | while IFS= read -r line; do echo "- $line"; done
              echo ""
            fi
            if [ -n "$REFACTORS" ]; then
              echo "### ♻️ Refactors"
              echo "$REFACTORS" | while IFS= read -r line; do echo "- $line"; done
              echo ""
            fi
            if [ -n "$TESTS" ]; then
              echo "### 🧪 Tests"
              echo "$TESTS" | while IFS= read -r line; do echo "- $line"; done
              echo ""
            fi
            if [ -n "$DOCS" ]; then
              echo "### 📝 Documentation"
              echo "$DOCS" | while IFS= read -r line; do echo "- $line"; done
              echo ""
            fi
            if [ -n "$CI_CHANGES" ]; then
              echo "### 🔧 CI"
              echo "$CI_CHANGES" | while IFS= read -r line; do echo "- $line"; done
              echo ""
            fi

            echo "---"
            echo ""
            echo "### Installation"
            echo ""
            echo "**For fresh install (via USB):**"
            echo "Download all files and flash with esptool:"
            echo '```bash'
            echo "esptool.py --chip esp32p4 write_flash \\"
            echo "  0x2000 bootloader.bin \\"
            echo "  0x8000 partition-table.bin \\"
            echo "  0x49000 ota_data_initial.bin \\"
            echo "  0x50000 arctic_controller.bin"
            echo '```'
            echo ""
            echo "**For OTA update:**"
            echo "OTA is supported only after the device has received this partition layout once via USB."
            echo "Use \`arctic_controller.bin\` with the device's OTA API:"
            echo '```bash'
            echo "curl -X POST http://arctic.local/api/ota/update \\"
            echo "  -H \"Content-Type: application/json\" \\"
            echo "  -d '{\"url\":\"https://github.com/${REPO}/releases/download/${VERSION}/arctic_controller.bin\"}'"
            echo '```'
          } > /tmp/release_body.md

          echo "📋 Generated release body:"
          cat /tmp/release_body.md

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Arctic Controller ${{ steps.version.outputs.tag }}
          body_path: /tmp/release_body.md
          draft: false
          files: |
            build/arctic_controller.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
        env:
          GITHUB_TOKEN: ${{ secrets.ARCTIC_RELEASE_TOKEN }}

      - name: Release summary
        if: ${{ !inputs.dry_run }}
        run: |
          echo "## Release Created ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.version.outputs.tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | esp32p4 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files" >> $GITHUB_STEP_SUMMARY
          echo "- \`arctic_controller.bin\` - Main firmware (for OTA updates)" >> $GITHUB_STEP_SUMMARY
          echo "- \`bootloader.bin\` - Bootloader" >> $GITHUB_STEP_SUMMARY
          echo "- \`partition-table.bin\` - Partition table" >> $GITHUB_STEP_SUMMARY
          echo "- \`ota_data_initial.bin\` - OTA data partition" >> $GITHUB_STEP_SUMMARY

  # Prepare main for the next release only after tests, build, tag, and
  # publication all succeed. The release token is required so the push can
  # update the protected main branch and trigger normal branch workflows.
  bump-main:
    needs: build-and-release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.ARCTIC_RELEASE_TOKEN }}

      - name: Bump patch version and push
        env:
          RELEASED_VERSION: ${{ needs.build-and-release.outputs.version }}
          RELEASED_TAG: ${{ needs.build-and-release.outputs.tag }}
        run: |
          set -euo pipefail

          current=$(grep -oP 'set\(PROJECT_VER\s*"\K[^"]+' CMakeLists.txt)
          if [ "$current" != "$RELEASED_VERSION" ]; then
            echo "::error::main version $current no longer matches released version $RELEASED_VERSION"
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$current"
          next="${major}.${minor}.$((patch + 1))"
          echo "Bumping: $current -> $next"
          sed -i -E "s/set\(PROJECT_VER \"[^\"]+\"\)/set(PROJECT_VER \"$next\")/" CMakeLists.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git commit -m "chore: bump version to $next [skip ci]" \
                     -m "Auto-bumped by create-release.yml after $RELEASED_TAG." \
                     -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main
