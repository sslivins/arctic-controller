name: Create Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (check version and build without releasing)'
        required: false
        default: false
        type: boolean
      target_sha:
        description: 'Full commit SHA on main to release (defaults to current main HEAD)'
        required: false
        default: ''
        type: string

# This workflow no longer runs the physical device suite. It consumes the
# attestation produced by the authoritative post-merge device-tests.yml run
# for the exact target SHA, so releases never re-run the ~40-minute hardware
# suite and there is no device to serialize here.

permissions:
  contents: write
  checks: write
  actions: read

jobs:
  verify-validation:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and require a full target SHA
        id: resolve
        env:
          INPUT_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          MAIN_SHA=$(git rev-parse origin/main)
          if [ -n "$INPUT_SHA" ]; then
            # Expand to a full SHA and require it to be an ancestor-or-equal of main.
            TARGET_SHA=$(git rev-parse "$INPUT_SHA^{commit}")
          else
            TARGET_SHA="$MAIN_SHA"
          fi
          if [ "$TARGET_SHA" != "$MAIN_SHA" ]; then
            echo "::error::Target SHA $TARGET_SHA is not the current main HEAD ($MAIN_SHA). Releases must target main's tip."
            exit 1
          fi
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "✅ Release target SHA: $TARGET_SHA"

      - name: Require a successful post-merge device validation for this SHA
        id: run
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          RUNS=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/device-tests.yml/runs?head_sha=$TARGET_SHA&event=push&status=completed&per_page=100")
          RUN_ID=$(echo "$RUNS" | jq -r \
            '[.workflow_runs[] | select(.conclusion=="success")] | sort_by(.run_started_at) | last | .id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful push-to-main device-tests run found for $TARGET_SHA. The exact commit must pass the physical device suite before it can be released."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "✅ Found validated run $RUN_ID for $TARGET_SHA"

      - name: Download and verify the validation attestation
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "${{ github.repository }}" \
            -n "release-attestation-$TARGET_SHA" -D attestation
          FILE=attestation/release-attestation.json
          if [ ! -f "$FILE" ]; then
            echo "::error::Validation run $RUN_ID did not publish a release attestation."
            exit 1
          fi
          echo "Attestation contents:"; cat "$FILE"
          TREE_SHA=$(git rev-parse "$TARGET_SHA^{tree}")
          jq -e --arg sha "$TARGET_SHA" '.commit_sha == $sha' "$FILE" > /dev/null \
            || { echo "::error::Attestation commit_sha does not match $TARGET_SHA"; exit 1; }
          jq -e --arg t "$TREE_SHA" '.tree_sha == $t' "$FILE" > /dev/null \
            || { echo "::error::Attestation tree_sha does not match $TREE_SHA"; exit 1; }
          jq -e '.suites.ui == "success" and .suites.api == "success" and .suites.web == "success"' "$FILE" > /dev/null \
            || { echo "::error::Attestation records a non-passing suite"; exit 1; }
          echo "✅ Attestation verified for $TARGET_SHA (run $RUN_ID)"

  build-and-release:
    needs: verify-validation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-validation.outputs.sha }}
          fetch-depth: 0
          submodules: 'recursive'
          token: ${{ secrets.ARCTIC_RELEASE_TOKEN }}

      - name: Verify main still points to the validated SHA
        env:
          TARGET_SHA: ${{ needs.verify-validation.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          MAIN_SHA=$(git rev-parse origin/main)
          if [ "$MAIN_SHA" != "$TARGET_SHA" ]; then
            echo "::error::main advanced to $MAIN_SHA after validation ($TARGET_SHA). Re-run the release for the new HEAD."
            exit 1
          fi
          echo "✅ main still points to the validated SHA $TARGET_SHA"

      - name: Extract version from CMakeLists.txt
        id: version
        run: |
          VERSION=$(grep -oP 'set\(PROJECT_VER\s*"\K[^"]+' CMakeLists.txt)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract PROJECT_VER from CMakeLists.txt"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Found version: $VERSION (tag: v$VERSION)"

      - name: Check if tag already exists
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists! Bump PROJECT_VER in CMakeLists.txt first."
            exit 1
          fi
          echo "✅ Tag $TAG does not exist yet"

      - name: Fetch dependencies
        run: python3 fetch_repos.py

      - name: Verify production security configuration
        run: |
          if grep -q '^CONFIG_TEST_ENDPOINTS=y' sdkconfig sdkconfig.defaults; then
            echo "::error::Production releases must not include /api/test/* endpoints"
            exit 1
          fi

      - name: ESP-IDF Production Build (no test endpoints)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32p4
          path: '.'

      - name: Record production firmware provenance
        env:
          TARGET_SHA: ${{ needs.verify-validation.outputs.sha }}
        run: |
          set -euo pipefail
          PROD_DIGEST=$(sha256sum build/arctic_controller.bin | awk '{print $1}')
          echo "PROD_FW_SHA256=$PROD_DIGEST" >> "$GITHUB_ENV"
          {
            echo "### Production firmware provenance"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Source SHA | \`$TARGET_SHA\` |"
            echo "| Production firmware SHA256 | \`$PROD_DIGEST\` |"
            echo "| Test endpoints | disabled |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Production firmware sha256: $PROD_DIGEST (source $TARGET_SHA)"

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "🔍 Dry run complete"
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Tag: ${{ steps.version.outputs.tag }}"
          echo "Build: ✅ Success"
          echo "No tag or release was created."

      - name: Create and push tag
        if: ${{ !inputs.dry_run }}
        env:
          TARGET_SHA: ${{ needs.verify-validation.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          # Final guard: refuse to tag if main advanced past the validated SHA
          # during the production build. This shrinks the TOCTOU window to the
          # moment between this check and the tag push; the tag is always
          # annotated on the validated TARGET_SHA that is checked out here.
          git fetch origin main --depth=1
          MAIN_SHA=$(git rev-parse origin/main)
          if [ "$MAIN_SHA" != "$TARGET_SHA" ]; then
            echo "::error::main advanced to $MAIN_SHA after validation ($TARGET_SHA); aborting before tag. Re-run the release for the new HEAD."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" "$TARGET_SHA" -m "Release $VERSION"
          git push origin "$TAG"

          echo "🏷️ Created tag: $TAG -> $TARGET_SHA"

      - name: Upload firmware artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ steps.version.outputs.tag }}
          path: |
            build/arctic_controller.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
          retention-days: 90

      - name: Generate changelog from conventional commits
        if: ${{ !inputs.dry_run }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"

          # Find the previous tag
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n1)
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          echo "Generating changelog: ${PREV_TAG:-initial}..${TAG}"

          # Collect commits by category using sed to strip prefix
          FEATURES=$(git log ${RANGE} --oneline --no-merges --grep="^feat" | sed 's/^[a-f0-9]* feat[^:]*: //' || true)
          FIXES=$(git log ${RANGE} --oneline --no-merges --grep="^fix" | sed 's/^[a-f0-9]* fix[^:]*: //' || true)
          REFACTORS=$(git log ${RANGE} --oneline --no-merges --grep="^refactor" | sed 's/^[a-f0-9]* refactor[^:]*: //' || true)
          TESTS=$(git log ${RANGE} --oneline --no-merges --grep="^test" | sed 's/^[a-f0-9]* test[^:]*: //' || true)
          DOCS=$(git log ${RANGE} --oneline --no-merges --grep="^docs" | sed 's/^[a-f0-9]* docs[^:]*: //' || true)
          CI_CHANGES=$(git log ${RANGE} --oneline --no-merges --grep="^ci" | sed 's/^[a-f0-9]* ci[^:]*: //' || true)

          # Build release body
          {
            echo "## Arctic Heat Pump Controller ${TAG}"
            echo ""

            if [ -n "$FEATURES" ]; then
              echo "### ✨ Features"
              echo "$FEATURES" | while IFS= read -r line; do echo "- $line"; done
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Fixes"
              echo "$FIXES" | while IFS= read -r line; do echo "- $line"; done
              echo ""
            fi
            if [ -n "$REFACTORS" ]; then
              echo "### ♻️ Refactors"
              echo "$REFACTORS" | while IFS= read -r line; do echo "- $line"; done
              echo ""
            fi
            if [ -n "$TESTS" ]; then
              echo "### 🧪 Tests"
              echo "$TESTS" | while IFS= read -r line; do echo "- $line"; done
              echo ""
            fi
            if [ -n "$DOCS" ]; then
              echo "### 📝 Documentation"
              echo "$DOCS" | while IFS= read -r line; do echo "- $line"; done
              echo ""
            fi
            if [ -n "$CI_CHANGES" ]; then
              echo "### 🔧 CI"
              echo "$CI_CHANGES" | while IFS= read -r line; do echo "- $line"; done
              echo ""
            fi

            echo "---"
            echo ""
            echo "### Installation"
            echo ""
            echo "**For fresh install (via USB):**"
            echo "Download all files and flash with esptool:"
            echo '```bash'
            echo "esptool.py --chip esp32p4 write_flash \\"
            echo "  0x2000 bootloader.bin \\"
            echo "  0x8000 partition-table.bin \\"
            echo "  0x49000 ota_data_initial.bin \\"
            echo "  0x50000 arctic_controller.bin"
            echo '```'
            echo ""
            echo "**For OTA update:**"
            echo "OTA is supported only after the device has received this partition layout once via USB."
            echo "Use \`arctic_controller.bin\` with the device's OTA API:"
            echo '```bash'
            echo "curl -X POST http://arctic.local/api/ota/update \\"
            echo "  -H \"Content-Type: application/json\" \\"
            echo "  -d '{\"url\":\"https://github.com/${REPO}/releases/download/${VERSION}/arctic_controller.bin\"}'"
            echo '```'
          } > /tmp/release_body.md

          echo "📋 Generated release body:"
          cat /tmp/release_body.md

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Arctic Controller ${{ steps.version.outputs.tag }}
          body_path: /tmp/release_body.md
          draft: false
          files: |
            build/arctic_controller.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
        env:
          GITHUB_TOKEN: ${{ secrets.ARCTIC_RELEASE_TOKEN }}

      - name: Release summary
        if: ${{ !inputs.dry_run }}
        run: |
          echo "## Release Created ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.version.outputs.tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | esp32p4 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files" >> $GITHUB_STEP_SUMMARY
          echo "- \`arctic_controller.bin\` - Main firmware (for OTA updates)" >> $GITHUB_STEP_SUMMARY
          echo "- \`bootloader.bin\` - Bootloader" >> $GITHUB_STEP_SUMMARY
          echo "- \`partition-table.bin\` - Partition table" >> $GITHUB_STEP_SUMMARY
          echo "- \`ota_data_initial.bin\` - OTA data partition" >> $GITHUB_STEP_SUMMARY

  # Prepare main for the next release only after tests, build, tag, and
  # publication all succeed. The release token is required so the push can
  # update the protected main branch and trigger normal branch workflows.
  bump-main:
    needs: build-and-release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.ARCTIC_RELEASE_TOKEN }}

      - name: Bump patch version and push
        env:
          RELEASED_VERSION: ${{ needs.build-and-release.outputs.version }}
          RELEASED_TAG: ${{ needs.build-and-release.outputs.tag }}
        run: |
          set -euo pipefail

          current=$(grep -oP 'set\(PROJECT_VER\s*"\K[^"]+' CMakeLists.txt)
          if [ "$current" != "$RELEASED_VERSION" ]; then
            echo "::error::main version $current no longer matches released version $RELEASED_VERSION"
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$current"
          next="${major}.${minor}.$((patch + 1))"
          echo "Bumping: $current -> $next"
          sed -i -E "s/set\(PROJECT_VER \"[^\"]+\"\)/set(PROJECT_VER \"$next\")/" CMakeLists.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git commit -m "chore: bump version to $next [skip ci]" \
                     -m "Auto-bumped by create-release.yml after $RELEASED_TAG." \
                     -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main
