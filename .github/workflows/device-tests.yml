name: Device Tests

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  pull_request:
    branches:
      - main
    paths:
      - 'main/**'
      - 'components/**'
      - 'managed_components/**'
      - 'dependencies/**'
      - 'CMakeLists.txt'
      - 'sdkconfig*'
      - 'partitions.csv'
      - 'lv_conf.h'
      - 'repos.json'
      - 'fetch_repos.py'
      - 'tests/**'
      - '!tests/**/*.md'
      - '.github/workflows/device-tests.yml'
  push:
    # Authoritative post-merge validation of the exact main commit SHA. The
    # release workflow consumes the attestation produced by these runs instead
    # of re-running the physical device suite, and it requires the release
    # target to equal main HEAD. To keep main HEAD always releasable, validate
    # EVERY main commit (no paths filter). Version-bump commits carry [skip ci]
    # and are therefore not redundantly re-validated.
    branches:
      - main
  workflow_call:
  workflow_dispatch:

  # Validate the prospective merged state when a PR is queued via the merge
  # queue. No paths filter: a skipped required check would stall the queue, so
  # the physical suite always runs for merge groups.
  merge_group:

# Only one device-test run at a time (single device on the network)
concurrency:
  group: device-tests
  cancel-in-progress: false  # queue new runs rather than cancelling in-progress

permissions:
  contents: read
  checks: write

jobs:
  # Fast pre-flight (never touches the device). On a push to main, check whether
  # this exact source tree was already validated by the physical suite in an
  # earlier same-repo run (e.g. the PR run that produced this squash-merge). The
  # suite validates a *tree*, not a commit — PROJECT_VER lives in the tree, so a
  # version bump changes tree_sha and correctly forces a real run. On a hit we
  # skip the ~40-minute hardware suite and re-emit the attestation for the new
  # commit SHA (see the reuse-attestation job). On PR / merge_group / schedule we
  # never dedup: the physical suite always runs so required checks and the merge
  # gate stay real.
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      dedup: ${{ steps.check.outputs.dedup }}
      tree_sha: ${{ steps.tree.outputs.tree_sha }}
      artifact_name: ${{ steps.tree.outputs.artifact_name }}
      source_run_id: ${{ steps.check.outputs.source_run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Compute source tree SHA
        id: tree
        run: |
          set -euo pipefail
          TREE_SHA=$(git rev-parse "HEAD^{tree}")
          echo "tree_sha=$TREE_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact_name=arctic-tree-attestation-$TREE_SHA" >> "$GITHUB_OUTPUT"
          echo "Source tree: $TREE_SHA"
      - name: Look for a prior validation of this tree
        id: check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_NAME: ${{ steps.tree.outputs.artifact_name }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          # Find a non-expired reusable attestation for this tree, produced by a
          # same-repo run (head_repository_id == this repo) so a fork PR can never
          # inject a forged "already validated" attestation.
          gh api "repos/${{ github.repository }}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" > arts.json
          SEL=$(jq -c --argjson repo "${REPO_ID}" '
            [ .artifacts[]
              | select(.expired == false)
              | select(.workflow_run.head_repository_id == $repo) ]
            | sort_by(.created_at) | last // empty' arts.json)
          if [ -z "$SEL" ]; then
            echo "dedup=false" >> "$GITHUB_OUTPUT"
            echo "No prior same-repo validation for this tree — running the physical suite."
            exit 0
          fi
          RUN_ID=$(echo "$SEL" | jq -r '.workflow_run.id')
          echo "dedup=true" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Tree already validated by run ${RUN_ID}; reusing its attestation and skipping the physical suite."

  build:
    needs: preflight
    if: needs.preflight.outputs.dedup != 'true'
    runs-on: ubuntu-latest
    permissions:
      # contents:write is needed only on the nightly (schedule) run to publish
      # the build-under-test to the ci-nightly prerelease for the /api/ota/update
      # pull-path validation. read is sufficient for checkout on all other events.
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Fetch dependencies
        run: python3 fetch_repos.py

      - name: Stamp build fingerprint
        run: |
          echo -n "${GITHUB_SHA}" > build_sha.txt
          echo "Baked build_sha=${GITHUB_SHA}"

      - name: Enable test endpoints for device testing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("sdkconfig")
          disabled = "# CONFIG_TEST_ENDPOINTS is not set"
          config = path.read_text(encoding="utf-8")
          if disabled not in config:
              raise SystemExit("CONFIG_TEST_ENDPOINTS is not disabled in sdkconfig")
          path.write_text(
              config.replace(disabled, "CONFIG_TEST_ENDPOINTS=y", 1),
              encoding="utf-8",
          )
          PY
          grep -q '^CONFIG_TEST_ENDPOINTS=y$' sdkconfig

      - name: ESP-IDF Build (test firmware)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32p4
          path: '.'

      - name: Verify test instrumentation was compiled
        run: grep -q '^#define CONFIG_TEST_ENDPOINTS 1$' build/config/sdkconfig.h

      - name: Verify OTA rollback protection is enabled
        # P0 tripwire — see build.yml for rationale. A disabled bool has NO
        # #define at all in sdkconfig.h, so this grep fails loudly if bootloader
        # app rollback is not compiled in.
        run: |
          if ! grep -q '^#define CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE 1$' build/config/sdkconfig.h; then
            echo "::error::CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE is NOT enabled in the compiled firmware — OTA rollback protection is OFF."
            exit 1
          fi
          echo "OK: CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y in compiled firmware"

      - name: Stage build fingerprint for device job
        # build/ is created by the ESP-IDF Docker container as root, so a plain
        # cp is denied; use sudo (GitHub-hosted runner has passwordless sudo).
        run: sudo cp build_sha.txt build/build_sha.txt

      - name: Upload firmware + flash metadata
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            build/arctic_controller.bin
            build/build_sha.txt
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/flasher_args.json
          retention-days: 7

      - name: Publish build-under-test to CI prerelease (nightly OTA pull path)
        # The nightly device-tests job validates /api/ota/update, which can only
        # pull firmware from a GitHub release URL on the device's OTA allowlist.
        # Publish the exact build-under-test to a dedicated CI *prerelease* tag.
        # A prerelease is deliberate: the firmware's field update-check hits
        # /releases/latest, which EXCLUDES prereleases and drafts, so this asset is
        # invisible to production devices while still being publicly downloadable
        # via its direct /releases/download/ci-nightly/ URL (which the nightly test
        # passes explicitly to /api/ota/update). The release is clobbered every run.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view ci-nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload ci-nightly build/arctic_controller.bin \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create ci-nightly build/arctic_controller.bin \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "CI nightly build-under-test" \
              --notes "Automated CI artifact for the nightly /api/ota/update pull-path validation. NOT a production release; excluded from /releases/latest. Overwritten on every nightly run."
          fi
          echo "Published build/arctic_controller.bin to the ci-nightly prerelease."

  device-tests:
    needs: [preflight, build]
    if: needs.preflight.outputs.dedup != 'true'
    runs-on: [self-hosted, vm-mi]
    timeout-minutes: 120
    env:
      ARCTIC_URL: http://arctic-controller-ghr.mi

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download firmware
        uses: actions/download-artifact@v8
        with:
          name: firmware
          path: build/

      - name: Detect partition layout changes
        id: partition_layout
        run: |
          git fetch origin main --depth=1
          if git diff --quiet origin/main HEAD -- partitions.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Partition layout changed; forcing a full USB flash."
          fi

      - name: Set up Python environment
        run: |
          python3 -m venv $HOME/test-venv
          . $HOME/test-venv/bin/activate
          echo "$HOME/test-venv/bin" >> $GITHUB_PATH

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Detect serial ports
        run: |
          # USB serial port assignments (/dev/ttyACM0, /dev/ttyACM1) can swap
          # after a reboot. Match the controller's USB serial number (burned
          # into eFuse and globally unique).
          CONTROLLER_PORT=""
          for PORT in /dev/ttyACM*; do
            [ -e "$PORT" ] || continue
            # udevadm reliably finds the USB device attributes regardless of hub depth
            SERIAL=$(udevadm info -q property --name="$PORT" | grep -oP '^ID_SERIAL_SHORT=\K.*' || echo "")
            VID=$(udevadm info -q property --name="$PORT" | grep -oP '^ID_VENDOR_ID=\K.*' || echo "?")
            PID=$(udevadm info -q property --name="$PORT" | grep -oP '^ID_MODEL_ID=\K.*' || echo "?")
            MODEL=$(udevadm info -q property --name="$PORT" | grep -oP '^ID_MODEL=\K.*' || echo "?")
            echo "$PORT: VID=$VID PID=$PID model=$MODEL serial=$SERIAL"
            if [ -n "$SERIAL" ]; then
              if [ "$SERIAL" = "$CONTROLLER_USB_SERIAL" ]; then
                CONTROLLER_PORT="$PORT"
                echo "  -> matched controller"
              fi
            fi
          done
          echo "Controller port: ${CONTROLLER_PORT:-not found}"
          if [ -n "$CONTROLLER_PORT" ]; then
            echo "CONTROLLER_PORT=$CONTROLLER_PORT" >> $GITHUB_ENV
          fi
        env:
          CONTROLLER_USB_SERIAL: ${{ secrets.CONTROLLER_USB_SERIAL }}

      - name: Sync API key from device (pre-OTA)
        run: |
          # Authenticate to the device that is CURRENTLY running (the previous
          # build) so the OTA upload below can present a valid API key. The
          # device's credentials are unknown at this point (a prior run set its
          # own isolated test creds), so we first reset them to known values via
          # the unauthenticated test-only endpoint /api/test/credentials, exactly
          # like the post-flash "Provision isolated test credentials" step. We
          # then log in and read the device's API key. Without this the upload
          # 401s and the job silently falls back to a USB flash, which does NOT
          # exercise the A/B OTA pending-verify path — so rollback would never be
          # tested and a rolled-back broken build could pass. Real OTA is what
          # the identity gate is meant to guard, so make OTA the primary path.
          ARCTIC_URL_HTTPS="${ARCTIC_URL/http:/https:}"
          TEST_USERNAME="arctic"
          TEST_PASSWORD="ArcticTest!2026"
          BODY="{\"username\": \"$TEST_USERNAME\", \"password\": \"$TEST_PASSWORD\"}"
          DEVICE_KEY=""

          for i in $(seq 1 6); do
            # (Re)set the running firmware's credentials to known values. This is
            # a test-only endpoint (CONFIG_TEST_ENDPOINTS) and needs no auth.
            curl -sk --connect-timeout 3 --max-time 8 \
              -X POST "$ARCTIC_URL_HTTPS/api/test/credentials" \
              -H "Content-Type: application/json" \
              -d "$BODY" > /dev/null 2>&1 || true

            JAR=$(mktemp)
            curl -sk -c "$JAR" --connect-timeout 3 --max-time 8 \
              -X POST "$ARCTIC_URL_HTTPS/login" \
              -H "Content-Type: application/json" \
              -d "{\"username\": \"$TEST_USERNAME\", \"password\": \"$TEST_PASSWORD\"}" > /dev/null 2>&1 || true
            RESP=$(curl -sk -b "$JAR" --connect-timeout 3 --max-time 8 \
              "$ARCTIC_URL_HTTPS/api/auth/apikey" 2>/dev/null) || true
            rm -f "$JAR"
            DEVICE_KEY=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('api_key',''))" 2>/dev/null) || true

            if [ -n "$DEVICE_KEY" ]; then
              break
            fi
            sleep 2
          done

          if [ -n "$DEVICE_KEY" ]; then
            echo "ARCTIC_API_KEY=$DEVICE_KEY" >> $GITHUB_ENV
            echo "Synced API key from device (OTA will authenticate)"
          else
            echo "WARNING: Could not read device API key pre-OTA — OTA upload will"
            echo "likely 401 and the job will fall back to USB serial flash, which"
            echo "does NOT exercise the OTA rollback path."
          fi

      - name: Flash device via OTA
        id: ota_flash
        if: steps.partition_layout.outputs.changed != 'true'
        continue-on-error: true
        run: |
          # Non-schedule runs (PR/push/dispatch) validate the SYNCHRONOUS push path:
          # /api/ota/upload streams the local build straight to the device. The
          # nightly (schedule) run instead validates the ASYNCHRONOUS pull path that
          # field devices actually use: /api/ota/update tells the device to download
          # the build-under-test from its ci-nightly GitHub release and A/B-flash it
          # itself.
          ARCTIC_URL_HTTPS="${ARCTIC_URL/http:/https:}"

          # Wait for mDNS name resolution (up to 30s)
          HOSTNAME="${ARCTIC_URL#*://}"   # strip scheme → arctic.local
          echo "Waiting for $HOSTNAME to resolve..."
          for i in $(seq 1 15); do
            if getent hosts "$HOSTNAME" > /dev/null 2>&1; then
              RESOLVED_IP=$(getent hosts "$HOSTNAME" | awk '{print $1}')
              echo "$HOSTNAME resolved to $RESOLVED_IP after $((i*2))s"
              break
            fi
            sleep 2
          done
          if ! getent hosts "$HOSTNAME" > /dev/null 2>&1; then
            echo "ERROR: $HOSTNAME did not resolve within 30s"
            exit 1
          fi

          # Quick connectivity check — bail fast if device isn't actually responding
          if ! curl -sk --connect-timeout 3 --max-time 5 "$ARCTIC_URL_HTTPS/api/health" > /dev/null 2>&1; then
            echo "ERROR: Device resolved but not responding on HTTPS"
            exit 1
          fi
          echo "Device responding at $ARCTIC_URL_HTTPS"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            # ---- Nightly: asynchronous PULL path (/api/ota/update) ----
            ASSET_URL="https://github.com/sslivins/arctic-controller/releases/download/ci-nightly/arctic_controller.bin"
            echo "Nightly OTA pull path: instructing device to download $ASSET_URL"
            HTTP_CODE=$(curl -sk -o /tmp/ota_response.txt -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -H "X-API-Key: ${ARCTIC_API_KEY}" \
              --connect-timeout 5 --max-time 20 \
              -d "{\"url\": \"$ASSET_URL\"}" \
              "$ARCTIC_URL_HTTPS/api/ota/update") || true
            echo "Update trigger: HTTP $HTTP_CODE — $(cat /tmp/ota_response.txt)"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::/api/ota/update was rejected (HTTP $HTTP_CODE). Nightly pull-path OTA failed to start."
              exit 1
            fi
            # /api/ota/update is asynchronous: the device downloads ~2MB to PSRAM,
            # then QUIESCES the network (api_server_stop) and A/B-flashes + reboots.
            # The status server goes offline *before* it reports ready_to_reboot, so
            # poll /api/ota/status until either it reports 'failed', or the device
            # goes offline AFTER we have observed download progress (= quiesce/flash/
            # reboot underway). The subsequent "Wait for device reboot" step reconnects.
            SAW_PROGRESS=false
            for i in $(seq 1 90); do
              ST=$(curl -sk --connect-timeout 2 --max-time 5 \
                -H "X-API-Key: ${ARCTIC_API_KEY}" \
                "$ARCTIC_URL_HTTPS/api/ota/status" 2>/dev/null) || ST=""
              if [ -z "$ST" ]; then
                if [ "$SAW_PROGRESS" = "true" ]; then
                  echo "Device went offline after download progress — quiesce/flash/reboot underway"
                  exit 0
                fi
                echo "  device not yet reachable for status (no progress seen yet)..."
              else
                STATE=$(echo "$ST" | python3 -c "import sys,json; print(json.load(sys.stdin).get('state',''))" 2>/dev/null) || STATE=""
                BYTES=$(echo "$ST" | python3 -c "import sys,json; print(int(json.load(sys.stdin).get('bytes_downloaded',0)))" 2>/dev/null) || BYTES=0
                echo "  ota status: state='${STATE}' bytes_downloaded=${BYTES}"
                if [ "$STATE" = "failed" ]; then
                  echo "::error::Device reported OTA state='failed' during nightly pull-path update."
                  exit 1
                fi
                if [ "${BYTES:-0}" -gt 0 ] || [ "$STATE" = "downloading" ] || [ "$STATE" = "verifying" ]; then
                  SAW_PROGRESS=true
                fi
                if [ "$STATE" = "ready_to_reboot" ]; then
                  echo "Device reported ready_to_reboot — rebooting into new firmware"
                  exit 0
                fi
              fi
              sleep 2
            done
            echo "::error::Nightly pull-path OTA did not complete within timeout (no reboot observed)."
            exit 1
          else
            # ---- PR/push: synchronous PUSH path (/api/ota/upload) ----
            echo "Uploading firmware to device via /api/ota/upload ..."
            HTTP_CODE=$(curl -skL -o /tmp/ota_response.txt -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/octet-stream" \
              -H "X-API-Key: ${ARCTIC_API_KEY}" \
              --connect-timeout 5 \
              --max-time 30 \
              --data-binary @build/arctic_controller.bin \
              "$ARCTIC_URL_HTTPS/api/ota/upload") || true
            echo "Response: HTTP $HTTP_CODE — $(cat /tmp/ota_response.txt)"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "OTA upload successful, waiting for reboot..."
              exit 0
            fi
            echo "OTA upload failed"
            exit 1
          fi

      - name: Wait for device reboot (OTA)
        if: steps.partition_layout.outputs.changed != 'true' && steps.ota_flash.outcome == 'success'
        run: |
          ARCTIC_URL_HTTPS="${ARCTIC_URL/http:/https:}"
          sleep 10
          # 80s window: the async pull path (nightly) only starts flashing +
          # rebooting AFTER this step begins (it quiesced the network mid-download),
          # so allow for flash-from-PSRAM + reboot + C6 bringup. Harmless for the
          # synchronous upload path, which is already rebooting by now.
          for i in $(seq 1 80); do
            if curl -skL --connect-timeout 2 "$ARCTIC_URL/api/heatpump/status" > /dev/null 2>&1 || \
               curl -skL --connect-timeout 2 "$ARCTIC_URL_HTTPS/api/heatpump/status" > /dev/null 2>&1; then
              echo "Device is back online after $((i + 10))s"
              exit 0
            fi
            sleep 1
          done
          echo "Device did not come back online within 90s"
          exit 1

      - name: Fallback — flash via USB serial
        if: steps.partition_layout.outputs.changed == 'true' || steps.ota_flash.outcome == 'failure'
        run: |
          echo "OTA failed, falling back to USB serial flash..."

          # Generate NVS partition with WiFi credentials + API key so the device can auto-connect
          # and tests can authenticate.  The "auth" namespace pre-seeds the API key so
          # auth_mgr_init() uses it instead of generating a random one.
          echo "Generating NVS partition with WiFi credentials and API key..."
          cat > /tmp/nvs_wifi.csv << 'CSVHEADER'
          key,type,encoding,value
          wifi_creds,namespace,,
          ssid,data,string,${WIFI_SSID}
          password,data,string,${WIFI_PASSWORD}
          auth,namespace,,
          api_key,data,string,${ARCTIC_API_KEY}
          CSVHEADER
          # Strip leading whitespace from heredoc
          sed -i 's/^[[:space:]]*//' /tmp/nvs_wifi.csv
          # Substitute env vars
          envsubst < /tmp/nvs_wifi.csv > /tmp/nvs_wifi_resolved.csv
          python3 -m esp_idf_nvs_partition_gen generate \
            /tmp/nvs_wifi_resolved.csv /tmp/nvs_wifi.bin 0x40000

          if [ -z "$CONTROLLER_PORT" ]; then
            echo "ERROR: No ESP32-P4 controller detected on any serial port"
            exit 1
          fi
          esptool.py --port "$CONTROLLER_PORT" --baud 921600 --chip esp32p4 \
            --before default_reset --after hard_reset \
            write_flash --flash_mode dio --flash_size 16MB --flash_freq 80m \
            0x2000  build/bootloader/bootloader.bin \
            0x8000  build/partition_table/partition-table.bin \
            0x9000  /tmp/nvs_wifi.bin \
            0x49000 build/ota_data_initial.bin \
            0x50000 build/arctic_controller.bin
        env:
          WIFI_SSID: ${{ secrets.MI_WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.MI_WIFI_PASSWORD }}
          ARCTIC_API_KEY: ${{ secrets.ARCTIC_API_KEY }}

      - name: Wait for device boot (USB)
        if: steps.partition_layout.outputs.changed == 'true' || steps.ota_flash.outcome == 'failure'
        run: |
          ARCTIC_URL_HTTPS="${ARCTIC_URL/http:/https:}"
          sleep 15
          for i in $(seq 1 45); do
            if curl -skL --connect-timeout 2 "$ARCTIC_URL/api/heatpump/status" > /dev/null 2>&1 || \
               curl -skL --connect-timeout 2 "$ARCTIC_URL_HTTPS/api/heatpump/status" > /dev/null 2>&1; then
              echo "Device is back online after $((i + 15))s"
              exit 0
            fi
            sleep 1
          done
          echo "Device did not come back online within 60s"
          exit 1

      - name: Require HTTPS readiness
        run: |
          # Production routes are HTTPS-only. Retry transient TLS startup or
          # handshake failures before any authenticated setup or test traffic.
          #
          # If the device never answers it may be wedged/offline (e.g. a firmware
          # panic coinciding with a runner outage — the failure that motivated
          # this). Because the runner has a direct USB link, attempt a one-shot
          # esptool hard-reset and re-poll before failing, so the most common
          # overnight failure self-heals instead of leaving the board wedged for
          # a human to reset over SSH.
          ARCTIC_URL_HTTPS="${ARCTIC_URL/http:/https:}"

          poll_https() {
            local attempts="$1"
            for i in $(seq 1 "$attempts"); do
              if curl -skf --connect-timeout 5 --max-time 10 \
                "$ARCTIC_URL_HTTPS/api/health" > /dev/null; then
                echo "Mandatory HTTPS is ready (attempt $i)"
                return 0
              fi
              sleep 2
            done
            return 1
          }

          if poll_https 12; then
            echo "ARCTIC_URL=$ARCTIC_URL_HTTPS" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "::warning::HTTPS not ready after initial poll — attempting USB hard-reset recovery"
          if [ -z "${CONTROLLER_PORT:-}" ]; then
            echo "::error::Device unreachable and no CONTROLLER_PORT known — cannot recover"
            exit 1
          fi

          echo "Hard-resetting controller on $CONTROLLER_PORT via esptool..."
          esptool.py --port "$CONTROLLER_PORT" --chip esp32p4 \
            --before default_reset --after hard_reset run || \
            echo "::warning::esptool reset returned non-zero (continuing to re-poll)"

          # Allow time for the board to boot and rejoin WiFi before re-polling.
          sleep 20
          if poll_https 30; then
            echo "ARCTIC_URL=$ARCTIC_URL_HTTPS" >> "$GITHUB_ENV"
            echo "::notice::Device recovered after USB hard-reset"
            exit 0
          fi

          echo "::error::Mandatory HTTPS did not become ready even after USB hard-reset recovery"
          exit 1

      - name: Provision isolated test credentials
        run: |
          TEST_USERNAME="arctic"
          TEST_PASSWORD="ArcticTest!2026"
          BODY=$(python3 -c 'import json,os; print(json.dumps({"username": os.environ["TEST_USERNAME"], "password": os.environ["TEST_PASSWORD"]}))')

          for i in $(seq 1 5); do
            if curl -skf --connect-timeout 3 --max-time 10 \
              -X POST "$ARCTIC_URL/api/test/credentials" \
              -H "Content-Type: application/json" \
              -d "$BODY" > /dev/null; then
              echo "ARCTIC_USERNAME=$TEST_USERNAME" >> "$GITHUB_ENV"
              echo "ARCTIC_PASSWORD=$TEST_PASSWORD" >> "$GITHUB_ENV"
              echo "Provisioned non-default credentials for test firmware"
              exit 0
            fi
            sleep 2
          done

          echo "ERROR: Could not provision test credentials"
          exit 1
        env:
          TEST_USERNAME: arctic
          TEST_PASSWORD: ArcticTest!2026

      - name: Sync API key from device
        run: |
          # The device may have a randomly-generated API key (fresh flash without
          # NVS provisioning, or pre-existing device).  Read the actual key from
          # the device and require success so authenticated tests cannot run with
          # a stale secret after a transient TLS handshake failure.
          DEVICE_KEY=""

          for i in $(seq 1 12); do
            JAR=$(mktemp)
            curl -skf -c "$JAR" --connect-timeout 5 --max-time 10 \
              -X POST "$ARCTIC_URL/login" \
              -H "Content-Type: application/json" \
              -d "{\"username\": \"$ARCTIC_USERNAME\", \"password\": \"$ARCTIC_PASSWORD\"}" > /dev/null 2>&1 || true
            RESP=$(curl -skf -b "$JAR" --connect-timeout 5 --max-time 10 \
              "$ARCTIC_URL/api/auth/apikey" 2>/dev/null) || true
            rm -f "$JAR"
            DEVICE_KEY=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('api_key',''))" 2>/dev/null) || true
            if [ -n "$DEVICE_KEY" ]; then
              break
            fi
            sleep 2
          done

          if [ -n "$DEVICE_KEY" ]; then
            echo "ARCTIC_API_KEY=$DEVICE_KEY" >> "$GITHUB_ENV"
            if [ "$DEVICE_KEY" = "$ARCTIC_API_KEY" ]; then
              echo "Device API key matches secret — no override needed"
            else
              echo "Device API key differs from secret — overriding ARCTIC_API_KEY"
            fi
          else
            echo "ERROR: Could not read device API key after HTTPS became ready"
            exit 1
          fi

      - name: Verify running firmware is the build under test (rollback guard)
        # CRITICAL release-safety gate. After the OTA (or USB fallback) the device
        # MUST be running the exact firmware we just built. If the new firmware
        # crashed before esp_ota_mark_app_valid_cancel_rollback(), the bootloader
        # rolls back to the PREVIOUS good image — the device would then come back
        # online and happily pass every test suite against the OLD firmware,
        # masking a broken build and letting it be released. This step catches
        # that: the device's reported build_sha must equal the build_sha we baked
        # into this build. A mismatch (or missing field = pre-build_sha firmware)
        # means a rollback or a stale OTA, and the job fails BEFORE any suite runs.
        run: |
          set -euo pipefail
          EXPECTED=$(cat build/build_sha.txt 2>/dev/null || true)
          if [ -z "$EXPECTED" ]; then
            echo "::error::build/build_sha.txt is empty/missing — cannot verify firmware identity."
            exit 1
          fi
          echo "Expected build_sha: $EXPECTED"
          # HTTPS-only: this request carries the X-API-Key secret, and the
          # security contract (tests/api/test_ha_security_contract.py) forbids
          # secret-bearing automation from ever falling back to plain HTTP.
          # ARCTIC_URL is already https:// and the preceding "Require HTTPS
          # readiness" step guarantees the TLS server is up.
          ACTUAL=""
          for attempt in $(seq 1 15); do
            RESP=$(curl -sk --connect-timeout 3 --max-time 8 \
              -H "X-API-Key: ${ARCTIC_API_KEY}" "${ARCTIC_URL}/api/ota/status" 2>/dev/null) || true
            ACTUAL=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('build_sha',''))" 2>/dev/null) || true
            if [ -n "$ACTUAL" ]; then
              break
            fi
            sleep 2
          done
          echo "Device reported build_sha: '${ACTUAL:-<none>}'"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Firmware identity mismatch — device is NOT running the build under test."
            echo "::error::expected='$EXPECTED' actual='${ACTUAL:-<missing>}'. The device likely ROLLED BACK to the previous good image (the new firmware crashed before marking itself valid), or the OTA did not take. Refusing to run the suite against firmware that is not the build being validated."
            exit 1
          fi
          echo "OK: device is running the build under test ($EXPECTED)"

      - name: Enforce nightly OTA pull-path success (strict)
        # The nightly run exists to validate the /api/ota/update pull path that
        # field devices use. If that path failed, the USB fallback above will have
        # recovered the device to the build-under-test (so the rollback guard still
        # passes), which would otherwise silently mask the failure. Fail the job
        # explicitly so a broken pull-path OTA can never pass nightly. This runs
        # AFTER recovery so the device is left healthy for the next scheduled run.
        if: github.event_name == 'schedule' && steps.partition_layout.outputs.changed != 'true' && steps.ota_flash.outcome == 'failure'
        run: |
          echo "::error::Nightly /api/ota/update (pull-path OTA) FAILED. The device was recovered via USB fallback, but nightly must strictly validate the pull path. Failing the job."
          exit 1

      - name: Start controller serial capture
        run: |
          python .github/scripts/capture_serial.py \
            --usb-serial "$CONTROLLER_USB_SERIAL" \
            --output controller-serial.log &
          CAPTURE_PID=$!
          echo "SERIAL_CAPTURE_PID=$CAPTURE_PID" >> "$GITHUB_ENV"
          sleep 2
          if ! kill -0 "$CAPTURE_PID" 2>/dev/null; then
            echo "Serial capture process failed to start"
            exit 1
          fi
          echo "Capturing controller serial output with PID $CAPTURE_PID"
        env:
          CONTROLLER_USB_SERIAL: ${{ secrets.CONTROLLER_USB_SERIAL }}

      - name: Run device UI tests
        id: ui_tests
        continue-on-error: true
        run: python -m pytest tests/device/ -v --tb=short --junitxml=test-results.xml -p no:cacheprovider

      - name: Run API contract tests
        id: api_tests
        continue-on-error: true
        run: python -m pytest tests/api/ -v --tb=short --junitxml=api-test-results.xml -p no:cacheprovider
        env:
          # ARCTIC_API_KEY is set via $GITHUB_ENV by the "Sync API key" step
          HYPOTHESIS_PROFILE: ci
          PYTHONDONTWRITEBYTECODE: '1'

      - name: Install Playwright for web tests
        run: |
          pip install -r tests/web/requirements.txt
          playwright install chromium

      - name: Run web dashboard tests
        id: web_tests
        continue-on-error: true
        run: python -m pytest tests/web/ -v --tb=short --junitxml=web-test-results.xml
        env:
          TLS_FULLCHAIN_PEM: ${{ secrets.TLS_FULLCHAIN_PEM }}
          TLS_PRIVKEY_PEM: ${{ secrets.TLS_PRIVKEY_PEM }}

      - name: Stop controller serial capture
        if: always()
        run: |
          if [ -n "${SERIAL_CAPTURE_PID:-}" ] && kill -0 "$SERIAL_CAPTURE_PID" 2>/dev/null; then
            kill "$SERIAL_CAPTURE_PID"
            wait "$SERIAL_CAPTURE_PID" || true
          fi

      - name: Upload controller serial log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: controller-serial-log
          path: controller-serial.log
          if-no-files-found: warn
          retention-days: 14

      - name: Assert no httpd handler-registration failures
        if: always()
        run: |
          # Catch httpd URI-handler table overflow early. When the handler
          # table fills up, httpd_register_uri_handler silently drops the tail
          # handlers and those routes answer 404 — which otherwise only surfaces
          # as a confusing, intermittent failure in an unrelated UI test (e.g.
          # test_back_from_sub_screen "Click failed (404)"). Fail loudly here,
          # naming the root cause, regardless of whether this particular boot
          # happened to drop a route that a test exercised.
          if [ ! -f controller-serial.log ]; then
            echo "No serial log captured — skipping handler-registration check."
            exit 0
          fi
          HITS=$(grep -nE 'no slots left for registering handler|Failed to register test endpoint|test endpoint\(s\) FAILED to register' controller-serial.log || true)
          if [ -n "$HITS" ]; then
            echo "::error::httpd URI-handler registration failed on the device — the URI-handler table overflowed. Increase uri_handlers in main/api_server.cpp. Offending serial-log lines:"
            echo "$HITS"
            exit 1
          fi
          echo "OK: no httpd URI-handler registration failures in serial log."

      - name: Detect firmware crashes on device
        if: always()
        # The device firmware distinguishes an *intentional* reboot (OTA /
        # cert-swap tests call esp_restart(), which the bootloader records as a
        # clean SW_CPU_RESET) from a *crash* reboot. On a crash boot the
        # firmware's boot_stats module logs "Crash reboot (PANIC)" and emits an
        # "application_crash" event; a live panic also prints a "Guru
        # Meditation" dump. We had ~3-4 such crash reboots slipping through
        # every device-tests run — silently self-healed by the reboot and never
        # surfaced, so the suite mostly passed and nobody noticed the device was
        # crashing. This step makes every such crash loud and impossible to miss.
        #
        # NOTE: currently NON-BLOCKING (warning only) so it doesn't brick the
        # whole pipeline on the known-preexisting heap use-after-free while that
        # fix is in flight. PROMOTE TO A HARD FAILURE (uncomment the `exit 1`
        # below) in the same PR that lands the crash fix.
        run: |
          if [ ! -f controller-serial.log ]; then
            echo "No serial log captured — skipping crash check."
            exit 0
          fi
          # Signatures that mean a genuine crash (NOT an intentional reboot):
          CRASH_RE='Guru Meditation|Crash reboot \(PANIC\)|Event: application_crash|Store access fault|Load access fault|StoreProhibited|LoadProhibited|assert failed|abort\(\) was called'
          HITS=$(grep -nE "$CRASH_RE" controller-serial.log || true)
          if [ -z "$HITS" ]; then
            echo "OK: no firmware crash signatures in serial log."
            exit 0
          fi
          COUNT=$(printf '%s\n' "$HITS" | grep -cE 'Crash reboot \(PANIC\)|Guru Meditation' || true)
          STREAK=$(grep -oE 'consecutive crash streak now [0-9]+' controller-serial.log | grep -oE '[0-9]+$' | sort -n | tail -1 || true)
          echo "::warning title=Device firmware crashed::The controller crashed during the device-tests run (crash reboots: ${COUNT:-?}, peak consecutive streak: ${STREAK:-?}). This is a latent firmware bug, not a test flake. See the crash summary and the controller-serial-log artifact."
          {
            echo "### ⚠️ Device firmware crash detected"
            echo ""
            echo "Crash reboots / panics: **${COUNT:-?}**  |  peak consecutive crash streak: **${STREAK:-?}**"
            echo ""
            echo "Crash-signature lines from the serial log:"
            echo '```'
            printf '%s\n' "$HITS" | head -40
            echo '```'
            # If a live Guru Meditation dump was captured, surface the backtrace
            # so it can be decoded with riscv32-esp-elf-addr2line against the ELF.
            if grep -q 'Guru Meditation' controller-serial.log; then
              echo "Panic backtrace excerpt (decode with riscv32-esp-elf-addr2line -pfiaC -e arctic_controller.elf):"
              echo '```'
              grep -nE 'Guru Meditation|Core .* register dump|MEPC|MTVAL|MCAUSE|A[0-9]+ +:|SP +:|RA +:|Backtrace|Stack memory' controller-serial.log | head -60
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$HITS" | head -40
          # TODO(crash-fix): promote to a hard failure once the heap
          # use-after-free is fixed:
          # exit 1

      - name: Publish UI test results
        uses: dorny/test-reporter@v2
        if: always() && steps.ui_tests.outcome != 'skipped'
        with:
          name: Device UI Test Results
          path: test-results.xml
          reporter: java-junit
          use-actions-summary: 'false'

      - name: Publish API contract test results
        uses: dorny/test-reporter@v2
        if: always() && steps.api_tests.outcome != 'skipped'
        with:
          name: API Contract Test Results
          path: api-test-results.xml
          reporter: java-junit
          use-actions-summary: 'false'

      - name: Publish web test results
        uses: dorny/test-reporter@v2
        if: always() && steps.web_tests.outcome != 'skipped'
        with:
          name: Web Dashboard Test Results
          path: web-test-results.xml
          reporter: java-junit
          use-actions-summary: 'false'

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failure-screenshots
          path: |
            tests/device/screenshots/
            tests/web/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Extract test results for badges
        id: test_results
        if: always()
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          import os

          def parse_junit(path):
              if not os.path.exists(path):
                  return 0, 0, 0
              root = ET.parse(path).getroot()
              # pytest wraps results in <testsuites><testsuite ...></testsuites>
              if root.tag == 'testsuites':
                  suites = root.findall('testsuite')
              else:
                  suites = [root]
              tests = sum(int(s.get('tests', 0)) for s in suites)
              failures = sum(int(s.get('failures', 0)) + int(s.get('errors', 0)) for s in suites)
              skipped = sum(int(s.get('skipped', 0)) for s in suites)
              return tests - failures - skipped, failures, skipped

          any_results = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as gh:
              for name, path in [('ui', 'test-results.xml'), ('api', 'api-test-results.xml'), ('web', 'web-test-results.xml')]:
                  p, f, s = parse_junit(path)
                  total = p + f + s
                  if total > 0:
                      any_results = True
                  msg = f'{p} passed'
                  if s: msg += f', {s} skipped'
                  if f: msg += f', {f} failed'
                  color = 'red' if f > 0 else 'brightgreen'
                  gh.write(f'{name}_msg={msg}\n')
                  gh.write(f'{name}_color={color}\n')
              gh.write(f'has_results={\"true\" if any_results else \"false\"}\n')
          "

      - name: Update all test badges
        if: always() && steps.test_results.outputs.has_results == 'true'
        continue-on-error: true  # cosmetic gist push; a bad/expired GIST_SECRET must never gate merges
        env:
          GIST_TOKEN: ${{ secrets.GIST_SECRET }}
          ui_msg: ${{ steps.test_results.outputs.ui_msg }}
          ui_color: ${{ steps.test_results.outputs.ui_color }}
          api_msg: ${{ steps.test_results.outputs.api_msg }}
          api_color: ${{ steps.test_results.outputs.api_color }}
          web_msg: ${{ steps.test_results.outputs.web_msg }}
          web_color: ${{ steps.test_results.outputs.web_color }}
        run: |
          python3 -c "
          import json, os, urllib.request

          gist_id = 'b37c67c774075a8a90afd54b7c3a4592'
          token = os.environ['GIST_TOKEN']

          badges = {
              'ui_tests.json':     ('Device UI Tests',     'ui'),
              'api_tests.json':    ('API Contract Tests',  'api'),
              'web_tests.json':    ('Web Dashboard Tests', 'web'),
          }

          files = {}
          for filename, (label, prefix) in badges.items():
              msg = os.environ.get(f'{prefix}_msg', '0 passed')
              color = os.environ.get(f'{prefix}_color', 'lightgrey')
              files[filename] = {
                  'content': json.dumps({
                      'schemaVersion': 1,
                      'label': label,
                      'message': msg,
                      'color': color,
                  })
              }

          data = json.dumps({'files': files}).encode()
          req = urllib.request.Request(
              f'https://api.github.com/gists/{gist_id}',
              data=data,
              method='PATCH',
              headers={
                  'Authorization': f'token {token}',
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
              },
          )
          resp = urllib.request.urlopen(req)
          print(f'Gist updated: {resp.status}')
          "

      - name: Record release validation attestation
        id: attestation
        if: >-
          steps.ui_tests.outcome == 'success' &&
          steps.api_tests.outcome == 'success' &&
          steps.web_tests.outcome == 'success' &&
          (
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            github.event_name == 'merge_group' ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository)
          )
        env:
          COMMIT_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          RUNNER_NAME: ${{ runner.name }}
          ESP_IDF_VERSION: v5.5.2
          UI_OUTCOME: ${{ steps.ui_tests.outcome }}
          API_OUTCOME: ${{ steps.api_tests.outcome }}
          WEB_OUTCOME: ${{ steps.web_tests.outcome }}
        run: |
          set -euo pipefail
          # Authoritative record that this exact main SHA passed the physical
          # device suite. create-release.yml consumes this instead of re-running
          # the ~40-minute hardware suite.
          TREE_SHA=$(git rev-parse "HEAD^{tree}")
          FW_DIGEST=$(sha256sum build/arctic_controller.bin | awk '{print $1}')
          echo "tree_sha=$TREE_SHA" >> "$GITHUB_OUTPUT"
          export TREE_SHA FW_DIGEST
          python3 - <<'PY'
          import json, os, datetime

          attestation = {
              "schema_version": 1,
              "kind": "arctic-device-validation",
              "repository": os.environ["REPOSITORY"],
              "commit_sha": os.environ["COMMIT_SHA"],
              "tree_sha": os.environ["TREE_SHA"],
              "workflow": "device-tests.yml",
              "event": os.environ["EVENT"],
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "suites": {
                  "ui": os.environ["UI_OUTCOME"],
                  "api": os.environ["API_OUTCOME"],
                  "web": os.environ["WEB_OUTCOME"],
              },
              "test_firmware": {
                  "file": "build/arctic_controller.bin",
                  "sha256": os.environ["FW_DIGEST"],
                  "test_endpoints_enabled": True,
              },
              "environment": {
                  "esp_idf_version": os.environ["ESP_IDF_VERSION"],
                  "target": "esp32p4",
                  "runner": os.environ["RUNNER_NAME"],
              },
              "created_at": datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),
          }
          with open("release-attestation.json", "w", encoding="utf-8") as fh:
              json.dump(attestation, fh, indent=2, sort_keys=True)
          print(json.dumps(attestation, indent=2, sort_keys=True))
          PY

      - name: Upload release validation attestation
        if: steps.attestation.outcome == 'success' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release-attestation-${{ github.sha }}
          path: release-attestation.json
          retention-days: 90

      - name: Upload reusable tree attestation
        # Deposited on push, same-repo PR and merge_group successes so a later
        # push whose tree matches can reuse it and skip the physical suite. Keyed
        # by tree SHA (not commit) because the suite validates a tree.
        if: steps.attestation.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: arctic-tree-attestation-${{ steps.attestation.outputs.tree_sha }}
          path: release-attestation.json
          retention-days: 90

      - name: Fail job if any tests failed
        if: always()
        run: |
          # With continue-on-error on test steps, we need to explicitly fail the job
          FAILED=false
          for step_outcome in "${{ steps.ui_tests.outcome }}" "${{ steps.api_tests.outcome }}" "${{ steps.web_tests.outcome }}"; do
            if [ "$step_outcome" = "failure" ]; then
              FAILED=true
            fi
          done
          if [ "$FAILED" = "true" ]; then
            echo "One or more test suites failed — see individual results above"
            exit 1
          fi
          echo "All test suites passed"

  # On a dedup hit (push to main whose tree an earlier same-repo run already
  # validated) re-emit that validation attestation under the new commit SHA, so
  # create-release.yml finds a successful push run with release-attestation-<sha>
  # — the exact existing release contract, minus the ~40-minute physical suite.
  # create-release.yml is intentionally unchanged.
  reuse-attestation:
    needs: preflight
    if: needs.preflight.outputs.dedup == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download prior tree attestation
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          run-id: ${{ needs.preflight.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prior
      - name: Re-emit attestation for this commit
        env:
          COMMIT_SHA: ${{ github.sha }}
          TREE_SHA: ${{ needs.preflight.outputs.tree_sha }}
          SOURCE_RUN_ID: ${{ needs.preflight.outputs.source_run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, datetime
          with open("prior/release-attestation.json", encoding="utf-8") as fh:
              att = json.load(fh)
          # Defence in depth: the reused record must describe this exact tree and
          # record passing suites before we relabel it to this commit, so a
          # mismatched artifact can never be laundered into a release approval.
          if att.get("tree_sha") != os.environ["TREE_SHA"]:
              raise SystemExit(
                  "tree_sha mismatch: artifact %s != %s"
                  % (att.get("tree_sha"), os.environ["TREE_SHA"])
              )
          for suite in ("ui", "api", "web"):
              if att.get("suites", {}).get(suite) != "success":
                  raise SystemExit("reused attestation records a non-passing suite")
          att["commit_sha"] = os.environ["COMMIT_SHA"]
          att["event"] = "push"
          att["reused_from_run_id"] = os.environ["SOURCE_RUN_ID"]
          att["reused_by_run_id"] = os.environ["RUN_ID"]
          att["reused_at"] = datetime.datetime.now(
              datetime.timezone.utc
          ).isoformat()
          with open("release-attestation.json", "w", encoding="utf-8") as fh:
              json.dump(att, fh, indent=2, sort_keys=True)
          print(json.dumps(att, indent=2, sort_keys=True))
          PY
      - name: Upload release validation attestation
        uses: actions/upload-artifact@v7
        with:
          name: release-attestation-${{ github.sha }}
          path: release-attestation.json
          retention-days: 90
