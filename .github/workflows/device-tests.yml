name: Device Tests

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  pull_request:
    branches:
      - main
    paths:
      - 'main/**'
      - 'components/**'
      - 'managed_components/**'
      - 'dependencies/**'
      - 'CMakeLists.txt'
      - 'sdkconfig*'
      - 'partitions.csv'
      - 'lv_conf.h'
      - 'repos.json'
      - 'fetch_repos.py'
      - 'tests/**'
      - '!tests/**/*.md'
      - '.github/workflows/device-tests.yml'
  workflow_call:
  workflow_dispatch:

# Only one device-test run at a time (single device on the network)
concurrency:
  group: device-tests
  cancel-in-progress: false  # queue new runs rather than cancelling in-progress

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Fetch dependencies
        run: python3 fetch_repos.py

      - name: Enable test endpoints for device testing
        run: |
          echo "CONFIG_TEST_ENDPOINTS=y" >> sdkconfig.defaults

      - name: ESP-IDF Build (test firmware)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.3
          target: esp32p4
          path: '.'

      - name: Upload firmware + flash metadata
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/arctic_controller.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/flasher_args.json
          retention-days: 7

  device-tests:
    needs: build
    runs-on: [self-hosted, vm-mi]
    timeout-minutes: 120
    env:
      ARCTIC_URL: http://arctic.local

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: build/

      - name: Set up Python environment
        run: |
          python3 -m venv $HOME/test-venv
          . $HOME/test-venv/bin/activate
          echo "$HOME/test-venv/bin" >> $GITHUB_PATH

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Flash device via OTA
        id: ota_flash
        continue-on-error: true
        run: |
          echo "Uploading firmware to device via OTA..."
          HTTP_CODE=$(curl -s -o /tmp/ota_response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/octet-stream" \
            -H "X-API-Key: ${{ secrets.ARCTIC_API_KEY }}" \
            --connect-timeout 10 \
            --max-time 120 \
            --data-binary @build/arctic_controller.bin \
            $ARCTIC_URL/api/ota/upload)
          echo "Response: $(cat /tmp/ota_response.txt)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "OTA upload failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "OTA upload successful, waiting for reboot..."

      - name: Wait for device reboot (OTA)
        if: steps.ota_flash.outcome == 'success'
        run: |
          sleep 10
          for i in $(seq 1 30); do
            if curl -s --connect-timeout 2 $ARCTIC_URL/api/heatpump/status > /dev/null 2>&1; then
              echo "Device is back online after $((i + 10))s"
              exit 0
            fi
            sleep 1
          done
          echo "Device did not come back online within 40s"
          exit 1

      - name: Fallback — flash via USB serial
        if: steps.ota_flash.outcome == 'failure'
        run: |
          echo "OTA failed, falling back to USB serial flash..."
          esptool.py --port /dev/ttyUSB0 --baud 921600 --chip esp32p4 \
            --before default_reset --after hard_reset \
            write_flash --flash_mode dio --flash_size 16MB --flash_freq 80m \
            0x2000  build/bootloader/bootloader.bin \
            0x8000  build/partition_table/partition-table.bin \
            0xf000  build/ota_data_initial.bin \
            0x20000 build/arctic_controller.bin

      - name: Wait for device boot (USB)
        if: steps.ota_flash.outcome == 'failure'
        run: |
          sleep 15
          for i in $(seq 1 30); do
            if curl -s --connect-timeout 2 $ARCTIC_URL/api/heatpump/status > /dev/null 2>&1; then
              echo "Device is back online"
              exit 0
            fi
            sleep 1
          done
          echo "Device did not come back online within 45s"
          exit 1

      - name: Run device UI tests
        id: ui_tests
        run: python -m pytest tests/device/ -v --tb=short --junitxml=test-results.xml -p no:cacheprovider
        env:
          ARCTIC_URL: http://arctic.local
          ARCTIC_API_KEY: ${{ secrets.ARCTIC_API_KEY }}

      - name: Run API contract tests
        id: api_tests
        run: python -m pytest tests/api/ -v --tb=short --junitxml=api-test-results.xml -p no:cacheprovider
        env:
          ARCTIC_URL: http://arctic.local
          ARCTIC_API_KEY: ${{ secrets.ARCTIC_API_KEY }}
          ARCTIC_USERNAME: ${{ secrets.ARCTIC_USERNAME }}
          ARCTIC_PASSWORD: ${{ secrets.ARCTIC_PASSWORD }}
          HYPOTHESIS_PROFILE: ci
          PYTHONDONTWRITEBYTECODE: '1'

      - name: Install Playwright for web tests
        run: |
          pip install -r tests/web/requirements.txt
          playwright install chromium

      - name: Run web dashboard tests
        id: web_tests
        run: python -m pytest tests/web/ -v --tb=short --junitxml=web-test-results.xml
        env:
          ARCTIC_URL: http://arctic.local
          ARCTIC_API_KEY: ${{ secrets.ARCTIC_API_KEY }}
          ARCTIC_USERNAME: ${{ secrets.ARCTIC_USERNAME }}
          ARCTIC_PASSWORD: ${{ secrets.ARCTIC_PASSWORD }}

      - name: Publish UI test results
        uses: dorny/test-reporter@v1
        if: always() && steps.ui_tests.outcome != 'skipped'
        with:
          name: Device UI Test Results
          path: test-results.xml
          reporter: java-junit

      - name: Publish API contract test results
        uses: dorny/test-reporter@v1
        if: always() && steps.api_tests.outcome != 'skipped'
        with:
          name: API Contract Test Results
          path: api-test-results.xml
          reporter: java-junit

      - name: Publish web test results
        uses: dorny/test-reporter@v1
        if: always() && steps.web_tests.outcome != 'skipped'
        with:
          name: Web Dashboard Test Results
          path: web-test-results.xml
          reporter: java-junit

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-screenshots
          path: |
            tests/device/screenshots/
            tests/web/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Extract test results for badges
        id: test_results
        if: always()
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          import os

          def parse_junit(path):
              if not os.path.exists(path):
                  return 0, 0, 0
              root = ET.parse(path).getroot()
              # pytest wraps results in <testsuites><testsuite ...></testsuites>
              if root.tag == 'testsuites':
                  suites = root.findall('testsuite')
              else:
                  suites = [root]
              tests = sum(int(s.get('tests', 0)) for s in suites)
              failures = sum(int(s.get('failures', 0)) + int(s.get('errors', 0)) for s in suites)
              skipped = sum(int(s.get('skipped', 0)) for s in suites)
              return tests - failures - skipped, failures, skipped

          any_results = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as gh:
              for name, path in [('ui', 'test-results.xml'), ('api', 'api-test-results.xml'), ('web', 'web-test-results.xml')]:
                  p, f, s = parse_junit(path)
                  total = p + f + s
                  if total > 0:
                      any_results = True
                  msg = f'{p} passed'
                  if s: msg += f', {s} skipped'
                  if f: msg += f', {f} failed'
                  color = 'red' if f > 0 else 'brightgreen'
                  gh.write(f'{name}_msg={msg}\n')
                  gh.write(f'{name}_color={color}\n')
              gh.write(f'has_results={\"true\" if any_results else \"false\"}\n')
          "

      - name: Update Device UI Tests badge
        if: always() && steps.test_results.outputs.has_results == 'true'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: b37c67c774075a8a90afd54b7c3a4592
          filename: ui_tests.json
          label: Device UI Tests
          message: ${{ steps.test_results.outputs.ui_msg }}
          color: ${{ steps.test_results.outputs.ui_color }}

      - name: Update API Contract Tests badge
        if: always() && steps.test_results.outputs.has_results == 'true'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: b37c67c774075a8a90afd54b7c3a4592
          filename: api_tests.json
          label: API Contract Tests
          message: ${{ steps.test_results.outputs.api_msg }}
          color: ${{ steps.test_results.outputs.api_color }}

      - name: Update Web Dashboard Tests badge
        if: always() && steps.test_results.outputs.has_results == 'true'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: b37c67c774075a8a90afd54b7c3a4592
          filename: web_tests.json
          label: Web Dashboard Tests
          message: ${{ steps.test_results.outputs.web_msg }}
          color: ${{ steps.test_results.outputs.web_color }}

  # Gate job — always runs so branch protection has a status to check
  # even when path filters skip the build/test jobs (e.g. docs-only PRs)
  tests-status:
    if: always()
    needs: [build, device-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.build.result }}" = "failure" ] || [ "${{ needs.device-tests.result }}" = "failure" ]; then
            echo "Build or tests failed"
            exit 1
          fi
          if [ "${{ needs.build.result }}" = "cancelled" ] || [ "${{ needs.device-tests.result }}" = "cancelled" ]; then
            echo "Build or tests were cancelled"
            exit 1
          fi
