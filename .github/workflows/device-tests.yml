name: Device Tests

on:
  push:
    branches:
      - feature/device-ui-tests
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Fetch dependencies
        run: python3 fetch_repos.py

      - name: Enable test endpoints for device testing
        run: |
          echo "CONFIG_TEST_ENDPOINTS=y" >> sdkconfig.defaults

      - name: ESP-IDF Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.3
          target: esp32p4
          path: '.'

      - name: Upload firmware + flash metadata
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/arctic_controller.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/flasher_args.json
          retention-days: 7

  device-tests:
    needs: build
    runs-on: [self-hosted, tab5]
    timeout-minutes: 30
    env:
      ARCTIC_URL: http://arctic.local

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: build/

      - name: Flash device via OTA
        id: ota_flash
        continue-on-error: true
        run: |
          echo "Uploading firmware to device via OTA..."
          HTTP_CODE=$(curl -s -o /tmp/ota_response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/octet-stream" \
            -H "X-API-Key: ${{ secrets.ARCTIC_API_KEY }}" \
            --connect-timeout 10 \
            --max-time 120 \
            --data-binary @build/arctic_controller.bin \
            $ARCTIC_URL/api/ota/upload)
          echo "Response: $(cat /tmp/ota_response.txt)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "OTA upload failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "OTA upload successful, waiting for reboot..."

      - name: Wait for device reboot (OTA)
        if: steps.ota_flash.outcome == 'success'
        run: |
          sleep 10
          for i in $(seq 1 30); do
            if curl -s --connect-timeout 2 $ARCTIC_URL/api/heatpump/status > /dev/null 2>&1; then
              echo "Device is back online after $((i + 10))s"
              exit 0
            fi
            sleep 1
          done
          echo "Device did not come back online within 40s"
          exit 1

      - name: Fallback — flash via USB serial
        if: steps.ota_flash.outcome == 'failure'
        run: |
          echo "OTA failed, falling back to USB serial flash..."
          esptool.py --port /dev/ttyUSB0 --baud 921600 --chip esp32p4 \
            --before default_reset --after hard_reset \
            write_flash --flash_mode dio --flash_size 16MB --flash_freq 80m \
            0x2000  build/bootloader/bootloader.bin \
            0x8000  build/partition_table/partition-table.bin \
            0xf000  build/ota_data_initial.bin \
            0x20000 build/arctic_controller.bin

      - name: Wait for device boot (USB)
        if: steps.ota_flash.outcome == 'failure'
        run: |
          sleep 15
          for i in $(seq 1 30); do
            if curl -s --connect-timeout 2 $ARCTIC_URL/api/heatpump/status > /dev/null 2>&1; then
              echo "Device is back online"
              exit 0
            fi
            sleep 1
          done
          echo "Device did not come back online within 45s"
          exit 1

      - name: Run device tests
        run: python -m pytest tests/device/ -v --tb=short --junitxml=test-results.xml
        env:
          ARCTIC_URL: http://arctic.local

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Device Test Results
          path: test-results.xml
          reporter: java-junit
