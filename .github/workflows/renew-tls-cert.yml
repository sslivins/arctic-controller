name: Renew TLS Certificate

on:
  schedule:
    # Run on the 1st and 15th of each month at 03:00 UTC
    - cron: '0 3 1,15 * *'
  workflow_dispatch:
    inputs:
      force_renewal:
        description: 'Force renewal even if cert is not near expiry'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: tls-cert-renewal
  cancel-in-progress: false

jobs:
  renew:
    name: Renew wildcard cert and deploy to device
    runs-on: vm-mi
    env:
      ARCTIC_URL: https://arctic-01b0.mennlabs.com
    steps:
      - uses: actions/checkout@v6

      - name: Install certbot and Cloudflare plugin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq certbot python3-certbot-dns-cloudflare

      - name: Write Cloudflare credentials
        run: |
          mkdir -p ~/.secrets
          echo "dns_cloudflare_api_token = ${{ secrets.CLOUDFLARE_API_TOKEN }}" > ~/.secrets/cloudflare.ini
          chmod 600 ~/.secrets/cloudflare.ini

      - name: Renew certificate
        id: certbot
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force_renewal }}" = "true" ]; then
            FORCE_FLAG="--force-renewal"
          fi

          sudo certbot certonly \
            --dns-cloudflare \
            --dns-cloudflare-credentials ~/.secrets/cloudflare.ini \
            --dns-cloudflare-propagation-seconds 30 \
            -d "*.mennlabs.com" \
            --non-interactive \
            --agree-tos \
            --email "${{ secrets.CERTBOT_EMAIL }}" \
            --cert-name mennlabs-wildcard \
            $FORCE_FLAG \
            2>&1 | tee certbot-output.txt

          # Check if cert was actually renewed or skipped
          if grep -q "Certificate not yet due for renewal" certbot-output.txt; then
            echo "renewed=false" >> "$GITHUB_OUTPUT"
            echo "Certificate not yet due for renewal — skipping deployment."
          else
            echo "renewed=true" >> "$GITHUB_OUTPUT"
            echo "Certificate renewed successfully."
          fi

      - name: Sync API key from device
        if: steps.certbot.outputs.renewed == 'true'
        run: |
          DEVICE_KEY=""

          for URL in "$ARCTIC_URL"; do
            RESP=$(curl -sS --fail --connect-timeout 3 --max-time 5 "$URL/api/auth/apikey" 2>/dev/null) || true
            DEVICE_KEY=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('api_key',''))" 2>/dev/null) || true

            if [ -z "$DEVICE_KEY" ]; then
              JAR=$(mktemp)
              curl -sS --fail -c "$JAR" -X POST "$URL/login" \
                -H "Content-Type: application/json" \
                -d "{\"username\": \"$ARCTIC_USERNAME\", \"password\": \"$ARCTIC_PASSWORD\"}" > /dev/null 2>&1 || true
              RESP=$(curl -sS --fail -b "$JAR" --max-time 5 "$URL/api/auth/apikey" 2>/dev/null) || true
              DEVICE_KEY=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('api_key',''))" 2>/dev/null) || true
              rm -f "$JAR"
            fi

            if [ -n "$DEVICE_KEY" ]; then
              break
            fi
          done

          if [ -n "$DEVICE_KEY" ]; then
            echo "ARCTIC_API_KEY=$DEVICE_KEY" >> $GITHUB_ENV
            echo "Synced API key from device"
          else
            echo "::warning::Could not read device API key — using secret"
          fi
        env:
          ARCTIC_USERNAME: ${{ secrets.ARCTIC_USERNAME }}
          ARCTIC_PASSWORD: ${{ secrets.ARCTIC_PASSWORD }}

      - name: Enable both auth methods on device
        if: steps.certbot.outputs.renewed == 'true'
        run: |
          curl -sSf --max-time 10 \
            -H "X-API-Key: ${ARCTIC_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"web_auth_enabled": true, "api_auth_enabled": true}' \
            "$ARCTIC_URL/api/auth/config" \
            || echo "Warning: Could not configure auth (may already be set)"

      - name: Clear existing certs on device
        if: steps.certbot.outputs.renewed == 'true'
        run: |
          # Delete any existing certs to avoid the deadlock where certs exist
          # in NVS but HTTPS failed to start (blocks HTTP cert uploads).
          for URL in "$ARCTIC_URL"; do
            curl -sS --fail --max-time 10 -X DELETE \
              -H "X-API-Key: ${ARCTIC_API_KEY}" \
              "$URL/api/tls/certificate" 2>/dev/null && break || true
          done

      - name: Upload certificate to device
        if: steps.certbot.outputs.renewed == 'true'
        run: |
          CERT_DIR="/etc/letsencrypt/live/mennlabs-wildcard"
          FULLCHAIN=$(sudo cat "$CERT_DIR/fullchain.pem")
          PRIVKEY=$(sudo cat "$CERT_DIR/privkey.pem")
          PAYLOAD=$(jq -n \
            --arg cert "$FULLCHAIN" \
            --arg key "$PRIVKEY" \
            '{cert: $cert, key: $key}')

          for URL in "$ARCTIC_URL"; do
            RESPONSE=$(curl -sS --max-time 30 -w '\n%{http_code}' \
              -H "X-API-Key: ${ARCTIC_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$URL/api/tls/certificate") || true
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "$URL → HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Device response: $BODY"
              echo "Certificate uploaded successfully."
              exit 0
            fi
          done

          echo "::error::Certificate upload failed over HTTPS"
          exit 1

      - name: Reboot device to activate new cert
        if: steps.certbot.outputs.renewed == 'true'
        run: |
          curl -sSf --max-time 10 \
            -H "X-API-Key: ${ARCTIC_API_KEY}" \
            -X POST \
            "$ARCTIC_URL/api/ota/reboot" \
            || true

          echo "Reboot triggered. Waiting for device to come back..."
          sleep 10

          for i in $(seq 1 30); do
            if curl -sS --fail --connect-timeout 2 "$ARCTIC_URL/api/health" > /dev/null 2>&1; then
              echo "Device is back online after $((i + 10))s."
              exit 0
            fi
            sleep 1
          done
          echo "::warning::Device did not respond within 40s after reboot"

      - name: Update GitHub secrets with new certs
        if: steps.certbot.outputs.renewed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CERT_GITHUB_TOKEN }}
        run: |
          CERT_DIR="/etc/letsencrypt/live/mennlabs-wildcard"

          sudo cat "$CERT_DIR/fullchain.pem" | gh secret set TLS_FULLCHAIN_PEM --repo "${{ github.repository }}"
          sudo cat "$CERT_DIR/privkey.pem"   | gh secret set TLS_PRIVKEY_PEM   --repo "${{ github.repository }}"

          echo "GitHub secrets updated with renewed certificates."

      - name: Cleanup credentials
        if: always()
        run: rm -f ~/.secrets/cloudflare.ini
