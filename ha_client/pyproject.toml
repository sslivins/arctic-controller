[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arctic-controller-client"
version = "0.1.0"
description = "Async local client for Arctic Heat Pump Controllers"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11",
    "yarl>=1.9",
]

[project.optional-dependencies]
test = [
    "cryptography>=42",
    "pytest>=7",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arctic_controller = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
