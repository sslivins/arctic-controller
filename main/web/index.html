        const inst = form.querySelector('[name="object_instance"]');
        const deviceInst = form.querySelector('[name="device_instance"]');
        const objectName = form.querySelector('[name="object_name"]');
        const romId = form.querySelector('[name="rom_id"]');
        if (type) type.value = el.dataset.objectType || "analog_input";
        if (inst) inst.value = el.dataset.objectInstance || "0";
        if (deviceInst) deviceInst.value = el.dataset.deviceInstance || "";
        if (objectName) objectName.value = el.dataset.objectName || "";
        if (romId) romId.value = el.dataset.romId || "";
        toast(`Selected ${el.dataset.objectName || "BACnet sensor"}`, "good");
        return;
      }
      if (action === "ha-pair") {
        const data = await mutate("/api/ha/pair", { method: "POST" }, "Pairing started");
        const code = data.code || "";
        if (code) sessionStorage.setItem("ha_pair_code", code);
        state.ha = { ...state.ha, code, pairing_active: true, remaining_seconds: data.expires_in_seconds || 0 };
        render(); startHaPolling();
      }
      if (action === "ha-cancel") {
        await mutate("/api/ha/pair", { method: "DELETE" }, "Pairing cancelled");
        sessionStorage.removeItem("ha_pair_code");
        stopHaPolling(); state.ha = { ...state.ha, code: "", pairing_active: false, remaining_seconds: 0 }; render();
      }
      if (action === "ha-revoke" && confirm("Revoke Home Assistant pairing? Home Assistant will lose access until you pair again.")) {
        await mutate("/api/ha/revoke", { method: "POST" }, "Pairing revoked");
        sessionStorage.removeItem("ha_pair_code");
        stopHaPolling(); state.ha = { ...state.ha, paired: false, code: "", pairing_active: false, remaining_seconds: 0 }; render();
      }
      if (action === "refresh-logs") await loadLogs(true);
      if (action === "clear-logs" && confirm("Clear controller logs?")) {
        await mutate("/api/logs", { method: "DELETE" }, "Logs cleared"); state.logs = []; state.logSeq = 0; render();
      }
      if (action === "factory-reset" && confirm("Factory reset this controller? This cannot be undone.")) {
        const phrase = prompt('Type "factory-reset" to permanently erase the controller.');
        if (phrase === "factory-reset") await mutate("/api/factory-reset", jsonOptions("POST", { confirm: phrase }), "Factory reset started");
      }
    }
    function startPowerHold(el) {
      if (!state.hp.unit_on) {
        mutate("/api/heatpump/power", jsonOptions("PUT", { on: true }), "Power turned on")
          .then(() => { state.hp.unit_on = true; render(); }); return;
      }
      state.powerHolding = true; render();
      state.powerHoldTimer = setTimeout(async () => {
        state.powerHolding = false;
        await mutate("/api/heatpump/power", jsonOptions("PUT", { on: false }), "Power turned off");
        state.hp.unit_on = false; render();
      }, 3000);
    }
    function cancelPowerHold() {
      if (state.powerHoldTimer) clearTimeout(state.powerHoldTimer);
      state.powerHoldTimer = null;
      if (state.powerHolding) { state.powerHolding = false; render(); }
    }

    document.addEventListener("click", async event => {
      // Close the notification panel when clicking outside it (but still let the
      // click perform its normal action below).
      if (state.notifOpen && !event.target.closest(".notif-wrap")) {
        state.notifOpen = false; render();
      }
      const route = event.target.closest("[data-route]");
      if (route) { event.preventDefault(); await navigate(route.dataset.route); return; }
      const settings = event.target.closest("[data-settings]");
      if (settings) { event.preventDefault(); await navigate("settings", settings.dataset.settings); return; }
      const action = event.target.closest("[data-action]");
      if (action && action.dataset.action !== "power-hold") {
        event.preventDefault(); handleAction(action.dataset.action, action).catch(error => {
          if (!error.toastShown) toast(error.message, "bad");
        });
      }
    });
    document.addEventListener("submit", event => {
      const form = event.target.closest("[data-form]");
      if (!form) return;
      event.preventDefault();
      handleForm(form).catch(error => {
        if (!error.toastShown) toast(error.message, "bad");
      });
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && document.querySelector('#overlay [data-action="demo-cancel"]')) closeOverlay();
    });
    document.addEventListener("pointerdown", event => {
      const button = event.target.closest('[data-action="power-hold"]');
      if (button) { event.preventDefault(); startPowerHold(button); }
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(name =>
      document.addEventListener(name, event => {
        if (event.target.closest?.('[data-action="power-hold"]')) cancelPowerHold();
      }));
    document.addEventListener("pointermove", histHover);
    document.addEventListener("pointerleave", histHover);
    document.addEventListener("input", event => {
      if (event.target.id === "event-search") {
        state.eventFilters.search = event.target.value;
        refreshEventResults();
      }
      if (event.target.name === "brightness") {
        const value = $("#brightness-value"); if (value) value.textContent = `${event.target.value}%`;
      }
      if (event.target.name === "glycol_pct") {
        const value = $("#perf-glycol-value"); if (value) value.textContent = `${event.target.value}%`;
      }
      if (event.target.matches(".control-range")) {
        const output = event.target.closest(".range-editor")?.querySelector("[data-range-output]");
        if (output) output.textContent = `${event.target.value}${event.target.dataset.unit ? ` ${event.target.dataset.unit}` : ""}`;
      }
    });
    document.addEventListener("change", event => {
      if (event.target.matches("select.choice-select")) {
        const description = event.target.closest(".choice-editor")?.querySelector(".choice-description");
        const selected = event.target.selectedOptions[0];
        if (description) description.textContent = selected?.dataset.description || "";
      }
      if (event.target.id === "event-category") { state.eventFilters.category = event.target.value.toLowerCase(); render(); }
      if (event.target.id === "event-time") { state.eventFilters.time = event.target.value; render(); }
      if (event.target.id === "log-level") { state.logLevel = event.target.value; loadLogs(true).catch(() => {}); }
      const perfField = event.target.dataset?.perf;
      if (perfField === "fluid") {
        const water = event.target.value === "water";
        const field = event.target.form?.querySelector(".perf-glycol");
        if (field) { field.classList.toggle("is-disabled", water); field.querySelector("input").disabled = water; }
      }
      if (perfField === "source") {
        const form = event.target.form, modbus = event.target.value === "modbus_tcp", bacnet = event.target.value === "bacnet_ip", network = modbus || bacnet;
        form.querySelector(".perf-modbus").hidden = !network;
        form.querySelectorAll(".perf-modbus-only").forEach(x => x.hidden = !modbus);
        form.querySelectorAll(".perf-bacnet-only").forEach(x => x.hidden = !bacnet);
        form.querySelector('[data-action="perf-test"]').hidden = !network;
        form.querySelector('[name="device_instance"]').value = "";
        form.querySelector('[name="object_name"]').value = "";
        form.querySelector('[name="rom_id"]').value = "";
        const port = form.querySelector('[name="port"]');
        if (port && bacnet) port.value = "47808";
        if (port && modbus) port.value = "502";
      }
      if (perfField === "bacnet_identity" && event.target.form?.querySelector('[name="source"]')?.value === "bacnet_ip") {
        event.target.form.querySelector('[name="device_instance"]').value = "";
        event.target.form.querySelector('[name="object_name"]').value = "";
        event.target.form.querySelector('[name="rom_id"]').value = "";
      }
      if (perfField === "value_type") {
        const select = event.target.form.querySelector('select[name="no_reading"]');
        const float = perfIsFloat(event.target.value);
        select.disabled = float;
        if (float) select.value = "none";
        else if (select.value === "none") select.value = "0x8000";
      }
    });
    async function navigateFromLocation() {
      routeFromHash();
      await navigate(state.route, state.settingsPage);
    }
    window.addEventListener("hashchange", navigateFromLocation);
    window.addEventListener("popstate", navigateFromLocation);

    async function init() {
      routeFromHash();
      try {
        const auth = await fetch("/api/auth/status").then(r => r.json());
        state.auth = {
          checked: true,
          required: true,
          loggedIn: !!auth.session_valid,
          changeRequired: !!auth.credentials_change_required
        };
        if (state.auth.loggedIn && !state.auth.changeRequired) {
          render();
          await loadCore();
          if (state.route === "control") await loadParams();
          if (state.route === "history") await loadHistory();
          if (state.route === "events") await loadEvents(true);
          if (state.route === "settings") await ensureSettings();
        }
      } catch (error) {
        state.auth.checked = true;
        toast(`Controller unavailable: ${error.message}`, "bad");
      }
      if (state.route === "events" && document.activeElement?.id === "event-search") refreshEventResults();
      else render();
      if (state.route === "settings" && state.settingsPage === "diagnostics") startLogPolling();
      if (state.route === "settings" && state.settingsPage === "home_assistant") {
        await loadHaStatus().catch(() => {});
        render();
        startHaPolling();
      }
      if (state.route === "settings" && state.settingsPage === "performance") {
        await loadPerf().catch(error => toast(error.message, "bad"));
        render();
        startPerfPolling();
      }
      state.pollTimer = setInterval(async () => {
        if (!state.auth.loggedIn || state.auth.changeRequired) return;
        try {
          const [status, hp, wifi, ota, errors, notif, weather] = await Promise.all([
            api("/api/status"), api("/api/heatpump/status"), api("/api/wifi"), api("/api/ota/status"), api("/api/heatpump/errors"), api("/api/notifications"),
            api("/api/weather")
          ]);
          Object.assign(state, { status, hp, wifi, ota, errors, weather });
          const prevNotifCount = (state.notifications || []).length;
          state.notifications = notif.notifications || [];
          if (state.route === "events") {
            const searchFocused = document.activeElement?.id === "event-search";
            await loadEvents(true);
            if (searchFocused) refreshEventResults();
            else render();
          } else if (["home", "status", "errors"].includes(state.route)) render();
          else if (state.notifications.length !== prevNotifCount) render();
          else if (state.route === "settings" && state.settingsPage === "firmware"
                   && ota && ota.state && ota.state !== "idle") render();
        } catch (_) {}
      }, 5000);
    }
    init();
  </script>
</body>
</html>
