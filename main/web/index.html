<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arctic Controller</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
      const mq = window.matchMedia("(prefers-color-scheme: dark)");
      const apply = () =>
        document.documentElement.setAttribute("data-theme", param || (mq.matches ? "dark" : "light"));
      apply();
      if (!param && mq.addEventListener) mq.addEventListener("change", apply);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    :root {
      --cp-bg: #f4f6fa;
      --cp-bg-elevated: #fbfcfe;
      --cp-surface-soft: #eef2f7;
      --cp-border: #d6dde6;
      --cp-border-strong: #8a97a6;
      --cp-accent: #005a9e;
      --cp-accent-hover: #044a86;
      --cp-accent-soft: rgba(0, 90, 158, 0.08);
      --cp-highlight: rgba(0, 90, 158, 0.12);
      --cp-panel: rgba(251, 252, 254, 0.86);
      --cp-panel-strong: rgba(251, 252, 254, 0.96);
      /* Cycle-history chart series. */
      --hist-out: #334155;
      --hist-in: #c026d3;
      --hist-set: #16a34a;
      --hist-heat: #f97316;
      --hist-cool: #3b82f6;
      --hist-dhw: #f59e0b;
      --hist-power: #7c3aed;
      --energy-other: #94a3b8;
      /* Run-mode bands: fill plus a solid strip along the bottom. A thin flat
         tint over the dark navy background reads as muddy brown/olive, so dark
         mode fades the fill from strong at the bottom to faint at the top. */
      --band-heat: #f97316;
      --band-cool: #3b82f6;
      --band-dhw: #f59e0b;
      --band-a0: 16%;
      --band-a1: 16%;
      --band-a2: 16%;
      --power-fill-a: 0.25;
      --hist-band-strength: 22%; --hist-defrost-strength: 45%;
    }
    html[data-theme="dark"] {
      --cp-bg: #1a1a2e;
      --cp-bg-elevated: #0f1a2e;
      --cp-surface: #1e2a4a;
      --cp-surface-soft: #1a2a4e;
      --cp-border: #0f3460;
      --cp-border-strong: #28496f;
      --cp-text: #eaeaea;
      --cp-text-muted: #9fb3c8;
      --cp-text-soft: #b9c6d6;
      --cp-accent: #00d4ff;
      --cp-accent-hover: #5ce0ff;
      --cp-accent-soft: rgba(0, 212, 255, 0.14);
      --cp-accent-fg: #062033;
      --cp-success: #4ade80;
      --cp-danger: #ef4444;
      --cp-warning: #fbbf24;
      --cp-link: #00d4ff;
      --cp-overlay: rgba(15, 26, 46, 0.88);
      --cp-panel: rgba(15, 26, 46, 0.72);
      --cp-panel-strong: rgba(15, 26, 46, 0.96);
      --cp-highlight: rgba(0, 212, 255, 0.12);
      --hist-out: #f1f5f9;
      --hist-in: #d946ef;
      --hist-set: #4ade80;
      --hist-heat: #f97316;
      --hist-cool: #3b82f6;
      --hist-dhw: #fbbf24;
      --hist-power: #a78bfa;
      --energy-other: #64748b;
      --band-heat: #fb923c;
      --band-cool: #60a5fa;
      --band-dhw: #facc15;
      --band-a0: 60%;
      --band-a1: 10%;
      --band-a2: 6%;
      --power-fill-a: 0.55;
      --hist-band-strength: 50%; --hist-defrost-strength: 60%;
    }
    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.45;
    }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    a { color: var(--cp-link); }
    .hidden { display: none !important; }
    .app { min-height: 100vh; }
    .topbar {
      position: sticky; top: 0; z-index: 30;
      height: 64px; display: flex; align-items: center; gap: 16px;
      padding: 0 20px; background: var(--cp-panel-strong);
      border-bottom: 1px solid var(--cp-border);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 210px; font-weight: 700; }
    /* The top bar has no room for the controller name on narrow screens, so it
       gets its own line underneath there. */
    .name-strip { display: none; }
    .brand-mark {
      width: 34px; height: 34px; display: grid; place-items: center;
      border-radius: 10px; background: var(--cp-accent); color: var(--cp-accent-fg);
      font-size: 19px; flex: none;
    }
    .top-status { flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 12px; min-width: 0; }
    .status-item { display: flex; align-items: center; gap: 7px; color: var(--cp-text-muted); font-size: 13px; white-space: nowrap; }
    .hp-status { min-width: 0; }
    .status-label { overflow: hidden; text-overflow: ellipsis; }
    .wx-icon { width: 18px; height: 20px; flex: none; }
    .status-item.wx { gap: 5px; }
    .loc-current { display: flex; flex-direction: column; gap: 2px; margin-bottom: 14px; }
    .loc-coords { color: var(--cp-text-muted); font-size: 13px; }
    .loc-results { list-style: none; margin: 10px 0 0; padding: 0; border: 1px solid var(--cp-border); border-radius: 10px; overflow: hidden; }
    .loc-results li + li { border-top: 1px solid var(--cp-border); }
    .loc-result { display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
      padding: 11px 12px; font: inherit; color: inherit; min-height: 44px; }
    .loc-result:hover, .loc-result:focus-visible { background: var(--cp-surface-soft); }
    .loc-result small { display: block; color: var(--cp-text-muted); font-size: 12px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cp-border-strong); flex: none; }
    .dot.good { background: var(--cp-success); }
    .dot.bad { background: var(--cp-danger); }
    .icon-btn {
      width: 42px; min-width: 42px; height: 42px; border: 1px solid var(--cp-border);
      border-radius: 12px; background: var(--cp-surface); color: var(--cp-text);
      display: grid; place-items: center; text-decoration: none; padding: 0; flex: none;
    }
    .icon-svg { width: 22px; height: 22px; display: block; fill: currentColor; }
    .signout-btn { color: var(--cp-text); }
    .notif-wrap { position: relative; }
    .notif-btn { position: relative; cursor: pointer; font-size: 17px; }
    .notif-badge {
      position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px;
      padding: 0 5px; border-radius: 9px; background: var(--cp-danger); color: #fff;
      font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
    }
    .notif-panel {
      position: absolute; top: 46px; right: 0; width: 320px; max-width: 82vw; z-index: 50;
      background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0,0,0,.35); overflow: hidden;
    }
    .notif-panel h3 { margin: 0; padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--cp-border); color: var(--cp-text-muted); }
    .notif-item {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      padding: 12px 14px; border: 0; border-bottom: 1px solid var(--cp-border);
      background: transparent; color: var(--cp-text); font-size: 14px; cursor: pointer;
    }
    .notif-item:last-child { border-bottom: 0; }
    .notif-item:hover { background: var(--cp-surface-soft); }
    .notif-item .ni-icon { font-size: 18px; flex: 0 0 auto; }
    .notif-empty { padding: 18px 14px; color: var(--cp-text-muted); font-size: 13px; text-align: center; }
    .ota-indeterminate { margin: 12px 0 6px; height: 6px; border-radius: 3px; background: var(--cp-border); overflow: hidden; }
    .ota-indeterminate-bar { width: 40%; height: 100%; border-radius: 3px; background: var(--cp-accent, #2f81f7); animation: ota-slide 1.3s ease-in-out infinite; }
    @keyframes ota-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
    .ota-run { margin-top: 16px; padding: 14px 16px; border: 1px solid var(--cp-border); border-radius: 10px; background: var(--cp-surface-soft); }
    .ota-run h3 { margin: 0 0 10px; font-size: 15px; }
    .ota-steps { display: flex; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 12px; color: var(--cp-text-muted); }
    .ota-steps li { flex: 1 1 0; padding-top: 6px; border-top: 3px solid var(--cp-border); }
    .ota-steps li.done { border-color: var(--cp-accent, #2f81f7); }
    .ota-steps li.current { border-color: var(--cp-accent, #2f81f7); color: var(--cp-text); font-weight: 600; }
    .ota-bar { margin: 12px 0 6px; height: 6px; border-radius: 3px; background: var(--cp-border); overflow: hidden; }
    .ota-bar-fill { height: 100%; border-radius: 3px; background: var(--cp-accent, #2f81f7); transition: width .4s ease; }
    .ota-run .metric-sub { margin: 0; }
    .ota-run .btn-row { margin-top: 10px; }
    .confirm-dialog .ota-versions { margin: 0 0 10px; color: var(--cp-text-muted); font-size: 14px; }
    .confirm-dialog .ota-notes { margin: 0 0 12px; padding-left: 20px; font-size: 14px; max-height: 40vh; overflow-y: auto; }
    .confirm-dialog .ota-notes li { margin: 2px 0; }
    .confirm-dialog h4 { margin: 0 0 4px; font-size: 13px; color: var(--cp-text-muted); text-transform: uppercase; letter-spacing: .04em; }
    .layout { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: calc(100vh - 64px); }
    .rail {
      position: sticky; top: 64px; align-self: start; height: calc(100vh - 64px);
      padding: 20px 12px; border-right: 1px solid var(--cp-border);
      background: var(--cp-bg-elevated);
    }
    .nav-link {
      width: 100%; border: 0; background: transparent; color: var(--cp-text-muted);
      border-radius: 10px; padding: 11px 12px; margin: 2px 0;
      display: flex; align-items: center; gap: 11px; text-align: left; font-weight: 600;
    }
    .nav-link:hover { background: var(--cp-surface-soft); color: var(--cp-text); }
    .nav-link.active { background: var(--cp-accent-soft); color: var(--cp-accent); }
    .nav-icon { width: 22px; text-align: center; font-size: 17px; }
    .main { min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 48px; }
    .page { max-width: 1220px; margin: 0 auto; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .page-head > div:first-child { min-width: 0; }
    .page-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex: none; }
    .page-actions .btn { white-space: nowrap; }
    .hist-seg { display: inline-flex; gap: 4px; padding: 4px; margin: -8px 0 20px; border: 1px solid var(--cp-border); border-radius: 12px; background: var(--cp-bg-elevated); }
    .hist-seg-btn { border: 0; background: transparent; color: var(--cp-text-muted); padding: 8px 20px; border-radius: 9px; font-weight: 600; cursor: pointer; }
    .hist-seg-btn:hover { color: var(--cp-text); }
    .hist-seg-btn.active { background: var(--cp-accent-soft); color: var(--cp-accent); }
    @media (max-width: 520px) {
      .hist-seg { display: flex; }
      .hist-seg-btn { flex: 1; padding: 8px 4px; }
    }
    .page-head h1 { margin: 0; font-size: clamp(26px, 4vw, 36px); letter-spacing: -0.03em; }
    .page-head p { margin: 5px 0 0; color: var(--cp-text-muted); }
    .grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .card {
      background: var(--cp-surface); border: 1px solid var(--cp-border);
      border-radius: 16px; padding: 20px;
      box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
    }
    .card h2, .card h3 { margin: 0 0 12px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .hero { padding: 28px; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; }
    .eyebrow { text-transform: uppercase; font-size: 12px; letter-spacing: .1em; color: var(--cp-text-muted); font-weight: 700; }
    .hero-title { margin: 6px 0; font-size: clamp(32px, 6vw, 54px); line-height: 1; letter-spacing: -.04em; }
    .hero-sub { color: var(--cp-text-muted); }
    .temp-hero { text-align: right; }
    .temp-value { font-size: clamp(44px, 8vw, 72px); line-height: 1; font-weight: 650; letter-spacing: -.06em; }
    .temp-label { color: var(--cp-text-muted); margin-top: 6px; }
    .metric { min-height: 112px; }
    .metric-label { color: var(--cp-text-muted); font-size: 13px; }
    .metric-value { font-size: 28px; font-weight: 650; margin-top: 8px; }
    .metric-sub { color: var(--cp-text-soft); font-size: 13px; margin-top: 4px; }
    .component-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .component {
      padding: 13px; border: 1px solid var(--cp-border); border-radius: 10px;
      background: var(--cp-surface-soft);
    }
    .component strong { display: block; margin-top: 4px; }
    .state-on { color: var(--cp-success); }
    .state-off { color: var(--cp-text-muted); }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px;
      border-radius: 999px; font-size: 12px; font-weight: 700;
      background: var(--cp-surface-soft); color: var(--cp-text-muted);
    }
    .badge.good { color: var(--cp-success); background: var(--cp-surface-soft); }
    .badge.warn { color: var(--cp-warning); }
    .badge.bad { color: var(--cp-danger); }
    .btn {
      min-height: 42px; border-radius: 10px; padding: 8px 14px;
      border: 1px solid var(--cp-border-strong); background: var(--cp-surface);
      color: var(--cp-text); font-weight: 650; white-space: nowrap;
    }
    .btn:hover { background: var(--cp-surface-soft); }
    .btn.primary { background: var(--cp-accent); border-color: var(--cp-accent); color: var(--cp-accent-fg); }
    .btn.primary:hover { background: var(--cp-accent-hover); }
    .btn.danger { color: var(--cp-danger); border-color: var(--cp-danger); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .hist-muted { color: var(--cp-text-muted); margin: 8px 0; }
    .hist-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .hist-range-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .hist-range { font-weight: 600; }
    .hist-latest { min-height: 32px; padding: 4px 6px 4px 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 2px; }
    .hist-latest svg { width: 18px; height: 18px; fill: currentColor; }
    .hist-latest[hidden] { display: none; }
    .hist-range-actions { display: flex; align-items: center; gap: 10px; }
    .hist-zoom button { padding: 5px 10px; white-space: nowrap; }
    .hist-tip-state { font-weight: 600; }
    .hist-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--cp-text-muted); }
    .hist-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .hist-legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
    .hist-legend i.band { width: 12px; height: 12px; border-radius: 3px; }
    /* Legend swatch drawn like a run band: tint + solid bottom strip. */
    i.band-swatch { background: linear-gradient(to top, color-mix(in srgb, var(--band) 70%, transparent),
      color-mix(in srgb, var(--band) 20%, transparent)) !important;
      border-bottom: 3px solid var(--band); border-radius: 2px !important; box-sizing: border-box; }
    /* Cycle chart (tschart widget), themed from the page palette. */
    .hist-chart { height: 440px; -webkit-touch-callout: none;
      --ts-text: var(--cp-text); --ts-dim: var(--cp-text-muted); --ts-grid: var(--cp-border);
      --ts-panel: var(--cp-surface); --ts-card: var(--cp-panel-strong); --ts-danger: var(--cp-danger); }
    @media (max-width: 600px) { .hist-chart { height: 360px; } }
    @media (pointer: fine) { .hist-chart .tschart-body { cursor: grab; } }
    .hist-hint { font-size: 13px; text-align: center; margin: 8px 0 0; }
    .hist-tip { display: none; position: absolute; top: 12px; pointer-events: none; background: var(--cp-surface, #1e293b); border: 1px solid var(--cp-border); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.6; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
    .hist-tip i { width: 10px; height: 3px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: middle; }
    .hist-tip strong { margin-left: 6px; }
    .hist-tip-fault { color: var(--cp-danger); }
    .hist-tip-time { color: var(--cp-text-muted); font-size: 12px; }
    .hist-tip-run { color: var(--cp-text-muted); font-size: 12px; }
    .hist-runs-title { margin: 18px 0 8px; font-size: 16px; }
    .hist-axis { fill: var(--cp-text-muted); font-size: 12px; font-family: inherit; }
    .hist-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }
    .hist-nav-group { display: flex; gap: 8px; }
    .hist-tip i.band, .hist-legend i.dot { width: 10px; height: 10px; border-radius: 2px; }
    .hist-legend i.dot { border-radius: 50%; }
    .hist-energy { font-size: 13px; text-align: center; margin: 10px 0 0; }
    .en-chart { height: 370px; margin-top: 6px; -webkit-touch-callout: none;
      --ts-text: var(--cp-text); --ts-dim: var(--cp-text-muted); --ts-grid: var(--cp-border);
      --ts-panel: var(--cp-surface); --ts-card: var(--cp-panel-strong); --ts-accent: var(--cp-accent); }
    @media (max-width: 600px) { .en-chart { height: 312px; } }
    @media (pointer: fine) { .en-chart .tschart-body { cursor: grab; } .en-chart.panning .tschart-body { cursor: grabbing; } }
    .en-ranges { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid var(--cp-border); border-radius: 10px; background: var(--cp-bg-elevated); }
    .en-ranges button { border: 0; background: transparent; color: var(--cp-text-muted); padding: 5px 12px; border-radius: 7px; font-weight: 600; cursor: pointer; }
    .en-ranges button:hover { color: var(--cp-text); }
    .en-ranges button.active { background: var(--cp-accent-soft); color: var(--cp-accent); }
    .en-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
    .en-stat { padding: 10px 12px; border: 1px solid var(--cp-border); border-radius: 10px; background: var(--cp-surface-soft); min-width: 0; }
    .en-stat span { display: block; color: var(--cp-text-muted); font-size: 13px; }
    .en-stat strong { display: block; font-size: 20px; margin-top: 2px; white-space: nowrap; }
    .en-stat small { display: block; color: var(--cp-text-muted); font-size: 12px; }
    .en-legend { margin-bottom: 4px; }
    .en-detail { margin-top: 16px; }
    .en-detail .card-head { flex-wrap: wrap; gap: 10px; }
    .en-detail h2 { display: flex; align-items: center; gap: 10px; margin: 0; white-space: nowrap; }
    .en-detail h3 { margin: 18px 0 8px; font-size: 16px; }
    .en-swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 8px; flex: none; }
    .en-table-wrap { overflow-x: auto; }
    .en-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .en-table th { text-align: left; color: var(--cp-text-muted); font-weight: 600; font-size: 13px; padding: 6px 8px; border-bottom: 1px solid var(--cp-border); white-space: nowrap; }
    .en-table td { padding: 8px; border-bottom: 1px solid var(--cp-border); white-space: nowrap; }
    .en-table th:not(:first-child), .en-table td:not(:first-child) { text-align: right; }
    .en-facts { margin: 12px 0 4px; }
    .en-note { font-size: 13px; }
    .en-runs { display: grid; gap: 6px; }
    .en-run { display: grid; grid-template-columns: auto auto 1fr auto auto auto; align-items: center; gap: 10px; padding: 6px 10px; border: 1px solid var(--cp-border); border-radius: 10px; background: var(--cp-surface-soft); }
    .en-run .en-swatch { margin: 0; }
    .en-run-time { font-weight: 600; white-space: nowrap; }
    .en-run-meta { color: var(--cp-text-muted); font-size: 13px; }
    .en-run-perf { color: var(--cp-text-muted); font-size: 13px; white-space: nowrap; }
    .en-run-perf:empty { display: none; }
    .en-run strong { white-space: nowrap; }
    .en-run-view { min-height: 32px; padding: 4px 10px; font-size: 13px; }
    .en-runs-loading { display: grid; place-items: center; min-height: 80px; }
    .field { display: grid; gap: 6px; margin-bottom: 14px; }
.field[hidden] { display: none; }
    .field label { color: var(--cp-text-muted); font-size: 13px; font-weight: 600; }
    .field label:has(input[type="checkbox"]) { display: flex; align-items: center; gap: 10px; min-height: 44px; }
    .field label input[type="checkbox"] { width: auto; min-height: 0; margin: 0; }
    .demo-banner { background: var(--cp-warning); color: #000; border-radius: 10px; padding: 10px 16px; font-size: 16px; font-weight: 700; margin-bottom: 18px; }
    .confirm-scrim { position: fixed; inset: 0; z-index: 1000; background: var(--cp-overlay); display: flex; align-items: center; justify-content: center; padding: 20px; }
    .confirm-dialog { background: var(--cp-surface); border: 1px solid var(--cp-border-strong); border-radius: 16px; padding: 24px; width: 100%; max-width: 380px; box-shadow: 0 12px 40px rgba(0, 0, 0, .45); }
    .confirm-dialog h3 { margin: 0 0 8px; font-size: 20px; }
    .confirm-dialog p { margin: 0 0 20px; color: var(--cp-text-muted); font-size: 16px; line-height: 1.4; }
    .confirm-dialog .btn-row { justify-content: flex-end; }
    .confirm-dialog.restarting { text-align: center; }
    .confirm-dialog.restarting .spinner { margin: 0 auto 14px; width: 32px; height: 32px; border-width: 3px; }
    .confirm-dialog.restarting p { margin: 0; }
    .confirm-dialog .ask-phrase { display: block; margin: 0 0 20px; color: var(--cp-text-muted); font-size: 15px; }
    .confirm-dialog .ask-phrase strong { color: var(--cp-text); }
    .confirm-dialog .ask-phrase input { display: block; width: 100%; margin-top: 8px; }
    /* Inline help disclosure. Toggled by click rather than hover so the same
       control works with a mouse, a keyboard and a touchscreen -- hover has no
       equivalent on a phone. The panel sits in normal flow instead of floating,
       which keeps it from being clipped or pushed off-screen on narrow
       viewports. */
    .field-label { display: flex; align-items: center; gap: 6px; }
    .info-btn {
      flex: none; width: 18px; height: 18px; padding: 0; line-height: 1;
      border-radius: 50%; border: 1px solid var(--cp-border-strong);
      background: transparent; color: var(--cp-text-muted);
      font-size: 12px; font-weight: 700; font-family: inherit;
      cursor: pointer; display: inline-flex; align-items: center;
      justify-content: center;
    }
    .info-btn:hover { color: var(--cp-text); border-color: var(--cp-accent); }
    .info-btn:focus-visible { outline: none; border-color: var(--cp-accent); box-shadow: 0 0 0 3px var(--cp-accent-soft); }
    .info-btn[aria-expanded="true"] { background: var(--cp-accent); border-color: var(--cp-accent); color: var(--cp-accent-fg); }
    /* Touch targets must stay finger-sized even though the glyph is small. */
    @media (pointer: coarse) {
      .info-btn { width: 28px; height: 28px; font-size: 14px; }
    }
    .info-panel {
      margin: 0 0 8px; padding: 10px 12px; border-radius: 10px;
      background: var(--cp-surface-soft);
      border: 1px solid var(--cp-border-strong);
      color: var(--cp-text-soft); font-size: 13px; line-height: 1.5;
    }
    .info-panel[hidden] { display: none; }
    .info-panel ol { margin: 0; padding-left: 18px; }
    .info-panel li + li { margin-top: 4px; }
    input, select, textarea {
      width: 100%; min-height: 44px; border: 1px solid var(--cp-border-strong);
      background: var(--cp-surface); color: var(--cp-text);
      border-radius: 10px; padding: 10px 12px; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--cp-accent); box-shadow: 0 0 0 3px var(--cp-accent-soft); }
    textarea { min-height: 120px; resize: vertical; }
    .setpoint { display: grid; gap: 14px; }
    .range-editor { display: grid; gap: 8px; min-width: 0; }
    .range-readout { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .range-readout output { color: var(--cp-accent); font-size: 24px; font-weight: 750; }
    .range-limits { display: flex; justify-content: space-between; color: var(--cp-text-muted); font-size: 12px; }
    input.control-range {
      appearance: none; height: 44px; padding: 0; border: 0; background: transparent;
      box-shadow: none;
    }
    input.control-range:focus { box-shadow: none; }
    input.control-range::-webkit-slider-runnable-track {
      height: 8px; border-radius: 10px; background: var(--cp-border);
    }
    input.control-range::-webkit-slider-thumb {
      appearance: none; width: 26px; height: 26px; margin-top: -9px;
      border: 3px solid var(--cp-surface); border-radius: 50%; background: var(--cp-accent);
      box-shadow: 0 0 0 1px var(--cp-border-strong);
    }
    input.control-range::-moz-range-track {
      height: 8px; border-radius: 10px; background: var(--cp-border);
    }
    input.control-range::-moz-range-thumb {
      width: 20px; height: 20px; border: 3px solid var(--cp-surface);
      border-radius: 50%; background: var(--cp-accent);
      box-shadow: 0 0 0 1px var(--cp-border-strong);
    }
    .choice-editor { display: grid; gap: 8px; min-width: 0; }
    .choice-description {
      min-height: 38px; padding: 8px 10px; border-radius: 10px;
      background: var(--cp-surface-soft); color: var(--cp-text-muted);
      font-size: 13px; line-height: 1.4; overflow-wrap: anywhere;
    }
    .mode-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .mode-btn {
      min-height: 66px; padding: 8px; border: 1px solid var(--cp-border);
      border-radius: 10px; background: var(--cp-surface-soft); color: var(--cp-text-muted);
    }
    .mode-btn.active { border-color: var(--cp-accent); color: var(--cp-accent); background: var(--cp-accent-soft); }
    .power-btn {
      width: 100%; min-height: 72px; border-radius: 16px; border: 1px solid var(--cp-border-strong);
      background: var(--cp-surface-soft); color: var(--cp-text); font-size: 18px; font-weight: 700;
      position: relative; overflow: hidden;
    }
    .power-btn.on { color: var(--cp-danger); }
    .power-progress { position: absolute; inset: auto 0 0; height: 5px; background: var(--cp-accent); transform-origin: left; }
    @keyframes hold { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .ap-group { margin-top: 8px; border: 1px solid var(--cp-border); border-radius: 10px; overflow: hidden; }
    .ap-group > summary {
      padding: 13px 14px; cursor: pointer; font-weight: 700;
      background: var(--cp-surface-soft);
    }
    .ap-group > summary:hover { background: var(--cp-accent-soft); }
    .ap-group[open] > summary {
      color: var(--cp-accent); background: var(--cp-accent-soft);
      border-bottom: 1px solid var(--cp-border);
    }
    .ap-group > .ap-row { padding-inline: 14px; }
    .ap-row { padding: 14px 0; border-top: 1px solid var(--cp-border); display: grid; grid-template-columns: 1fr minmax(260px, 360px); gap: 16px; }
    .ap-row p { color: var(--cp-text-muted); margin: 5px 0 0; font-size: 13px; }
    .ap-value { display: grid; gap: 10px; align-content: center; }
    .ap-default { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--cp-text-muted); }
    .ap-default .btn { min-height: 30px; padding: 4px 10px; font-size: 12px; }
    .event-toolbar { display: grid; grid-template-columns: 1fr 170px 170px; gap: 10px; margin-bottom: 16px; }
    .search-field { position: relative; }
    .search-field input { padding-right: 44px; }
    .search-field input::-webkit-search-cancel-button { appearance: none; }
    .search-clear {
      position: absolute; top: 50%; right: 5px; transform: translateY(-50%);
      width: 34px; height: 34px; padding: 0; border: 0; border-radius: 10px;
      background: transparent; color: var(--cp-text-muted); font-size: 22px; line-height: 1;
    }
    .search-clear:hover { background: var(--cp-surface-soft); color: var(--cp-text); }
    .search-clear[hidden] { display: none; }
    .event-list { display: grid; gap: 8px; }
    .event-day {
      margin: 14px 0 2px; color: var(--cp-text-muted); font-size: 14px; font-weight: 650;
    }
    .event-day:first-child { margin-top: 0; }
    .event {
      --event-tone: var(--cp-text-muted);
      display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 14px; align-items: start;
      padding: 14px 16px; border: 1px solid var(--cp-border); border-left: 4px solid var(--event-tone);
      border-radius: 10px; background: var(--cp-surface);
    }
    .event.tone-good { --event-tone: var(--cp-success); }
    .event.tone-bad { --event-tone: var(--cp-danger); }
    .event.tone-warn { --event-tone: var(--cp-warning); }
    .event.tone-info { --event-tone: var(--cp-accent); }
    .event.tone-defrost { --event-tone: var(--home-defrost-text); }
    .event-icon { color: var(--event-tone); font-size: 18px; line-height: 1.2; text-align: center; }
    .event-time { color: var(--cp-text-muted); font-size: 13px; white-space: nowrap; line-height: 1.6; }
    .event-title { font-weight: 650; color: var(--event-tone); }
    .event-detail { color: var(--cp-text-muted); font-size: 13px; margin-top: 3px; }
    .event-help { margin-top: 8px; }
    /* Settings: a grouped list of sections. Wide screens show it beside the open
       section; phones show the list, and tapping a row drills into that section. */
    .settings-layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 24px; align-items: start; }
    .settings-side { position: sticky; top: 88px; }
    .sl-gh {
      margin: 18px 6px 6px; color: var(--cp-text-muted); font-size: 12px; font-weight: 650;
      letter-spacing: .06em; text-transform: uppercase;
    }
    .sl-gh:first-child { margin-top: 0; }
    .sl-grp { background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 14px; overflow: hidden; }
    .settings-nav .sl-row {
      display: flex; align-items: center; gap: 12px; width: 100%; margin: 0; padding: 10px 12px;
      border: 0; border-top: 1px solid var(--cp-border); border-radius: 0; background: transparent;
      color: var(--cp-text); font: inherit; text-align: left; cursor: pointer;
    }
    .settings-nav .sl-row:first-child { border-top: 0; }
    .settings-nav .sl-row:hover { background: var(--cp-surface-soft); color: var(--cp-text); }
    .settings-nav .sl-row.active { background: var(--cp-accent-soft); }
    .settings-nav .sl-row.active .sl-t { color: var(--cp-accent); }
    .sl-ic { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: #fff; flex: none; }
    .sl-ic svg { width: 17px; height: 17px; }
    .sl-t { flex: 1 0 auto; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sl-v { flex: 0 1 auto; min-width: 0; color: var(--cp-text-muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sl-v.hl { color: var(--cp-accent); font-weight: 650; }
    .sl-ch { color: var(--cp-text-muted); font-size: 20px; line-height: 1; }
    .sl-back {
      display: none; align-items: center; gap: 6px; margin: 0 0 14px; padding: 4px 0; border: 0; background: none;
      color: var(--cp-accent); font: inherit; font-size: 17px; font-weight: 600; cursor: pointer;
    }
    .sl-back span:first-child { font-size: 24px; line-height: 1; }
    .settings-empty { color: var(--cp-text-muted); text-align: center; padding: 48px 16px; }
    .fold { margin-top: 20px; border-top: 1px solid var(--cp-border); }
    .fold > summary {
      display: flex; justify-content: space-between; align-items: center; padding: 14px 0 8px;
      list-style: none; cursor: pointer; user-select: none; color: var(--cp-text-muted); font-weight: 650;
    }
    .fold > summary::-webkit-details-marker { display: none; }
    .fold > summary::after { content: "\203A"; font-size: 22px; line-height: 1; transition: transform .15s; }
    .fold[open] > summary::after { transform: rotate(90deg); }
    .fold.danger > summary { color: var(--cp-danger); }
    .kv { display: grid; grid-template-columns: minmax(130px, 1fr) auto; gap: 10px; padding: 10px 0; border-top: 1px solid var(--cp-border); }
    .kv:first-child { border-top: 0; }
    .kv span:first-child { color: var(--cp-text-muted); }
    .notice { border-left: 4px solid var(--cp-warning); padding: 12px 14px; background: var(--cp-surface-soft); border-radius: 0 10px 10px 0; }
    .notice.bad { border-left-color: var(--cp-danger); }
    .logs {
      height: 430px; overflow: auto; padding: 12px; border: 1px solid var(--cp-border);
      border-radius: 10px; background: var(--cp-bg-elevated);
      font-family: Consolas, "Courier New", Courier, monospace; font-size: 12px;
    }
    .log { padding: 3px 0; overflow-wrap: anywhere; }
    .log.E { color: var(--cp-danger); }
    .log.W { color: var(--cp-warning); }
    .error-item { padding: 14px 0; border-top: 1px solid var(--cp-border); }
    .error-item:first-child { border-top: 0; }
    .error-code { color: var(--cp-danger); font-weight: 750; }
    .hist-seg-dot { display: inline-block; width: 7px; height: 7px; margin-left: 6px; border-radius: 50%; background: var(--cp-danger); vertical-align: middle; }
    .fault-active { padding: 12px 14px; border-left: 4px solid var(--cp-danger); border-radius: 10px; background: color-mix(in srgb, var(--cp-danger) 8%, transparent); }
    .fault-active + .fault-active { margin-top: 10px; }
    .fault-active p { margin: 6px 0 0; }
    .fault-ok { display: flex; gap: 10px; align-items: center; color: var(--cp-text-muted); }
    .fault-ok::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--cp-success); }
    .fault-links { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
    .fault-links a { color: var(--cp-link); font-size: 14px; font-weight: 600; text-decoration: none; }
    .fault-links a:hover { text-decoration: underline; }
    .fault-head, .fault-row {
      display: grid; grid-template-columns: 56px minmax(0, 1fr) 110px 130px auto; gap: 4px 12px; align-items: baseline;
      grid-template-areas: "code name start dur view" ". help . . .";
    }
    .fault-head { padding: 0 0 6px; border-bottom: 1px solid var(--cp-border); color: var(--cp-text-muted); font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; }
    .fault-head span:nth-child(1) { grid-area: name; }
    .fault-head span:nth-child(2) { grid-area: start; }
    .fault-head span:nth-child(3) { grid-area: dur; }
    .fault-row { padding: 10px 0; border-top: 1px solid var(--cp-border); }
    .fault-day + .fault-row { border-top: 0; }
    .fault-row .error-code { grid-area: code; }
    .fault-row .f-name { grid-area: name; }
    .fault-row .f-start { grid-area: start; color: var(--cp-text-muted); white-space: nowrap; }
    .fault-row .f-dur { grid-area: dur; white-space: nowrap; }
    .fault-row .f-help { grid-area: help; }
    .fault-row .f-view { grid-area: view; justify-self: end; white-space: nowrap; }
    .fault-row .f-lasted { display: none; }
    .fault-day { margin: 14px 0 2px; color: var(--cp-text-muted); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    @media (max-width: 720px) {
      .fault-head { display: none; }
      .fault-row { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "code name name" "start start start" "help help view"; gap: 2px 8px; }
      .fault-row .f-name { font-weight: 650; }
      .fault-row .f-dur { display: none; }
      .fault-row .f-lasted { display: inline; }
      .fault-row .f-start { font-size: 14px; }
      .fault-row .f-help, .fault-row .f-view { margin-top: 4px; }
    }
    .empty { color: var(--cp-text-muted); text-align: center; padding: 36px 16px; }
    .toast-stack { position: fixed; top: 76px; right: 16px; z-index: 80; display: grid; gap: 8px; max-width: 360px; }
    .toast { padding: 12px 14px; border: 1px solid var(--cp-border); border-radius: 10px; background: var(--cp-panel-strong); box-shadow: var(--cp-shadow); }
    .toast.good { border-color: var(--cp-success); }
    .toast.bad { border-color: var(--cp-danger); }
    .login {
      min-height: 100vh; display: grid; place-items: center; padding: 20px;
      background: var(--cp-bg);
    }
    .login-card { width: min(420px, 100%); }
    .login-card h1 { margin-top: 0; }
    .login-card.shake { animation: login-shake .45s ease-in-out; }
    .login-card input[aria-invalid="true"] { border-color: var(--cp-danger); }
    .login-card .btn.attention { border-color: var(--cp-accent); color: var(--cp-accent); font-weight: 650; }
    @keyframes login-shake {
      0%, 100% { transform: translateX(0); }
      15%, 55% { transform: translateX(-10px); }
      35%, 75% { transform: translateX(10px); }
      90% { transform: translateX(-4px); }
    }
    @keyframes login-flash { 0% { background: var(--cp-danger); } 100% { background: var(--cp-surface-soft); } }
    @media (prefers-reduced-motion: reduce) {
      .login-card.shake { animation: none; }
      .login-card.shake .notice.bad { animation: login-flash .6s ease-out; }
    }
    .mobile-nav { display: none; }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--cp-border); border-top-color: var(--cp-accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dot.warn { background: var(--cp-warning); }
    .perf-src { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px; font-weight: 600; }
    .perf-warn { color: var(--cp-warning); }
    .perf-glycol.is-disabled { opacity: .45; }
    .perf-adv { margin: 0 0 14px; }
    .perf-adv > .grid { padding: 14px 14px 0; gap: 0 14px; }
    .perf-test { margin-top: 12px; }
    .perf-test > strong { display: block; margin-bottom: 8px; }
    .perf-choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .perf-pick-select { width: 100%; margin-top: 8px; }
    .perf-summary { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 10px 0; border-top: 1px solid var(--cp-border); }
    .perf-summary:first-child { border-top: 0; }
    .perf-summary .label { color: var(--cp-text-muted); flex: 0 0 auto; }
    .perf-summary strong { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
    .perf-summary .btn { flex: 0 0 auto; padding: 8px 12px; min-width: 76px; }
    .perf-list-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .perf-list-head .icon-btn { width: 36px; min-width: 36px; height: 36px; border-radius: 10px; color: var(--cp-link); cursor: pointer; }
    .perf-list-head .icon-svg { width: 18px; height: 18px; }
    .perf-not-listed { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--cp-border); color: var(--cp-text-muted); }
    .link-btn { border: 0; background: none; padding: 0; color: var(--cp-link); font: inherit; font-weight: 600; cursor: pointer; }
    .link-btn:hover { text-decoration: underline; }
    .perf-back { margin-top: 10px; }
    .perf-test.ok { border-left: 4px solid var(--cp-success); padding: 12px 14px; background: var(--cp-surface-soft); border-radius: 0 10px 10px 0; }
    .spinner-inline { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--cp-border); border-top-color: var(--cp-accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; }
    .btn-spinner { display: inline-block; width: 16px; height: 16px; margin-right: 8px; vertical-align: -3px; border: 2px solid var(--cp-border); border-top-color: var(--cp-accent); border-radius: 50%; animation: spin .8s linear infinite; }
    .btn.checking:disabled { opacity: 1; cursor: progress; }
    /* Home: mirrors the device home screen. */
    :root {
      --home-heat-text: #c2410c; --home-cool-text: #1d4ed8; --home-defrost-text: #0e7490;
      --home-freeze-text: #0369a1;
      --home-defrost: #4fb3c9; --home-heater: #ea580c;
    }
    html[data-theme="dark"] {
      --home-heat-text: #fbbf24; --home-cool-text: #7cb8ff; --home-defrost-text: #a5f3fc;
      --home-freeze-text: #bae6fd;
      --home-heater: #fb923c;
    }
    .home-grid { display: grid; gap: 16px; grid-template-columns: minmax(300px, 4fr) minmax(0, 8fr);

  <script>
    const $ = (selector, root = document) => root.querySelector(selector);
    const esc = value => String(value ?? "")
      .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    const controllerName = () => String(state.preferences.device_name || "").trim();
    const controllerTitle = () => controllerName() ? `${controllerName()} · Arctic Controller` : "Arctic Controller";
    const updateDocumentTitle = () => { document.title = controllerTitle(); };
    const titleCase = value => String(value || "").replaceAll("_", " ").replace(/\b\w/g, c => c.toUpperCase());
    const fmtBytes = value => {
      const n = Number(value || 0);
      if (n < 1024) return `${n} B`;
      if (n < 1048576) return `${(n / 1024).toFixed(1)} KB`;
      return `${(n / 1048576).toFixed(1)} MB`;
    };
    const fmtUptime = ms => {
      let seconds = Math.floor((ms || 0) / 1000);
      const days = Math.floor(seconds / 86400); seconds %= 86400;
      const hours = Math.floor(seconds / 3600); seconds %= 3600;
      const minutes = Math.floor(seconds / 60);
      return `${days ? `${days}d ` : ""}${hours}h ${minutes}m`;
    };
    const timezones = [
      ["US Eastern", "EST5EDT,M3.2.0,M11.1.0"], ["US Central", "CST6CDT,M3.2.0,M11.1.0"],
      ["US Mountain", "MST7MDT,M3.2.0,M11.1.0"], ["US Pacific", "PST8PDT,M3.2.0,M11.1.0"],
      ["Canada Atlantic", "AST4ADT,M3.2.0,M11.1.0"], ["UK / London", "GMT0BST,M3.5.0/1,M10.5.0"],

    // [key, label, icon colour, icon]

        ["time", "Time & Location", "#22c55e", slIcon('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>')],
        ["display", "Display", "#8b5cf6", slIcon('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/>')]]],
      ["Security", [
        ["security", "Security", "#64748b", slIcon('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>')]]],
      ["System", [
        ["firmware", "Firmware", "#ef4444", slIcon('<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>')],
        ["diagnostics", "Diagnostics", "#0ea5e9", slIcon('<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>')],
        ["system", "System", "#6b7280", slIcon('<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>')]]]
    ];
    const settingsKeys = settingsGroups.flatMap(([, rows]) => rows.map(([key]) => key));
    // Wide screens show the list beside a section, so there is always one open.
    const settingsWide = () => matchMedia("(min-width: 901px)").matches;
    // Selectable modes only; freeze_protection, mode_3 and mode_4 are displayed but never offered.
    const modes = ["cooling", "heating", "hot_water", "hot_water_cooling"];
    const modeLabels = {
      cooling: "Cooling", heating: "Heating", freeze_protection: "Freeze protection", mode_3: "Mode 3", mode_4: "Mode 4",

    };
    const modeLabel = mode => modeLabels[mode] || titleCase(mode || "unknown");
    // GitHub tags carry a "v"; the firmware reports bare versions. Show them one way.
    const plainVersion = v => String(v || "").trim().replace(/^v(?=\d)/i, "");

    const state = {
      auth: { checked: false, required: true, loggedIn: false, changeRequired: false, loginError: "", loginFailures: 0, loginUsername: "", loginCooldownUntil: 0, loginShake: false, recovering: false, recoveryError: "" },
      route: "home", settingsPage: "", folds: {}, historyLast: "history", busy: false,
      info: {}, status: { time: {} }, wifi: {}, hp: {
        temperatures: {}, setpoints: {}, setpoint_limits: {}, readings: {}
      },
      preferences: { temp_unit: "celsius", language_code: "en", brightness: 80, device_name: "" },
      errors: { active: [], history: [] }, params: {}, events: [], eventTotal: 0,
      tempHistory: { loading: false, error: "", data: null, end: null },
      histShowPower: localStorage.getItem("arcticHistPower") !== "0",
      histWindow: [28800, 14400, 7200, 3600].includes(Number(localStorage.getItem("arcticHistWindow")))
        ? Number(localStorage.getItem("arcticHistWindow")) : 28800,
      energy: { range: 30, to: null, today: null, since: null, data: null, loading: false, error: "", selected: null, runs: {},
        cache: new Map(), known: new Set() },
      homeHistory: { loading: false, error: "", data: null, loadedAt: 0 }, homeTrack: {},
      currentBootId: 0, eventOffset: 0, eventFilters: { search: "", category: "all", time: "all" },
      ota: {}, release: null, timeConfig: {}, security: {}, tls: {}, networks: [],
      weather: {}, location: {},
      locationSearch: { query: "", busy: false, error: "", results: null },
      notifications: [], notifOpen: false,
      ha: {}, haTimer: null,
      perf: null, perfTimer: null, perfTests: {}, perfBrowses: {}, perfDiscovers: {}, perfModes: {}, perfDrafts: {},
      settingsLoaded: false, settingsPromise: null,
      logs: [], logSeq: 0, logLevel: "V", logTimer: null, pollTimer: null, polling: false,
      powerHoldTimer: null, powerHolding: false
    };

    const queue = [];
    let activeRequests = 0;
    // Every request gets a deadline. Over a routed or bridged link a controller that
    // has gone away (restarting, say) often doesn't refuse the connection; the request
    // just hangs, and three hung requests would stall this queue for good.
    const API_TIMEOUT_MS = 30000;
    function api(url, options = {}) {
      const { timeout = API_TIMEOUT_MS, ...fetchOptions } = options;
      return new Promise((resolve, reject) => {
        queue.push(async () => {
          activeRequests++;
          const ctl = new AbortController();
          const timer = setTimeout(() => ctl.abort(), timeout);
          const send = () => fetch(url, { ...fetchOptions, signal: ctl.signal });
          let response;
          try {
            try { response = await send(); }
            catch (error) {
              const method = String(fetchOptions.method || "GET").toUpperCase();
              if (method !== "GET" || ctl.signal.aborted) throw error;
              response = await send();
            }
            if (response.status === 401) {
              // Re-render only on the transition: background pollers keep
              // hitting 401 until the user signs in again, and re-rendering
              // the login page each time would wipe what they are typing.
              const wasLoggedIn = state.auth.loggedIn;
              state.auth.loggedIn = false;
              if (wasLoggedIn) render();
              const err = new Error("Authentication required");
              err.status = 401;
              throw err;
            }
            const type = response.headers.get("content-type") || "";
            const data = type.includes("json") ? await response.json() : await response.text();
            if (!response.ok) {
              const err = new Error(data.error || data.message || `HTTP ${response.status}`);
              err.status = response.status;
              const retryAfter = parseInt(response.headers.get("retry-after") || "", 10);
              if (retryAfter > 0) err.retryAfter = retryAfter;
              if (data && data.field) err.field = data.field;
              throw err;
            }
            resolve(data);
          } catch (error) {
            if (ctl.signal.aborted) {
              const err = new Error("The controller didn't respond");
              err.timeout = err.unreachable = true;
              reject(err);
            } else {
              if (!response && error) error.unreachable = true;
              reject(error);
            }
          }
          finally { clearTimeout(timer); activeRequests--; runQueue(); }
        });
        runQueue();
      });
    }
    function runQueue() {
      while (queue.length && activeRequests < 3) queue.shift()();
    }
    function toast(message, kind = "") {
      const el = document.createElement("div");
      el.className = `toast ${kind}`;
      el.textContent = message;
      $("#toasts").appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }
    function temp(value, kind = "absolute") {
      if (value === null || value === undefined) return "--";
      const fahrenheit = state.preferences.temp_unit === "fahrenheit";
      // Rounded as the device does (format_temp): in tenths, Fahrenheit
      // truncated, then halves away from zero, so -3.5 reads -4 on both.
      let deci = Math.round(Number(value) * 10);

            <div class="hist-nav-group">
              <button class="btn" data-action="history-prev" ${atOldest ? "disabled" : ""}>‹ ${page}</button>
              <button class="btn" data-action="history-back-hour" ${atOldest ? "disabled" : ""}>‹ ${step}</button>
            </div>
            <div class="hist-nav-group">
              <button class="btn" data-action="history-forward-hour" ${atLatest ? "disabled" : ""}>${step} ›</button>
              <button class="btn" data-action="history-next" ${atLatest ? "disabled" : ""}>${page} ›</button>
            </div>
          </div>
          <p class="hist-muted hist-hint">Double-click the chart to centre it on that moment, or drag it sideways.</p>
          ${histRunsCard(data)}`;
    }
    function historyPage() {
      const th = state.tempHistory, data = th.data;
      let body;
      if (th.loading && !data) {
        body = `<section class="card"><div class="login" style="min-height:320px"><div class="spinner"></div></div></section>`;
      } else if (th.error && !data) {
        body = `<section class="card"><p class="hist-muted">${esc(th.error)}</p></section>`;
      } else if (!data || histNoHistory(data)) {
        const interval = data ? data.sample_interval_sec : 30;
        body = `<section class="card"><p class="hist-muted">No cycle history recorded yet. Samples are captured every ${interval}s while the heat pump is connected.</p></section>`;
      } else {
        // An empty window inside a longer history still gets the chart and
        // its navigation, or there'd be no way out of it.
        body = `<section class="card">
          <div class="hist-toolbar" id="hist-top">${histTop(data)}</div>
          <div class="hist-chart-host"></div>
          <div id="hist-below">${histBelow(data)}</div>
        </section>`;
      }
      return `<div class="page">
        <div class="page-head"><div><h1>History</h1><p>Compressor run cycles with inlet, outlet, and setpoint temperatures, 1 to 8 hours at a time.</p></div></div>
        ${historySegs("history")}
        ${body}
      </div>`;
    }

    // ---- Energy: electricity used each day by mode, with an estimated COP ----
    const ENERGY_RANGES = [[14, "14 d"], [30, "30 d"], [90, "90 d"], [365, "1 y"]];
    const ENERGY_MODES = [["heating", "Heating", "var(--hist-heat)"], ["cooling", "Cooling", "var(--hist-cool)"],
      ["hot_water", "Hot water", "var(--hist-dhw)"]];
    const ENERGY_RUN_MODE = { 1: "heating", 2: "cooling", 3: "hot_water" };
    // With less metered running than this a day's COP is mostly start-up noise.
    const ENERGY_COP_MIN_WH = 200;
    const MONTH_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    // Energy days are the controller's local calendar dates ("YYYY-MM-DD");
    // the arithmetic runs in UTC so DST never shifts a day.
    const dayAdd = (date, n) => new Date(Date.parse(`${date}T00:00:00Z`) + n * 86400000).toISOString().slice(0, 10);
    const dayDiff = (a, b) => Math.round((Date.parse(`${b}T00:00:00Z`) - Date.parse(`${a}T00:00:00Z`)) / 86400000);
    function localToday() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }
    function fmtDay(date, long = false) {
      const d = new Date(`${date}T00:00:00Z`);
      const md = `${MONTH_SHORT[d.getUTCMonth()]} ${d.getUTCDate()}`;
      return long ? `${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][d.getUTCDay()]}, ${md}` : md;
    }
    function fmtKwh(wh) {
      if (wh == null) return "--";

    function energyMidnight(day) {

    }
    function energyCop(heatWh, coveredWh) { return coveredWh >= ENERGY_COP_MIN_WH ? heatWh / coveredWh : null; }
    function energySums(days) {
      let total = 0, heat = 0, covered = 0;
      for (const d of days) {
        const e = d.electrical_wh || {}, th = d.thermal_wh || {}, cov = d.covered_electrical_wh || {};
        total += e.total || 0;
        for (const [m] of ENERGY_MODES) { heat += th[m] || 0; covered += cov[m] || 0; }
      }
      return { total, heat, covered, cop: energyCop(heat, covered) };

    async function loadEnergy() {
      const en = state.energy;

        // The live view asks from a date and lets the controller fill in its
        // own today, so a browser in another time zone can't skip a day.
        const q = en.to ? `from=${dayAdd(en.to, 1 - en.range)}&to=${en.to}` : `from=${dayAdd(localToday(), 1 - en.range)}`;
        const [data, totals] = await Promise.all([api(`/api/energy/daily?${q}`),
          en.since ? null : api("/api/energy/totals").catch(() => null)]);
        if (totals) en.since = totals.since;
        en.data = data; en.loadedAt = Date.now();
        if (!en.to) en.today = data.to;

        energyLoadNeighbours(data).catch(() => {});
      } catch (error) {
        en.error = error.message || "Failed to load energy";
      } finally {

      }

    // Days either side of the window are kept so a drag slides real bars in.
    // Today's open day isn't marked known: it keeps growing.
    function energyRemember(resp) {
      const en = state.energy, open = new Set();
      for (const d of resp.days || []) {
        en.cache.set(d.date, d);
        if (d.final === false) open.add(d.date);
      }
      for (let date = resp.from; date <= resp.to; date = dayAdd(date, 1)) if (!open.has(date)) en.known.add(date);
    }
    const energyPad = () => Math.min(state.energy.range, 182);
    async function energyLoadNeighbours(data) {
      const en = state.energy, p = energyPad(), wanted = [];
      const missing = (from, to) => {
        for (let date = from; date <= to; date = dayAdd(date, 1)) if (!en.known.has(date)) return true;
        return false;
      };
      if (!en.since || data.from > en.since) {
        let from = dayAdd(data.from, -p);
        if (en.since && from < en.since) from = en.since;
        wanted.push([from, dayAdd(data.from, -1)]);
      }
      if (en.to) {
        let to = dayAdd(data.to, p);
        if (en.today && to > en.today) to = en.today;
        wanted.push([dayAdd(data.to, 1), to]);
      }
      const resps = await Promise.all(wanted.filter(([from, to]) => from <= to && missing(from, to))
        .map(([from, to]) => api(`/api/energy/daily?from=${from}&to=${to}`)));
      resps.forEach(energyRemember);
      if (resps.length && en.data === data && state.route === "energy") energySync();
    }
    async function refreshEnergyLive() {
      const en = state.energy;
      if (en.to || en.loading || Date.now() - (en.loadedAt || 0) < 120000) return;
      await loadEnergy();
      if (state.route === "energy" && !state.energy.to) render();
    }
    async function energyGoto(to) {
      const en = state.energy;
      en.to = en.today && to >= en.today ? null : to;
      await loadEnergy(); render();
    }
    // Group 30 s samples into compressor runs. A run that mostly falls inside
    // a defrost span is a defrost: the unit splits the heating run around it
    // and the samples carry no mode while it lasts.
    // `from` is where the samples begin (window or day start): a run that
    // starts there may have begun earlier (clipStart), and one still going at
    // the last sample is `open`.
    function buildRuns(samples, defrosts, interval, from) {
      const runs = [], gap = interval * 2.5;
      let cur = null;
      const close = (open = false) => {
        if (!cur) return;
        const start = cur.start, end = cur.last + interval;
        const inDefrost = (defrosts || []).reduce((sum, d) =>
          sum + Math.max(0, Math.min(end, d.end ?? end) - Math.max(start, d.start)), 0);
        const code = Object.entries(cur.modes).sort((a, b) => b[1] - a[1])[0]?.[0];
        runs.push({ start, end, wh: cur.metered ? cur.wh : null, clipStart: start - from < gap, open,
          mode: inDefrost * 2 > end - start ? "defrost" : ENERGY_RUN_MODE[code] });
        cur = null;
      };
      for (const s of samples) {
        if (!s.run) { close(); continue; }
        if (cur && s.t - cur.last > gap) close();
        if (!cur) cur = { start: s.t, last: s.t, wh: 0, metered: false, modes: {} };
        cur.last = s.t;

    }
    // "…2 AM – 2:25 AM" for a run cut off by the window/day start; an open
    // run reads "– now" when live, otherwise "…" after its last sample.
    function fmtRunSpan(run, live) {
      const end = run.open && live ? "now" : `${fmtHistClock(run.end)}${run.open ? "…" : ""}`;
      return `${run.clipStart ? "…" : ""}${fmtHistClock(run.start)} – ${end}`;
    }
    function fmtRunLength(run, live) {
      return `${fmtDuration(run.end - run.start)}${run.clipStart || (run.open && !live) ? "+" : ""}`;
    }
    const RUN_DEFROST = ["defrost", "Defrost", "var(--home-defrost)"];
    // Per-run summaries (COP, outdoor) from /api/energy/runs, each attached to
    // the run it overlaps most (padded by a sample interval), as the device
    // does. Runs from before summaries were kept get none.
    const RUN_COP_MIN_WH = 100;
    async function fetchRunSummaries(from, to) {
      const out = [];
      // The endpoint serves at most 3 days per request.
      for (let a = from; a < to; a += 3 * 86400) {
        const r = await api(`/api/energy/runs?from=${Math.floor(a)}&to=${Math.ceil(Math.min(to, a + 3 * 86400))}`);
        for (const x of r.runs || []) if (!out.some(y => y.start === x.start)) out.push(x);
      }
      return out;
    }
    function attachRunSummaries(runs, summaries, pad = 30) {
      const totals = runs.map(() => null);

        let best = -1, bestOverlap = 0;
        runs.forEach((run, i) => {
          const o = Math.min(x.end, run.end + pad) - Math.max(x.start, run.start - pad);
          if (o > bestOverlap) { bestOverlap = o; best = i; }
        });
        if (best < 0) continue;
        const t = totals[best] ||= { thermal: 0, covered: 0, outSum: 0, outS: 0 };
        t.thermal += x.thermal_wh; t.covered += x.covered_electrical_wh;
        if (x.outdoor_c != null && x.outdoor_seconds) { t.outSum += x.outdoor_c * x.outdoor_seconds; t.outS += x.outdoor_seconds; }
      }
      runs.forEach((run, i) => {
        const t = totals[i];
        run.cop = t && t.covered >= RUN_COP_MIN_WH ? t.thermal / t.covered : null;
        run.outdoor = t && t.outS ? t.outSum / t.outS : null;

    }
    function fmtRunPerf(run) {
      if (run.mode === "defrost") return "";
      return `COP (est.) ${run.cop != null ? (Math.round(run.cop * 10) / 10).toFixed(1) : "--"} · Outdoor ${temp(run.outdoor)}`;
    }
    // The "Compressor runs" rows shared by the Energy day and the Cycles page.
    function runRows(runs, live, viewT) {
      return `<div class="en-runs">${runs.map(run => {
        const mode = run.mode === "defrost" ? RUN_DEFROST : ENERGY_MODES.find(([m]) => m === run.mode);
        return `<div class="en-run"><i class="en-swatch" style="background:${mode ? mode[2] : "var(--energy-other)"}"></i>
          <span class="en-run-time">${esc(fmtRunSpan(run, live))}</span>
          <span class="en-run-meta">${fmtRunLength(run, live)}${mode ? ` · ${mode[1]}` : ""}</span>
          <span class="en-run-perf">${esc(fmtRunPerf(run))}</span>
          <strong>${run.wh == null ? "--" : fmtKwh(run.wh)}</strong>
          <button class="btn en-run-view" ${viewT(run)}>View ›</button></div>`;
      }).join("")}</div>`;
    }
    // Compressor runs for one day, rebuilt from the 30 s cycle history (kept
    // about 14 days): three 8 h pages cover the day.
    async function loadEnergyRuns(date) {
      const en = state.energy, day = en.data?.days?.find(d => d.date === date);
      if (!day || en.runs[date]?.loading) return;
      const entry = en.runs[date] = { loading: true, error: "", runs: [], samples: 0, loadedAt: Date.now() };
      try {
        const midnight = energyMidnight(day), next = midnight + 86400;
        const pages = await Promise.all([8, 16, 24].map(h => api(`/api/heatpump/temperature-history?end=${midnight + h * 3600}`)));
        const byTime = new Map(), defrosts = new Map();
        let interval = 30;
        for (const page of pages) {
          interval = page.sample_interval_sec || interval;
          for (const s of page.samples || []) if (s.t >= midnight && s.t < next) byTime.set(s.t, s);
          for (const d of page.defrosts || []) defrosts.set(d.start, d);
        }
        const samples = [...byTime.values()].sort((a, b) => a.t - b.t);
        entry.samples = samples.length;
        entry.runs = buildRuns(samples, [...defrosts.values()], interval, midnight);
        const summaries = await fetchRunSummaries(midnight, next).catch(() => []);
        attachRunSummaries(entry.runs, summaries, interval);
      } catch (error) {
        entry.error = error.message || "Failed to load runs";
      } finally {
        entry.loading = false;
      }
    }
    // The energy chart is a tschart bucket chart (TsBars). Like the cycle
    // chart it outlives render(); it is rebuilt when the range changes.
    let energyBars = null;
    function energyCreate(range) {
      const el = document.createElement("div");
      el.className = "en-chart";
      const year = range > 90;
      const chart = new TsBars(el, {
        id: "energy_chart", count: range, barWidth: range > 60 ? 0.78 : 0.62,
        // The year view labels month starts; shorter ranges space out days.
        labels: year
          ? { mode: "sparse", text: b => b.key.endsWith("-01") ? MONTH_SHORT[+b.key.slice(5, 7) - 1] : null }
          : { mode: "every", text: b => fmtDay(b.key) },
      });
      // kWh in Wh, so the axis maths stays integral.
      const kwh = chart.addPane({ id: "kwh", weight: 230, unit: "kWh",
        range: { auto: true, includeZero: true, minSpan: 500, minStep: 500 },
        fmt: v => `${+(v / 1000).toFixed(1)}` });
      // The unit meters power in 100 W steps, so idle draw reads as 0 and
      // there is no standby segment.
      for (const [m, label, color] of ENERGY_MODES) {
        chart.addSeries(kwh, { id: m, name: label, color, stack: "modes",
          value: b => (b.data?.day.electrical_wh?.[m] || 0) > 0 ? b.data.day.electrical_wh[m] : null });
      }
      // Estimated COP in tenths, on its own strip; only the ends are labelled.
      const cop = chart.addPane({ id: "cop", weight: 64, minHeight: 56, unit: "COP", unitAt: "middle",
        range: { auto: true, minSpan: 10, minStep: 10 }, maxTicks: 2, tickLabels: "ends",
        fmt: v => `${Math.round(v / 10)}`, emptyText: "No COP estimate in this range" });
      chart.addSeries(cop, { id: "cop", name: "COP (est.)", color: "var(--hist-set)", geom: "line",
        width: 1.5, opacity: 0.55, pointRadius: n => n > 90 ? 2 : 3,
        value: b => b.data?.sums.cop != null ? Math.round(b.data.sums.cop * 10) : null });
      chart.setCard(energyCard);
      el.addEventListener("tsbars:select", event => energySelectDay(event.detail.key));
      // A drag lands on whole days; load the window it settled on.
      el.addEventListener("tsbars:view", event => {
        if (event.detail.lastKey) energyGoto(event.detail.lastKey).catch(toastUnlessShown);
      });
      energyBars = { el, chart, range, sig: null };
    }
    function energyCard(b, card) {
      const day = b.data?.day;
      if (!day) return;
      const s = b.data.sums, e = day.electrical_wh || {};
      card.add("title", `${fmtDay(day.date, true)}${day.final === false ? " · so far" : ""}`);
      card.add("value", "Total", fmtKwh(s.total));
      ENERGY_MODES.filter(([m]) => e[m] > 0).forEach(([m, label, color]) => card.add("value", label, fmtKwh(e[m]), color));
      if (s.cop !== null) card.add("value", "COP (est.)", s.cop.toFixed(1));
      if (day.outdoor_c) {
        if (day.outdoor_c.run_avg != null) card.add("value", "Outdoor while running", temp(day.outdoor_c.run_avg));
        card.add("value", "Outdoor day avg", temp(day.outdoor_c.avg));
      }
    }
    // Attach the chart to the freshly rendered page and hand it any new days.
    function energyMount() {
      const host = $(".en-chart-host");
      if (!host || !state.energy.data) return;
      if (!energyBars || energyBars.range !== state.energy.range) {
        energyBars?.chart.destroy();
        energyCreate(state.energy.range);
      }
      const moved = energyBars.el.parentNode !== host;
      if (moved) host.appendChild(energyBars.el);
      // Draw now rather than next frame, so the page never shows it empty.

    }
    // The window plus up to a window's worth of neighbours either side (never
    // past today), so a drag slides real bars in.

      const en = state.energy, d = en.data, eb = energyBars;
      if (!eb || !d) return false;
      eb.chart.setSelected(en.selected);
      // Only re-feed new data: a render while a dragged-to window loads
      // mustn't snap the chart back.
      const sig = `${d.from}|${d.to}|${en.cache.size}|${en.loadedAt}`;
      if (eb.sig === sig) return false;
      eb.sig = sig;
      const byDate = new Map((d.days || []).map(x => [x.date, x]));
      const p = energyPad(), buckets = [];
      for (let date = dayAdd(d.from, -p); date <= dayAdd(d.to, p); date = dayAdd(date, 1)) {
        if (en.today && date > en.today) break;
        const inWindow = date >= d.from && date <= d.to;
        const day = byDate.get(date) || (!inWindow && en.cache.get(date)) || null;
        buckets.push({ key: date, data: day ? { day, sums: energySums([day]) } : null,

      }

      eb.chart.setPanLimits(en.since ? Math.max(0, dayDiff(en.since, d.from)) : 0,

    async function energySelectDay(date) {

      // Today's runs keep growing; older days are fixed once loaded.

      if (!cached || cached.error || (today && Date.now() - cached.loadedAt > 60000)) {

    }
    function energyStat(label, value, sub = "") {

    }
    function energyDetail(day) {
      const en = state.energy, s = energySums([day]);
      const e = day.electrical_wh || {}, th = day.thermal_wh || {}, cov = day.covered_electrical_wh || {}, run = day.run_seconds || {};
      const midnight = energyMidnight(day);
      const viewEnd = t => Math.round(t / HIST_SNAP) * HIST_SNAP;
      const out = day.outdoor_c;
      const rows = ENERGY_MODES.filter(([m]) => (e[m] || 0) > 0 || (run[m] || 0) > 0).map(([m, label, color]) => {
        const cop = energyCop(th[m] || 0, cov[m] || 0);
        return `<tr><td><i class="en-swatch" style="background:${color}"></i>${label}</td><td>${fmtKwh(e[m] || 0)}</td>

      notes.push("COP covers metered running with a valid heat estimate and leaves out defrost.");

      if (!r || r.loading) runs = `<div class="en-runs-loading"><div class="spinner"></div></div>`;
      else if (r.error) runs = `<p class="hist-muted en-runs-msg">${esc(r.error)}</p>`;
      else if (!r.samples) runs = `<p class="hist-muted en-runs-msg">Run detail is kept for about 14 days, so it isn't available for this day.</p>`;
      else if (!r.runs.length) runs = `<p class="hist-muted en-runs-msg">No compressor runs${day.final === false ? " yet today" : " this day"}.</p>`;
      else runs = runRows(r.runs, day.final === false,

      return `<section class="card en-detail" data-energy-day="${day.date}">
        <div class="card-head"><h2>${esc(fmtDay(day.date, true))}${day.final === false ? ` <span class="badge">so far</span>` : ""}</h2>
          <div class="btn-row"><button class="btn" data-action="energy-view" data-t="${midnight + 8 * 3600}">View from midnight ›</button>
          <button class="icon-btn" data-action="energy-close" aria-label="Close day" title="Close">×</button></div></div>
        <div class="en-stats">
          ${energyStat("Electricity", fmtKwh(s.total))}
          ${energyStat("Heat (est.)", s.heat ? fmtKwh(s.heat) : "--")}
          ${energyStat("COP (est.)", s.cop !== null ? s.cop.toFixed(1) : "--")}
          ${out && out.run_avg != null
            ? energyStat("Outdoor while running", temp(out.run_avg), `Day avg ${temp(out.avg)} · ${temp(out.min)} – ${temp(out.max)}`)
            : energyStat("Outdoor", out ? temp(out.avg) : "--", out ? `${temp(out.min)} – ${temp(out.max)}` : "")}
        </div>
        <div class="en-table-wrap"><table class="en-table"><thead><tr><th>Mode</th><th>Electricity</th><th>Heat (est.)</th><th>COP</th><th>Run time</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="5" class="hist-muted">No energy recorded.</td></tr>`}</tbody></table></div>

      }
      if (perfField === "bacnet_identity" && event.target.form?.querySelector('[name="source"]')?.value === "bacnet_ip") {
        event.target.form.querySelector('[name="device_instance"]').value = "";
        event.target.form.querySelector('[name="device_name"]').value = "";
        event.target.form.querySelector('[name="object_name"]').value = "";
        event.target.form.querySelector('[name="rom_id"]').value = "";
        perfCaptureDraft(event.target.form);
      } else if (event.target.closest('form[data-form="perf-sensor"]')) {
        perfCaptureDraft(event.target.form);
      }
      if (perfField === "value_type") {
        const select = event.target.form.querySelector('select[name="no_reading"]');
        const float = perfIsFloat(event.target.value);
        select.disabled = float;
        if (float) select.value = "none";
        else if (select.value === "none") select.value = "0x8000";
      }
      if (event.target.closest?.('form[data-form^="perf-"]')) perfSyncSaves();
    });
    // <details> folds survive re-renders. "toggle" doesn't bubble, so capture it.
    document.addEventListener("toggle", event => {
      const fold = event.target;
      if (fold.matches?.("details[data-fold]")) state.folds[fold.dataset.fold] = fold.open;
    }, true);
    async function navigateFromLocation() {
      routeFromHash();
      await navigate(state.route, state.settingsPage);
    }
    window.addEventListener("hashchange", navigateFromLocation);
    window.addEventListener("popstate", navigateFromLocation);

    async function init() {
      routeFromHash();
      state.otaInstall = restoreInstall();
      try {
        const auth = await fetch("/api/auth/status").then(r => r.json());
        state.auth = {
          ...state.auth,
          checked: true,
          required: true,
          loggedIn: !!auth.session_valid,
          changeRequired: !!auth.credentials_change_required
        };
        if (state.auth.loggedIn && !state.auth.changeRequired) {
          render();
          // navigate() loads its own data, so if the user moves on while
          // loadCore() is in flight, don't load the new route a second time.
          const startRoute = state.route;
          await loadCore();
          homeTrackTransitions();
          // Reloaded mid-install: pick the watch back up.
          if (state.otaInstall?.active && state.otaInstall.phase !== "verify") scheduleInstallTick(500);
          if (state.route === startRoute) {
            if (state.route === "home") await loadHomeHistory();
            if (state.route === "control") await loadParams();
            if (state.route === "history") await loadHistory();
            if (state.route === "energy") await loadEnergy();
            if (state.route === "events") await loadEvents(true);
            if (state.route === "settings") await ensureSettings();
          }
        }
      } catch (error) {
        state.auth.checked = true;
        toast(`Controller unavailable: ${error.message}`, "bad");
      }
      if (state.route === "events" && document.activeElement?.id === "event-search") refreshEventResults();
      else render();
      if (state.route === "settings" && state.settingsPage === "diagnostics") startLogPolling();
      if (state.route === "settings" && state.settingsPage === "home_assistant") {
        await loadHaStatus().catch(() => {});
        render();
        startHaPolling();
      }
      if (state.route === "settings" && state.settingsPage === "performance") {
        await loadPerf().catch(error => toast(error.message, "bad"));
        render();
        startPerfPolling();
      }
      state.pollTimer = setInterval(async () => {
        if (!state.auth.loggedIn || state.auth.changeRequired) return;
        // The install watch has the controller's attention while an update runs.
        if (state.otaInstall?.active && state.otaInstall.phase !== "verify") return;
        if (state.route === "history") refreshHistoryLive().catch(() => {});
        if (state.route === "energy") refreshEnergyLive().catch(() => {});
        // On a slow link a poll can outlast the interval; skip rather than
        // stack another batch in the request queue.
        if (state.polling) return;
        state.polling = true;
        try {
          const [status, hp, wifi, ota, errors, notif, weather] = await Promise.all([
            api("/api/status"), api("/api/heatpump/status"), api("/api/wifi"), api("/api/ota/status"), api("/api/heatpump/errors"), api("/api/notifications"),
            api("/api/weather")
          ]);
          Object.assign(state, { status, hp, wifi, ota, errors, weather });
          const wasUnreachable = state.unreachable;
          state.unreachable = false;
          if (wasUnreachable) render();
          const wasVerifying = state.otaInstall?.phase === "verify";
          resolveInstallOutcome();
          if (wasVerifying) render();
          const hpEdge = homeTrackTransitions();
          if (state.route === "home" && (hpEdge || homeHistoryStale())) await loadHomeHistory();
          const prevNotifCount = (state.notifications || []).length;
          state.notifications = notif.notifications || [];
          if (state.route === "events") {
            await loadEvents(true);
            if (state.route === "events") refreshEventsLive();
          } else if (["home", "status", "faults"].includes(state.route)) render();
          else if (state.route === "control") await refreshControlLive();
          else if (state.notifications.length !== prevNotifCount) render();
          else if (state.route === "settings" && state.settingsPage === "firmware"
                   && ota && ota.state && ota.state !== "idle") render();
        } catch (error) {
          if (error?.unreachable && !state.unreachable) { state.unreachable = true; render(); }
        }
        finally { state.polling = false; }
      }, 5000);
    }
    init();
  </script>
</body>
</html>
