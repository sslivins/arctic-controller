<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arctic Controller</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
      const mq = window.matchMedia("(prefers-color-scheme: dark)");
      const apply = () =>
        document.documentElement.setAttribute("data-theme", param || (mq.matches ? "dark" : "light"));
      apply();
      if (!param && mq.addEventListener) mq.addEventListener("change", apply);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    :root {
      --cp-bg: #f4f6fa;
      --cp-bg-elevated: #fbfcfe;
      --cp-surface-soft: #eef2f7;
      --cp-border: #d6dde6;
      --cp-border-strong: #8a97a6;
      --cp-accent: #005a9e;
      --cp-accent-hover: #044a86;
      --cp-accent-soft: rgba(0, 90, 158, 0.08);
      --cp-highlight: rgba(0, 90, 158, 0.12);
      --cp-panel: rgba(251, 252, 254, 0.86);
      --cp-panel-strong: rgba(251, 252, 254, 0.96);
      /* Cycle-history chart series. */
      --hist-out: #334155;
      --hist-in: #c026d3;
      --hist-set: #16a34a;
      --hist-heat: #ef4444;
      --hist-cool: #3b82f6;
      --hist-dhw: #f59e0b;
    }
    html[data-theme="dark"] {
      --cp-bg: #1a1a2e;
      --cp-bg-elevated: #0f1a2e;
      --cp-surface: #1e2a4a;
      --cp-surface-soft: #1a2a4e;
      --cp-border: #0f3460;
      --cp-border-strong: #28496f;
      --cp-text: #eaeaea;
      --cp-text-muted: #9fb3c8;
      --cp-text-soft: #b9c6d6;
      --cp-accent: #00d4ff;
      --cp-accent-hover: #5ce0ff;
      --cp-accent-soft: rgba(0, 212, 255, 0.14);
      --cp-accent-fg: #062033;
      --cp-success: #4ade80;
      --cp-danger: #ef4444;
      --cp-warning: #fbbf24;
      --cp-link: #00d4ff;
      --cp-overlay: rgba(15, 26, 46, 0.88);
      --cp-panel: rgba(15, 26, 46, 0.72);
      --cp-panel-strong: rgba(15, 26, 46, 0.96);
      --cp-highlight: rgba(0, 212, 255, 0.12);
      --hist-out: #f1f5f9;
      --hist-in: #d946ef;
      --hist-set: #4ade80;
      --hist-heat: #ef4444;
      --hist-cool: #3b82f6;
      --hist-dhw: #fbbf24;
    }
    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.45;
    }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    a { color: var(--cp-link); }
    .hidden { display: none !important; }
    .app { min-height: 100vh; }
    .topbar {
      position: sticky; top: 0; z-index: 30;
      height: 64px; display: flex; align-items: center; gap: 16px;
      padding: 0 20px; background: var(--cp-panel-strong);
      border-bottom: 1px solid var(--cp-border);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 210px; font-weight: 700; }
    .brand-mark {
      width: 34px; height: 34px; display: grid; place-items: center;
      border-radius: 10px; background: var(--cp-accent); color: var(--cp-accent-fg);
      font-size: 19px; flex: none;
    }
    .top-status { flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 12px; min-width: 0; }
    .status-item { display: flex; align-items: center; gap: 7px; color: var(--cp-text-muted); font-size: 13px; white-space: nowrap; }
    .hp-status { min-width: 0; }
    .status-label { overflow: hidden; text-overflow: ellipsis; }
    .wx-icon { width: 18px; height: 20px; flex: none; }
    .status-item.wx { gap: 5px; }
    .loc-current { display: flex; flex-direction: column; gap: 2px; margin-bottom: 14px; }
    .loc-coords { color: var(--cp-text-muted); font-size: 13px; }
    .loc-results { list-style: none; margin: 10px 0 0; padding: 0; border: 1px solid var(--cp-border); border-radius: 10px; overflow: hidden; }
    .loc-results li + li { border-top: 1px solid var(--cp-border); }
    .loc-result { display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
      padding: 11px 12px; font: inherit; color: inherit; min-height: 44px; }
    .loc-result:hover, .loc-result:focus-visible { background: var(--cp-surface-soft); }
    .loc-result small { display: block; color: var(--cp-text-muted); font-size: 12px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cp-border-strong); flex: none; }
    .dot.good { background: var(--cp-success); }
    .dot.bad { background: var(--cp-danger); }
    .icon-btn {
      width: 42px; min-width: 42px; height: 42px; border: 1px solid var(--cp-border);
      border-radius: 12px; background: var(--cp-surface); color: var(--cp-text);
      display: grid; place-items: center; text-decoration: none; padding: 0; flex: none;
    }
    .icon-svg { width: 22px; height: 22px; display: block; fill: currentColor; }
    .signout-btn { color: var(--cp-text); }
    .notif-wrap { position: relative; }
    .notif-btn { position: relative; cursor: pointer; font-size: 17px; }
    .notif-badge {
      position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px;
      padding: 0 5px; border-radius: 9px; background: var(--cp-danger); color: #fff;
      font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
    }
    .notif-panel {
      position: absolute; top: 46px; right: 0; width: 320px; max-width: 82vw; z-index: 50;
      background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0,0,0,.35); overflow: hidden;
    }
    .notif-panel h3 { margin: 0; padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--cp-border); color: var(--cp-text-muted); }
    .notif-item {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      padding: 12px 14px; border: 0; border-bottom: 1px solid var(--cp-border);
      background: transparent; color: var(--cp-text); font-size: 14px; cursor: pointer;
    }
    .notif-item:last-child { border-bottom: 0; }
    .notif-item:hover { background: var(--cp-surface-soft); }
    .notif-item .ni-icon { font-size: 18px; flex: 0 0 auto; }
    .notif-empty { padding: 18px 14px; color: var(--cp-text-muted); font-size: 13px; text-align: center; }
    .ota-indeterminate { margin: 12px 0 6px; height: 6px; border-radius: 3px; background: var(--cp-border); overflow: hidden; }
    .ota-indeterminate-bar { width: 40%; height: 100%; border-radius: 3px; background: var(--cp-accent, #2f81f7); animation: ota-slide 1.3s ease-in-out infinite; }
    @keyframes ota-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
    .layout { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: calc(100vh - 64px); }
    .rail {
      position: sticky; top: 64px; align-self: start; height: calc(100vh - 64px);
      padding: 20px 12px; border-right: 1px solid var(--cp-border);
      background: var(--cp-bg-elevated);
    }
    .nav-link {
      width: 100%; border: 0; background: transparent; color: var(--cp-text-muted);
      border-radius: 10px; padding: 11px 12px; margin: 2px 0;
      display: flex; align-items: center; gap: 11px; text-align: left; font-weight: 600;
    }
    .nav-link:hover { background: var(--cp-surface-soft); color: var(--cp-text); }
    .nav-link.active { background: var(--cp-accent-soft); color: var(--cp-accent); }
    .nav-icon { width: 22px; text-align: center; font-size: 17px; }
    .main { min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 48px; }
    .page { max-width: 1220px; margin: 0 auto; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .page-head > div:first-child, .history-title { min-width: 0; }
    .page-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex: none; }
    .page-actions .btn { white-space: nowrap; }
    .history-head { align-items: flex-start; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; }
    .history-head h1 { margin: 0; }
    .history-back { font-size: 28px; font-weight: 700; line-height: 1; }
    .page-head h1 { margin: 0; font-size: clamp(26px, 4vw, 36px); letter-spacing: -0.03em; }
    .page-head p { margin: 5px 0 0; color: var(--cp-text-muted); }
    .grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .card {
      background: var(--cp-surface); border: 1px solid var(--cp-border);
      border-radius: 16px; padding: 20px;
      box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
    }
    .card h2, .card h3 { margin: 0 0 12px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .hero { padding: 28px; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; }
    .eyebrow { text-transform: uppercase; font-size: 12px; letter-spacing: .1em; color: var(--cp-text-muted); font-weight: 700; }
    .hero-title { margin: 6px 0; font-size: clamp(32px, 6vw, 54px); line-height: 1; letter-spacing: -.04em; }
    .hero-sub { color: var(--cp-text-muted); }
    .temp-hero { text-align: right; }
    .temp-value { font-size: clamp(44px, 8vw, 72px); line-height: 1; font-weight: 650; letter-spacing: -.06em; }
    .temp-label { color: var(--cp-text-muted); margin-top: 6px; }
    .metric { min-height: 112px; }
    .metric-label { color: var(--cp-text-muted); font-size: 13px; }
    .metric-value { font-size: 28px; font-weight: 650; margin-top: 8px; }
    .metric-sub { color: var(--cp-text-soft); font-size: 13px; margin-top: 4px; }
    .component-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .component {
      padding: 13px; border: 1px solid var(--cp-border); border-radius: 10px;
      background: var(--cp-surface-soft);
    }
    .component strong { display: block; margin-top: 4px; }
    .state-on { color: var(--cp-success); }
    .state-off { color: var(--cp-text-muted); }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px;
      border-radius: 999px; font-size: 12px; font-weight: 700;
      background: var(--cp-surface-soft); color: var(--cp-text-muted);
    }
    .badge.good { color: var(--cp-success); background: var(--cp-surface-soft); }
    .badge.warn { color: var(--cp-warning); }
    .badge.bad { color: var(--cp-danger); }
    .btn {
      min-height: 42px; border-radius: 10px; padding: 8px 14px;
      border: 1px solid var(--cp-border-strong); background: var(--cp-surface);
      color: var(--cp-text); font-weight: 650; white-space: nowrap;
    }
    .btn:hover { background: var(--cp-surface-soft); }
    .btn.primary { background: var(--cp-accent); border-color: var(--cp-accent); color: var(--cp-accent-fg); }
    .btn.primary:hover { background: var(--cp-accent-hover); }
    .btn.danger { color: var(--cp-danger); border-color: var(--cp-danger); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .hist-muted { color: var(--cp-text-muted); margin: 8px 0; }
    .hist-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .hist-range { font-weight: 600; }
    .hist-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--cp-text-muted); }
    .hist-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .hist-legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
    .hist-legend i.band { width: 12px; height: 12px; border-radius: 3px; }
    .hist-chart-wrap { width: 100%; position: relative; }
    .hist-chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
    .hist-tip { display: none; position: absolute; top: 12px; pointer-events: none; background: var(--cp-surface, #1e293b); border: 1px solid var(--cp-border); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.6; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
    .hist-tip i { width: 10px; height: 3px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: middle; }
    .hist-tip strong { margin-left: 6px; }
    .hist-tip-time { color: var(--cp-text-muted); font-size: 12px; }
    .hist-axis { fill: var(--cp-text-muted); font-size: 12px; font-family: inherit; }
    .hist-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .field { display: grid; gap: 6px; margin-bottom: 14px; }
.field[hidden] { display: none; }
    .field label { color: var(--cp-text-muted); font-size: 13px; font-weight: 600; }
    .field label:has(input[type="checkbox"]) { display: flex; align-items: center; gap: 10px; min-height: 44px; }
    .field label input[type="checkbox"] { width: auto; min-height: 0; margin: 0; }
    .demo-banner { background: var(--cp-warning); color: #000; border-radius: 10px; padding: 10px 16px; font-size: 16px; font-weight: 700; margin-bottom: 18px; }
    .confirm-scrim { position: fixed; inset: 0; z-index: 1000; background: var(--cp-overlay); display: flex; align-items: center; justify-content: center; padding: 20px; }
    .confirm-dialog { background: var(--cp-surface); border: 1px solid var(--cp-border-strong); border-radius: 16px; padding: 24px; width: 100%; max-width: 380px; box-shadow: 0 12px 40px rgba(0, 0, 0, .45); }
    .confirm-dialog h3 { margin: 0 0 8px; font-size: 20px; }
    .confirm-dialog p { margin: 0 0 20px; color: var(--cp-text-muted); font-size: 16px; line-height: 1.4; }
    .confirm-dialog .btn-row { justify-content: flex-end; }
    .confirm-dialog.restarting { text-align: center; }
    .confirm-dialog.restarting .spinner { margin: 0 auto 14px; width: 32px; height: 32px; border-width: 3px; }
    .confirm-dialog.restarting p { margin: 0; }
    /* Inline help disclosure. Toggled by click rather than hover so the same
       control works with a mouse, a keyboard and a touchscreen -- hover has no
       equivalent on a phone. The panel sits in normal flow instead of floating,
       which keeps it from being clipped or pushed off-screen on narrow
       viewports. */
    .field-label { display: flex; align-items: center; gap: 6px; }
    .info-btn {
      flex: none; width: 18px; height: 18px; padding: 0; line-height: 1;
      border-radius: 50%; border: 1px solid var(--cp-border-strong);
      background: transparent; color: var(--cp-text-muted);
      font-size: 12px; font-weight: 700; font-family: inherit;
      cursor: pointer; display: inline-flex; align-items: center;
      justify-content: center;
    }
    .info-btn:hover { color: var(--cp-text); border-color: var(--cp-accent); }
    .info-btn:focus-visible { outline: none; border-color: var(--cp-accent); box-shadow: 0 0 0 3px var(--cp-accent-soft); }
    .info-btn[aria-expanded="true"] { background: var(--cp-accent); border-color: var(--cp-accent); color: var(--cp-accent-fg); }
    /* Touch targets must stay finger-sized even though the glyph is small. */
    @media (pointer: coarse) {
      .info-btn { width: 28px; height: 28px; font-size: 14px; }
    }
    .info-panel {
      margin: 0 0 8px; padding: 10px 12px; border-radius: 10px;
      background: var(--cp-surface-soft);
      border: 1px solid var(--cp-border-strong);
      color: var(--cp-text-soft); font-size: 13px; line-height: 1.5;
    }
    .info-panel[hidden] { display: none; }
    .info-panel ol { margin: 0; padding-left: 18px; }
    .info-panel li + li { margin-top: 4px; }
    input, select, textarea {
      width: 100%; min-height: 44px; border: 1px solid var(--cp-border-strong);
      background: var(--cp-surface); color: var(--cp-text);
      border-radius: 10px; padding: 10px 12px; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--cp-accent); box-shadow: 0 0 0 3px var(--cp-accent-soft); }
    textarea { min-height: 120px; resize: vertical; }
    .setpoint { display: grid; gap: 14px; }
    .range-editor { display: grid; gap: 8px; min-width: 0; }
    .range-readout { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .range-readout output { color: var(--cp-accent); font-size: 24px; font-weight: 750; }
    .range-limits { display: flex; justify-content: space-between; color: var(--cp-text-muted); font-size: 12px; }
    input.control-range {
      appearance: none; height: 44px; padding: 0; border: 0; background: transparent;
      box-shadow: none;
    }
    input.control-range:focus { box-shadow: none; }
    input.control-range::-webkit-slider-runnable-track {
      height: 8px; border-radius: 10px; background: var(--cp-border);
    }
    input.control-range::-webkit-slider-thumb {
      appearance: none; width: 26px; height: 26px; margin-top: -9px;
      border: 3px solid var(--cp-surface); border-radius: 50%; background: var(--cp-accent);
      box-shadow: 0 0 0 1px var(--cp-border-strong);
    }
    input.control-range::-moz-range-track {
      height: 8px; border-radius: 10px; background: var(--cp-border);
    }
    input.control-range::-moz-range-thumb {
      width: 20px; height: 20px; border: 3px solid var(--cp-surface);
      border-radius: 50%; background: var(--cp-accent);
      box-shadow: 0 0 0 1px var(--cp-border-strong);
    }
    .choice-editor { display: grid; gap: 8px; min-width: 0; }
    .choice-description {
      min-height: 38px; padding: 8px 10px; border-radius: 10px;
      background: var(--cp-surface-soft); color: var(--cp-text-muted);
      font-size: 13px; line-height: 1.4; overflow-wrap: anywhere;
    }
    .mode-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .mode-btn {
      min-height: 66px; padding: 8px; border: 1px solid var(--cp-border);
      border-radius: 10px; background: var(--cp-surface-soft); color: var(--cp-text-muted);
    }
    .mode-btn.active { border-color: var(--cp-accent); color: var(--cp-accent); background: var(--cp-accent-soft); }
    .power-btn {
      width: 100%; min-height: 72px; border-radius: 16px; border: 1px solid var(--cp-border-strong);
      background: var(--cp-surface-soft); color: var(--cp-text); font-size: 18px; font-weight: 700;
      position: relative; overflow: hidden;
    }
    .power-btn.on { color: var(--cp-danger); }
    .power-progress { position: absolute; inset: auto 0 0; height: 5px; background: var(--cp-accent); transform-origin: left; }
    @keyframes hold { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .ap-group { margin-top: 8px; border: 1px solid var(--cp-border); border-radius: 10px; overflow: hidden; }
    .ap-group > summary {
      padding: 13px 14px; cursor: pointer; font-weight: 700;
      background: var(--cp-surface-soft);
    }
    .ap-group > summary:hover { background: var(--cp-accent-soft); }
    .ap-group[open] > summary {
      color: var(--cp-accent); background: var(--cp-accent-soft);
      border-bottom: 1px solid var(--cp-border);
    }
    .ap-group > .ap-row { padding-inline: 14px; }
    .ap-row { padding: 14px 0; border-top: 1px solid var(--cp-border); display: grid; grid-template-columns: 1fr minmax(260px, 360px); gap: 16px; }
    .ap-row p { color: var(--cp-text-muted); margin: 5px 0 0; font-size: 13px; }
    .ap-value { display: grid; gap: 10px; align-content: center; }
    .event-toolbar { display: grid; grid-template-columns: 1fr 170px 170px; gap: 10px; margin-bottom: 16px; }
    .search-field { position: relative; }
    .search-field input { padding-right: 44px; }
    .search-field input::-webkit-search-cancel-button { appearance: none; }
    .search-clear {
      position: absolute; top: 50%; right: 5px; transform: translateY(-50%);
      width: 34px; height: 34px; padding: 0; border: 0; border-radius: 10px;
      background: transparent; color: var(--cp-text-muted); font-size: 22px; line-height: 1;
    }
    .search-clear:hover { background: var(--cp-surface-soft); color: var(--cp-text); }
    .search-clear[hidden] { display: none; }
    .event-list { display: grid; gap: 8px; }
    .event-day {
      margin: 14px 0 2px; color: var(--cp-text-muted); font-size: 14px; font-weight: 650;
    }
    .event-day:first-child { margin-top: 0; }
    .event {
      --event-tone: var(--cp-text-muted);
      display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 14px; align-items: start;
      padding: 14px 16px; border: 1px solid var(--cp-border); border-left: 4px solid var(--event-tone);
      border-radius: 10px; background: var(--cp-surface);
    }
    .event.tone-good { --event-tone: var(--cp-success); }
    .event.tone-bad { --event-tone: var(--cp-danger); }
    .event.tone-warn { --event-tone: var(--cp-warning); }
    .event.tone-info { --event-tone: var(--cp-accent); }
    .event-icon { color: var(--event-tone); font-size: 18px; line-height: 1.2; text-align: center; }
    .event-time { color: var(--cp-text-muted); font-size: 13px; white-space: nowrap; line-height: 1.6; }
    .event-title { font-weight: 650; color: var(--event-tone); }
    .event-detail { color: var(--cp-text-muted); font-size: 13px; margin-top: 3px; }
    .event-help { margin-top: 8px; }
    .settings-layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 20px; }
    .settings-nav { align-self: start; position: sticky; top: 88px; }
    .settings-nav .nav-link { font-weight: 600; }
    .kv { display: grid; grid-template-columns: minmax(130px, 1fr) auto; gap: 10px; padding: 10px 0; border-top: 1px solid var(--cp-border); }
    .kv:first-child { border-top: 0; }
    .kv span:first-child { color: var(--cp-text-muted); }
    .notice { border-left: 4px solid var(--cp-warning); padding: 12px 14px; background: var(--cp-surface-soft); border-radius: 0 10px 10px 0; }
    .notice.bad { border-left-color: var(--cp-danger); }
    .logs {
      height: 430px; overflow: auto; padding: 12px; border: 1px solid var(--cp-border);
      border-radius: 10px; background: var(--cp-bg-elevated);
      font-family: Consolas, "Courier New", Courier, monospace; font-size: 12px;
    }
    .log { padding: 3px 0; overflow-wrap: anywhere; }
    .log.E { color: var(--cp-danger); }
    .log.W { color: var(--cp-warning); }
    .error-item { padding: 14px 0; border-top: 1px solid var(--cp-border); }
    .error-item:first-child { border-top: 0; }
    .error-code { color: var(--cp-danger); font-weight: 750; }
    .empty { color: var(--cp-text-muted); text-align: center; padding: 36px 16px; }
    .toast-stack { position: fixed; top: 76px; right: 16px; z-index: 80; display: grid; gap: 8px; max-width: 360px; }
    .toast { padding: 12px 14px; border: 1px solid var(--cp-border); border-radius: 10px; background: var(--cp-panel-strong); box-shadow: var(--cp-shadow); }
    .toast.good { border-color: var(--cp-success); }
    .toast.bad { border-color: var(--cp-danger); }
    .login {
      min-height: 100vh; display: grid; place-items: center; padding: 20px;
      background: var(--cp-bg);
    }
    .login-card { width: min(420px, 100%); }
    .login-card h1 { margin-top: 0; }
    .mobile-nav { display: none; }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--cp-border); border-top-color: var(--cp-accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dot.warn { background: var(--cp-warning); }
    .perf-src { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px; font-weight: 600; }
    .perf-warn { color: var(--cp-warning); }
    .perf-glycol.is-disabled { opacity: .45; }
    .perf-adv { margin: 0 0 14px; }
    .perf-adv > .grid { padding: 14px 14px 0; gap: 0 14px; }
    .perf-test { margin-top: 12px; }
    .perf-test.ok { border-left: 4px solid var(--cp-success); padding: 12px 14px; background: var(--cp-surface-soft); border-radius: 0 10px 10px 0; }
    .spinner-inline { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--cp-border); border-top-color: var(--cp-accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; }
    .btn-spinner { display: inline-block; width: 16px; height: 16px; margin-right: 8px; vertical-align: -3px; border: 2px solid var(--cp-border); border-top-color: var(--cp-accent); border-radius: 50%; animation: spin .8s linear infinite; }
    .btn.checking:disabled { opacity: 1; cursor: progress; }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .rail { display: none; }
      .topbar { background: var(--cp-bg-elevated); gap: 8px; }
      .main { padding-bottom: calc(108px + env(safe-area-inset-bottom)); }
      .mobile-nav {
        position: fixed; display: grid; grid-template-columns: repeat(4, 1fr);
        bottom: 0; left: 0; right: 0; z-index: 40;
        background: var(--cp-bg-elevated); border-top: 1px solid var(--cp-border);
        box-shadow: 0 -10px 28px rgba(0, 0, 0, 0.16);
        padding: 8px 8px max(8px, env(safe-area-inset-bottom));
      }
      .mobile-nav .nav-link { justify-content: center; flex-direction: column; gap: 2px; padding: 8px 6px; font-size: 11px; min-height: 58px; }
      .brand { min-width: 0; flex: none; }
      .brand span:last-child { display: none; }
      .top-status { gap: 8px; }
      .top-status .status-item.wifi, .top-status .status-item.clock { display: none; }
      .hp-status { width: 18px; height: 44px; justify-content: center; flex: none; }
      .hp-status .status-label { display: none; }
      .hp-status .dot { width: 10px; height: 10px; }
      .icon-btn { width: 44px; min-width: 44px; height: 44px; }
      .notif-panel { position: fixed; top: 58px; left: 12px; right: 12px; width: auto; max-width: none; }
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .settings-layout { grid-template-columns: 1fr; }
      .settings-nav { position: static; display: flex; flex-wrap: wrap; overflow-x: visible; gap: 6px; padding: 10px; }
      .settings-nav .nav-link { width: auto; flex: 1 1 calc(50% - 6px); justify-content: center; white-space: normal; min-height: 48px; text-align: center; }
    }
    @media (max-width: 620px) {
      .topbar { padding: 0 10px; }
      .main { padding-inline: 12px; padding-top: 20px; }
      .top-status { gap: 7px; }
      .status-item.wx { gap: 4px; }
      .page-head { gap: 14px; }
      .page-actions { gap: 8px; }
      .card { padding: 18px 16px; }
      .kv { grid-template-columns: 1fr; gap: 3px; }
      .kv strong { overflow-wrap: anywhere; }
      .field label input[type="checkbox"] { width: 40px !important; min-width: 40px; height: 40px; min-height: 40px; }
      .hero { grid-template-columns: 1fr; }
      .temp-hero { text-align: left; }
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .component-list { grid-template-columns: repeat(2, 1fr); }
      .mode-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .event-toolbar { grid-template-columns: 1fr; }
      .event { gap: 10px; padding: 12px; }
      .ap-row { grid-template-columns: 1fr; }
      .page-head { align-items: flex-start; }
      .history-head { grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; }
      .history-title p { font-size: 15px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toasts" class="toast-stack"></div>
  <script>
    const $ = (selector, root = document) => root.querySelector(selector);
    const esc = value => String(value ?? "")
      .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    const controllerName = () => String(state.preferences.device_name || "").trim();
    const controllerTitle = () => controllerName() ? `${controllerName()} · Arctic Controller` : "Arctic Controller";
    const updateDocumentTitle = () => { document.title = controllerTitle(); };
    const titleCase = value => String(value || "").replaceAll("_", " ").replace(/\b\w/g, c => c.toUpperCase());
    const fmtBytes = value => {
      const n = Number(value || 0);
      if (n < 1024) return `${n} B`;
      if (n < 1048576) return `${(n / 1024).toFixed(1)} KB`;
      return `${(n / 1048576).toFixed(1)} MB`;
    };
    const fmtUptime = ms => {
      let seconds = Math.floor((ms || 0) / 1000);
      const days = Math.floor(seconds / 86400); seconds %= 86400;
      const hours = Math.floor(seconds / 3600); seconds %= 3600;
      const minutes = Math.floor(seconds / 60);
      return `${days ? `${days}d ` : ""}${hours}h ${minutes}m`;
    };
    const timezones = [
      ["US Eastern", "EST5EDT,M3.2.0,M11.1.0"], ["US Central", "CST6CDT,M3.2.0,M11.1.0"],
      ["US Mountain", "MST7MDT,M3.2.0,M11.1.0"], ["US Pacific", "PST8PDT,M3.2.0,M11.1.0"],
      ["Canada Atlantic", "AST4ADT,M3.2.0,M11.1.0"], ["UK / London", "GMT0BST,M3.5.0/1,M10.5.0"],
      ["Central Europe", "CET-1CEST,M3.5.0,M10.5.0/3"], ["Japan", "JST-9"],
      ["China", "CST-8"], ["India", "IST-5:30"], ["Australia Eastern", "AEST-10AEDT,M10.1.0,M4.1.0/3"],
      ["UTC", "UTC0"]
    ];
    const nav = [
      ["home", "⌂", "Home"], ["status", "▥", "Status"], ["control", "◉", "Control"],
      ["events", "≡", "Events"]
    ];
    const settingsNav = [
      ["wifi", "WiFi"], ["firmware", "Firmware"], ["time", "Time & Location"], ["display", "Display"],
      ["preferences", "Preferences"], ["security", "Security"], ["home_assistant", "Home Assistant"],
      ["performance", "Heat output & COP"], ["diagnostics", "Diagnostics"], ["system", "System"]
    ];
    // Selectable modes only; mode_2..mode_4 are displayed but never offered.
    const modes = ["cooling", "heating", "hot_water", "hot_water_cooling"];
    const modeLabels = {
      cooling: "Cooling", heating: "Heating", mode_2: "Mode 2", mode_3: "Mode 3", mode_4: "Mode 4",
      hot_water: "Hot water", hot_water_cooling: "Hot water / cooling"
    };
    const modeLabel = mode => modeLabels[mode] || titleCase(mode || "unknown");

    const state = {
      auth: { checked: false, required: true, loggedIn: false, changeRequired: false, loginError: "", recovering: false, recoveryError: "" },
      route: "home", settingsPage: "wifi", busy: false,
      info: {}, status: { time: {} }, wifi: {}, hp: {
        temperatures: {}, setpoints: {}, setpoint_limits: {}, readings: {}
      },
      preferences: { temp_unit: "celsius", language_code: "en", brightness: 80, device_name: "" },
      errors: { active: [], history: [] }, params: {}, events: [], eventTotal: 0,
      tempHistory: { loading: false, error: "", data: null, end: null },
      currentBootId: 0, eventOffset: 0, eventFilters: { search: "", category: "all", time: "all" },
      ota: {}, release: null, timeConfig: {}, security: {}, tls: {}, networks: [],
      weather: {}, location: {},
      locationSearch: { query: "", busy: false, error: "", results: null },
      notifications: [], notifOpen: false,
      ha: {}, haTimer: null,
      perf: null, perfTimer: null, perfTests: {}, perfBrowses: {},
      settingsLoaded: false, settingsPromise: null,
      logs: [], logSeq: 0, logLevel: "V", logTimer: null, pollTimer: null,
      powerHoldTimer: null, powerHolding: false
    };

    const queue = [];
    let activeRequests = 0;
    function api(url, options = {}) {
      return new Promise((resolve, reject) => {
        queue.push(async () => {
          activeRequests++;
          try {
            let response;
            try { response = await fetch(url, options); }
            catch (error) {
              const method = String(options.method || "GET").toUpperCase();
              if (method !== "GET") throw error;
              response = await fetch(url, options);
            }
            if (response.status === 401) {
              // Re-render only on the transition: background pollers keep
              // hitting 401 until the user signs in again, and re-rendering
              // the login page each time would wipe what they are typing.
              const wasLoggedIn = state.auth.loggedIn;
              state.auth.loggedIn = false;
              if (wasLoggedIn) render();
              throw new Error("Authentication required");
            }
            const type = response.headers.get("content-type") || "";
            const data = type.includes("json") ? await response.json() : await response.text();
            if (!response.ok) {
              const err = new Error(data.error || data.message || `HTTP ${response.status}`);
              if (data && data.field) err.field = data.field;
              throw err;
            }
            resolve(data);
          } catch (error) { reject(error); }
          finally { activeRequests--; runQueue(); }
        });
        runQueue();
      });
    }
    function runQueue() {
      while (queue.length && activeRequests < 3) queue.shift()();
    }
    function toast(message, kind = "") {
      const el = document.createElement("div");
      el.className = `toast ${kind}`;
      el.textContent = message;
      $("#toasts").appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }
    function temp(value, kind = "absolute") {
      if (value === null || value === undefined) return "--";
      const fahrenheit = state.preferences.temp_unit === "fahrenheit";
      const converted = fahrenheit
        ? (kind === "differential" ? Number(value) * 9 / 5 : Number(value) * 9 / 5 + 32)
        : Number(value);
      return `${Math.round(converted)}°${fahrenheit ? "F" : "C"}`;
    }
    function tempNumber(value, kind = "absolute") {
      if (state.preferences.temp_unit !== "fahrenheit") return Number(value);
      return Math.round(kind === "differential" ? Number(value) * 9 / 5 : Number(value) * 9 / 5 + 32);
    }
    function toCelsius(value, kind = "absolute") {
      const n = Number(value);
      if (state.preferences.temp_unit !== "fahrenheit") return Math.round(n);
      return Math.round(kind === "differential" ? n * 5 / 9 : (n - 32) * 5 / 9);
    }
    function unit(kind = "absolute") {
      return state.preferences.temp_unit === "fahrenheit"
        ? (kind === "differential" ? "Δ°F" : "°F") : "°C";
    }
    // WMO weather interpretation code -> one of eight pictograms. The device
    // draws these from a bundled LVGL font that a browser has no access to, so
    // the same buckets as weather_code_icon() are redrawn here as inline SVG.
    function weatherIconKind(code) {
      if (code === 0) return "sun";
      if (code === 1 || code === 2) return "cloud-sun";
      if (code === 45 || code === 48) return "fog";
      if (code === 95 || code === 96 || code === 99) return "thunder";
      if (code === 71 || code === 73 || code === 75 || code === 77 || code === 85 || code === 86) return "snow";
      if (code === 65 || code === 66 || code === 67 || code === 82) return "heavy-rain";
      if ((code >= 51 && code <= 63) || code === 80 || code === 81) return "rain";
      return "cloud";
    }
    function weatherIcon(code) {
      const kind = weatherIconKind(code);
      const cloud = `<path d="M7 17h9.5a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.6 1.2A3.2 3.2 0 0 0 7 17Z"/>`;
      const sun = `<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M19.1 4.9l-1.5 1.5M6.4 17.6l-1.5 1.5"/>`;
      const shapes = {
        "sun": sun,
        "cloud": cloud,
        "cloud-sun": `<circle cx="8.5" cy="7.5" r="3"/><path d="M8.5 1.5v1.5M2 7.5h1.5M4 3l1 1M13 3l-1 1"/>${cloud}`,
        "fog": `${cloud}<path d="M5 20h9M8 22.5h9"/>`,
        "rain": `${cloud}<path d="M9 19.5l-1 2.5M13 19.5l-1 2.5M17 19.5l-1 2.5"/>`,
        "heavy-rain": `${cloud}<path d="M8 19l-2 4M12 19l-2 4M16 19l-2 4M20 19l-2 4"/>`,
        "snow": `${cloud}<path d="M8 21h2M9 20v2M14 21h2M15 20v2M11 23.5h2M12 22.5v2"/>`,
        "thunder": `${cloud}<path d="M13 19l-4 3 2 0.5-2 2.5"/>`
      };
      return `<svg class="wx-icon" viewBox="0 0 24 26" fill="none" stroke="currentColor" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${shapes[kind]}</svg>`;
    }
    function weatherStatus() {
      const w = state.weather;
      if (!w || !w.valid) return "";
      return `<span class="status-item wx" title="${esc(w.description || "")}" data-wx-code="${esc(String(w.weather_code))}">
        ${weatherIcon(w.weather_code)}<span>${temp(w.temp_c)}</span></span>`;
    }
    function navButton(item, mobile = false) {
      const [route, icon, label] = item;
      return `<button class="nav-link ${state.route === route ? "active" : ""}" data-route="${route}">
        <span class="nav-icon">${icon}</span><span>${label}</span></button>`;
    }
    function routeFromHash() {
      const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
      state.route = parts[0] || "home";
      if (state.route === "settings") state.settingsPage = parts[1] || "wifi";
      if (![...nav.map(n => n[0]), "settings", "errors", "history"].includes(state.route)) state.route = "home";
    }
    const NOTIF_META = {
      firmware_update: { icon: "⬇️", route: ["settings", "firmware"] },
      wifi_unstable:   { icon: "📶", route: ["settings", "wifi"] },
      low_battery:     { icon: "🔋", route: null },
      brownout:        { icon: "⚡", route: ["events", null] },
      unknown:         { icon: "🔔", route: null },
    };
    function notifBell() {
      const items = state.notifications || [];
      const badge = items.length ? `<span class="notif-badge">${items.length}</span>` : "";
      const panel = state.notifOpen ? `
        <div class="notif-panel" data-notif-panel>
          <h3>Notifications</h3>
          ${items.length ? items.map((n, i) => {
            const meta = NOTIF_META[n.key] || NOTIF_META.unknown;
            return `<button class="notif-item" data-action="notif-open" data-index="${i}">
              <span class="ni-icon">${meta.icon}</span><span>${esc(n.message || n.key)}</span></button>`;
          }).join("") : `<div class="notif-empty">No notifications</div>`}
        </div>` : "";
      return `<div class="notif-wrap">
        <button class="icon-btn notif-btn" data-action="notif-toggle" aria-label="Notifications">🔔${badge}</button>
        ${panel}</div>`;
    }
    function shell(content) {
      const connected = !!state.hp.connected;
      return `<div class="app">
        <header class="topbar">
          <div class="brand"><div class="brand-mark">A</div><span>${esc(controllerTitle())}</span></div>
          <div class="top-status">
            <span class="status-item hp-status" title="${connected ? "Heat pump online" : "Heat pump offline"}" aria-label="${connected ? "Heat pump online" : "Heat pump offline"}"><span class="dot ${connected ? "good" : "bad"}"></span><span class="status-label">${connected ? "Online" : "Offline"}</span></span>
            <span class="status-item wifi">${esc(state.wifi.ssid || "WiFi disconnected")}</span>
            ${weatherStatus()}
            <span class="status-item clock">${esc(fmtStatusClock(state.status.time?.local))}</span>
            ${notifBell()}
            <button class="icon-btn" data-route="settings" aria-label="Settings">⚙</button>
            ${state.auth.required ? `<button class="icon-btn signout-btn" data-action="logout" aria-label="Sign out" title="Sign out"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><title>Sign out</title><path d="M5 21q-.825 0-1.412-.587T3 19V5q0-.825.588-1.412T5 3h7v2H5v14h7v2H5Zm11-4-1.375-1.45 2.55-2.55H9v-2h8.175l-2.55-2.55L16 7l5 5-5 5Z"/></svg></button>` : ""}
          </div>
        </header>
        <div class="layout">
          <aside class="rail">${nav.map(n => navButton(n)).join("")}</aside>
          <main class="main">${state.hp.demo_mode ? `<div class="demo-banner" role="status">Demo mode</div>` : ""}${content}</main>
        </div>
        <nav class="mobile-nav">${nav.map(n => navButton(n, true)).join("")}</nav>
      </div>`;
    }
    function pageHead(title, subtitle, action = "") {
      return `<div class="page-head"><div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div>${action ? `<div class="page-actions">${action}</div>` : ""}</div>`;
    }
    function component(name, active, detail = "") {
      return `<div class="component"><span class="${active ? "state-on" : "state-off"}">${active ? "● Active" : "○ Idle"}</span>
        <strong>${esc(name)}</strong>${detail ? `<small>${esc(detail)}</small>` : ""}</div>`;
    }
    function homePage() {
      const hp = state.hp;
      const target = hp.mode === "cooling" ? hp.setpoints.cooling :
        hp.mode === "hot_water" ? hp.setpoints.hot_water :
        hp.mode === "hot_water_cooling" ? (hp.operation === "cooling" ? hp.setpoints.cooling : hp.setpoints.hot_water) :
        hp.setpoints.heating;
      const operation = hp.operation || (hp.unit_on ? "idle" : "off");
      return `<div class="page">
        ${pageHead("Home", "Live operating state and the information you need at a glance.")}
        <section class="card hero">
          <div><div class="eyebrow">${hp.connected ? "Connected" : "Disconnected"}</div>
            <div class="hero-title">${hp.connected ? (operation === "off" ? "Standby" : titleCase(operation)) : "Disconnected"}</div>
            <div class="hero-sub">${hp.defrosting ? "Defrost cycle active" : hp.unit_on ? "System is responding normally" : "Heat pump is powered off"}</div></div>
          <div class="temp-hero"><div class="temp-value">${temp(hp.temperatures.tank)}</div><div class="temp-label">Tank · target ${temp(target)}</div></div>

          <div class="field"><label>Clock format</label><select name="format"><option value="24" ${state.timeConfig.format_24h?"selected":""}>24 hour</option>
            <option value="12" ${!state.timeConfig.format_24h?"selected":""}>12 hour</option></select></div>
          <div class="btn-row"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-action="sync-time">Sync now</button></div></form></section>
        ${locationCard()}`;
    }
    function locationCard() {
      const loc = state.location || {};
      const search = state.locationSearch;
      const coords = loc.valid
        ? `${Number(loc.latitude).toFixed(4)}, ${Number(loc.longitude).toFixed(4)}${loc.iana_tz ? ` · ${esc(loc.iana_tz)}` : ""}`
        : "Set a location to derive the timezone automatically and show local weather.";
      return `<section class="card loc-card" style="margin-top:16px"><h2>Location</h2>
        <div class="loc-current"><strong id="loc-name">${loc.valid ? esc(loc.name || "Unnamed location") : "No location set"}</strong>
          <span class="loc-coords">${loc.valid ? coords : esc(coords)}</span></div>
        <div class="field"><label><input type="checkbox" data-action="toggle-tz-auto" ${loc.tz_auto ? "checked" : ""}>
          Set the timezone automatically from this location</label></div>
        <form data-form="location-search"><div class="field"><label for="loc-query">Search for a place</label>
          <input id="loc-query" name="q" type="search" autocomplete="off" placeholder="City or town" value="${esc(search.query)}"></div>
          <button class="btn primary" type="submit" ${search.busy ? "disabled" : ""}>${search.busy ? "Searching…" : "Search"}</button></form>
        ${search.error ? `<div class="notice bad" style="margin-top:12px">${esc(search.error)}</div>` : ""}
        ${search.results && !search.results.length ? `<div class="notice" style="margin-top:12px">No matching places found.</div>` : ""}
        ${search.results && search.results.length ? `<ul class="loc-results">${search.results.map((r, i) =>
          `<li><button type="button" class="loc-result" data-action="pick-location" data-index="${i}">${esc(r.label || r.name)}
            <small>${Number(r.latitude).toFixed(4)}, ${Number(r.longitude).toFixed(4)}${r.iana_tz ? ` · ${esc(r.iana_tz)}` : ""}</small></button></li>`).join("")}</ul>` : ""}
      </section>`;
    }
    function displaySettings() {
      return `<section class="card"><h2>Display</h2><form data-form="brightness"><div class="field"><label>Saved brightness · <span id="brightness-value">${state.preferences.brightness}%</span></label>
        <input name="brightness" type="range" min="5" max="100" value="${state.preferences.brightness}"></div><button class="btn primary" type="submit">Apply brightness</button></form>
        <p class="metric-sub">After five minutes without touch input, the screen dims to 10%. The first touch wakes it and restores this saved level.</p></section>`;
    }
    function preferenceSettings() {
      return `<section class="card"><h2>Preferences</h2><form data-form="preferences">
        <div class="field"><label>Controller name</label><input name="device_name" maxlength="120" value="${esc(state.preferences.device_name || "")}" placeholder="Up to 30 characters"></div>
        <div class="field"><label>Temperature units</label><select name="temp_unit"><option value="celsius" ${state.preferences.temp_unit==="celsius"?"selected":""}>Celsius</option>
          <option value="fahrenheit" ${state.preferences.temp_unit==="fahrenheit"?"selected":""}>Fahrenheit</option></select></div>
        <div class="field"><label>Device language</label><select name="language"><option value="en" ${state.preferences.language_code==="en"?"selected":""}>English</option>
          <option value="fr" ${state.preferences.language_code==="fr"?"selected":""}>Français</option><option value="es" ${state.preferences.language_code==="es"?"selected":""}>Español</option></select></div>
        <div class="field"><label><input type="checkbox" name="demo_mode" data-action="toggle-demo-mode" ${state.preferences.demo_mode?"checked":""}> Enable demo mode</label></div>
        <button class="btn primary" type="submit">Save preferences</button></form></section>`;
    }
    function securitySettings() {
      return `<div class="grid"><section class="card"><h2>Authentication</h2>
        <div class="notice">Web login and API-key authentication are always required.</div>
        <h3 style="margin-top:24px">Credentials</h3><form data-form="credentials"><div class="field"><label>Username</label><input name="username" value="${esc(state.security.username || "arctic")}"></div>
          <div class="field"><label>New password</label><input name="password" type="password" minlength="8" autocomplete="new-password"></div><button class="btn" type="submit">Save credentials</button></form>
        <h3 style="margin-top:24px">API key</h3><div class="field"><input readonly value="${esc(state.security.api_key || "")}"></div>
        <div class="btn-row"><button class="btn" data-action="copy-key">Copy</button><button class="btn danger" data-action="regenerate-key">Regenerate</button></div></section>
        <section class="card"><div class="card-head"><h2>TLS certificate</h2><span class="badge ${state.tls.https_active?"good":""}">${state.tls.https_active?"HTTPS active":state.tls.has_certs?"Reboot required":"HTTP only"}</span></div>
          <form data-form="tls"><div class="field"><label>Certificate chain (PEM)</label><textarea name="cert"></textarea></div>
          <div class="field"><label>Private key (PEM)</label><textarea name="key"></textarea></div><button class="btn primary" type="submit" ${!state.tls.auth_ready?"disabled":""}>Upload certificate</button></form>
          ${state.tls.has_certs ? `<p><button class="btn danger" data-action="delete-tls">Delete certificate</button></p>` : ""}
          ${!state.tls.auth_ready ? `<div class="notice">Enable both authentication methods before provisioning TLS.</div>` : ""}</section></div>`;
    }
    function homeAssistantSettings() {
      const ha = state.ha || {};
      const paired = !!ha.paired;
      const active = !!ha.pairing_active;
      const code = ha.code || "";
      const remaining = Math.max(0, ha.remaining_seconds || 0);
      const clock = `${Math.floor(remaining / 60)}:${String(remaining % 60).padStart(2, "0")}`;
      let body;
      if (active && code) {
        body = `<div class="notice">Pairing is active. Enter this code in Home Assistant to finish.</div>
          <div style="font-size:44px;letter-spacing:12px;text-align:center;color:var(--cp-accent);font-weight:700;margin:14px 0">${esc(code)}</div>
          <div class="metric-sub" style="text-align:center">Expires in <span id="ha-clock">${clock}</span></div>
          <div class="btn-row" style="margin-top:14px"><button class="btn" data-action="copy-ha-code">Copy code</button><button class="btn danger" data-action="ha-cancel">Cancel pairing</button></div>`;
      } else if (active) {
        body = `<div class="notice">A pairing window is already open. Enter the code shown where it was started (this page or the controller's screen) into Home Assistant, or cancel to start a new one.</div>
          <div class="metric-sub" style="text-align:center">Expires in <span id="ha-clock">${clock}</span></div>
          <div class="btn-row" style="margin-top:14px"><button class="btn danger" data-action="ha-cancel">Cancel pairing</button></div>`;
      } else {
        const pairIntro = paired
          ? "This controller is paired with Home Assistant. Re-pair to connect a different Home Assistant or refresh the credential — the current connection keeps working until you finish."
          : "Start pairing to connect this controller to Home Assistant. A six-digit code will be shown here; enter it in Home Assistant to finish.";
        body = `<p class="metric-sub">${pairIntro}</p>
          <div class="btn-row"><button class="btn ${paired ? "" : "primary"}" data-action="ha-pair">${paired ? "Re-pair" : "Start pairing"}</button></div>`;
      }
      return `<div class="grid"><section class="card">
        <div class="card-head"><h2>Home Assistant</h2><span class="badge ${paired ? "good" : ""}">${paired ? "Paired" : "Not paired"}</span></div>
        <div class="kv"><span>Device name</span><strong>${esc(ha.device_name || "--")}</strong></div>
        ${body}
        ${paired ? `<div class="btn-row" style="margin-top:18px"><button class="btn danger" data-action="ha-revoke">Revoke pairing</button></div>` : ""}
      </section></div>`;
    }
    const perfSlots = [["supply", "Heat Pump Supply"], ["return", "Heat Pump Return"]];
    const perfFluids = [["water", "Water"], ["propylene_glycol", "Propylene glycol"], ["ethylene_glycol", "Ethylene glycol"]];
    const perfValueTypes = [["int16", "16-bit signed"], ["uint16", "16-bit unsigned"], ["float32", "32-bit float"], ["float32_swapped", "32-bit float, swapped"]];
    const perfNoReadings = [["none", "None"], ["0x8000", "0x8000"], ["0x7fff", "0x7FFF"], ["0xffff", "0xFFFF"]];
    const perfFieldNames = {
      flow_lpm: "flow rate", fluid: "loop fluid", glycol_pct: "glycol concentration", source: "source", host: "device address",
      port: "port", unit_id: "unit ID", register: "register", register_type: "register type", value_type: "value type",
      object_type: "object type", object_instance: "object instance", scale: "scale", no_reading: "no-reading value"
    };
    const perfIsFloat = vt => vt === "float32" || vt === "float32_swapped";
    function perfTemp(celsius) {
      if (celsius == null) return "--";
      const f = state.preferences.temp_unit === "fahrenheit";
      return `${(f ? Number(celsius) * 9 / 5 + 32 : Number(celsius)).toFixed(1)} °${f ? "F" : "C"}`;
    }
    function perfOptions(list, selected) {
      return list.map(([value, label]) => `<option value="${esc(value)}" ${String(value) === String(selected) ? "selected" : ""}>${esc(label)}</option>`).join("");
    }
    // Source line shared by the settings page and the home/status cards.
    function perfSource(src, fallback, settling, pending) {
      if (fallback) return { text: "Heat pump sensors (external sensor not responding)", caption: "Estimate · heat pump sensors", cls: "warn" };
      if (pending) return { text: "Heat pump sensors (checking the external sensors)", caption: "Estimate · heat pump sensors", cls: "" };
      if (src === "external" && settling) return { text: "External sensors (waiting for the loop to settle)", caption: "Estimate · external sensors", cls: "" };
      if (src === "external") return { text: "External sensors", caption: "Estimate · external sensors", cls: "good" };
      return { text: "Heat pump sensors", caption: "Estimate · heat pump sensors", cls: "" };
    }
    function perfCaption(r) {
      const s = perfSource(r.perf_source, r.perf_fallback, r.perf_settling, r.perf_pending);
      return s.cls === "warn" ? `<span style="color:var(--cp-warning)">${esc(s.caption)}</span>` : esc(s.caption);
    }
    function perfOutput(watts) {
      if (watts == null) return { label: "Heat output", value: "--" };
      return { label: watts < 0 ? "Cooling output" : "Heating output", value: `${(Math.abs(watts) / 1000).toFixed(1)} kW` };
    }
    function perfError(error, exception, thermux) {
      if (thermux && thermux.status === "unassigned")
        return `Connected, but channel ${thermux.channel} has no sensor assigned. Check the channel table on the Thermux.`;
      if (thermux && ["read_error", "missing", "stale"].includes(thermux.status))
        return `Connected, but the Thermux can't read the sensor on channel ${thermux.channel}. Check its wiring.`;
      const messages = {
        not_read: "Waiting for the first reading.",
        resolve: "Couldn't find that hostname. Check the address, or use the IP address instead.",
        connect: "Couldn't connect. Check the address and port, and that the device is on.",
        timeout: "Connected, but the device didn't answer. Check the unit ID.",
        protocol: "The device sent a reply this controller doesn't understand.",
        exception: `The device turned the request down (Modbus exception ${exception ?? "?"}). Check the register and register type.`,
        rejected: `The device turned the BACnet request down (${exception ?? "?"}). Check the selected object.`,
        units: "The BACnet object doesn't use °C, °F, or K.",
        no_reading: "Connected, but the sensor has no reading right now.",
        out_of_range: "The value read isn't a believable temperature. Check the value type and scale.",
        sensor_changed: "A different sensor is now on this channel. Save this sensor again to accept it.",
        busy: "Couldn't start the test. Try again in a moment."
      };
      return messages[error] || "No reading.";
    }
    function perfLiveHtml() {
      const st = state.perf?.status || {};
      const src = perfSource(st.source, st.fallback, st.settling, st.pending);
      const out = perfOutput(st.heat_out);
      return `<div class="card-head"><h2>Current estimate</h2></div>
        <div class="perf-src"><span class="dot ${src.cls}"></span><span class="${src.cls === "warn" ? "perf-warn" : ""}">${esc(src.text)}</span></div>
        <div class="kv"><span>${out.label}</span><strong>${out.value}</strong></div>
        <div class="kv"><span>COP</span><strong>${st.cop == null ? "--" : Number(st.cop).toFixed(2)}</strong></div>`;
    }
    function perfReadingHtml(slot) {
      const cfg = state.perf?.sensors?.[slot] || {};
      const live = state.perf?.status?.sensors?.[slot] || {};
      if (cfg.source !== "modbus_tcp" && cfg.source !== "bacnet_ip") return "";
      if (live.celsius != null && (live.error === "none" || !live.error))
        return `<div class="kv"><span>Latest reading</span><strong>${perfTemp(live.celsius)}${live.age_s != null ? ` <small class="metric-sub">read ${live.age_s} s ago</small>` : ""}</strong></div>${live.object_name ? `<div class="metric-sub">${esc(live.object_name)}</div>` : ""}`;
      return `<div class="kv"><span>Latest reading</span><strong>--</strong></div><p class="metric-sub perf-warn">${esc(perfError(live.error, live.exception, null))}</p>`;
    }
    function perfTestHtml(slot) {
      const t = state.perfTests[slot];
      if (!t) return "";
      if (t.running) return `<div class="perf-test"><span class="spinner-inline"></span> Testing…</div>`;
      if (t.failed) return `<div class="perf-test notice bad">${esc(t.failed)}</div>`;
      const r = t.result;
      const tm = r.thermux;
      const lines = [];
      if (tm) lines.push(`Thermux found · channel ${tm.channel}${tm.age_s != null ? ` · read ${tm.age_s} s ago` : ""}`);
      if (tm && tm.rom_id) lines.push(`Sensor ID ${esc(tm.rom_id)}`);
      if (r.object_name) lines.push(`BACnet object · ${esc(r.object_name)}`);
      if (r.rom_id && !tm) lines.push(`Sensor ID ${esc(r.rom_id)}`);
      if (t.switched) lines.push(`Register type set to ${r.register_type === "holding" ? "Holding" : "Input"}`);
      if (r.ok) {
        return `<div class="perf-test ok"><strong>Reading OK · ${perfTemp(r.celsius)}</strong>${lines.map(l => `<div class="metric-sub">${l}</div>`).join("")}</div>`;
      }
      return `<div class="perf-test notice bad"><strong>No reading</strong><div>${esc(perfError(r.error, r.exception, tm))}</div>${lines.map(l => `<div class="metric-sub">${l}</div>`).join("")}</div>`;
    }
    function perfSensorCard(slot, title) {
      const s = state.perf.sensors[slot] || {};
      const modbus = s.source === "modbus_tcp";
      const bacnet = s.source === "bacnet_ip";
      const network = modbus || bacnet;
      const float = perfIsFloat(s.value_type);
      const badge = bacnet ? "BACnet/IP" : (modbus ? "Modbus TCP" : "Heat pump's own sensor");
      const browseHtml = perfBrowseHtml(slot);
      return `<section class="card"><form data-form="perf-sensor" data-slot="${slot}">
        <div class="card-head"><h2>${esc(title)}</h2><span class="badge ${network ? "good" : ""}">${badge}</span></div>
        <div class="field"><label>Source</label><select name="source" data-perf="source">${perfOptions([["heat_pump", "Heat pump sensor"], ["modbus_tcp", "Modbus TCP"], ["bacnet_ip", "BACnet/IP"]], s.source)}</select></div>
        <div class="perf-modbus" ${network ? "" : "hidden"}>
          <div class="field"><label>Device address (IP or hostname)</label><input name="host" data-perf="bacnet_identity" maxlength="63" value="${esc(s.host || "")}" placeholder="e.g. thermux.local" autocomplete="off" spellcheck="false"></div>
          <div class="grid grid-3 perf-nums">
            <div class="field"><label>Port</label><input name="port" data-perf="bacnet_identity" type="number" min="1" max="65535" value="${esc(s.port ?? (bacnet ? 47808 : 502))}"></div>
            <div class="field perf-modbus-only" ${modbus ? "" : "hidden"}><label>Unit ID</label><input name="unit_id" type="number" min="0" max="255" value="${esc(s.unit_id ?? 1)}"></div>
            <div class="field perf-modbus-only" ${modbus ? "" : "hidden"}><label>Register</label><input name="register" type="number" min="0" max="65535" value="${esc(s.register ?? 0)}"></div>
            <div class="field perf-bacnet-only" ${bacnet ? "" : "hidden"}><label>Object instance</label><input name="object_instance" data-perf="bacnet_identity" type="number" min="0" max="4194302" value="${esc(s.object_instance ?? "")}"></div>
          </div>
          <div class="perf-bacnet-only" ${bacnet ? "" : "hidden"} style="margin:10px 0">
            <div class="field"><label>Object type</label><select name="object_type" data-perf="bacnet_identity">${perfOptions([["analog_input", "Analog input"], ["analog_value", "Analog value"]], s.object_type || "analog_input")}</select></div>
            <input type="hidden" name="device_instance" value="${esc(s.device_instance ?? "")}">
            <input type="hidden" name="object_name" value="${esc(s.object_name || "")}">
            <input type="hidden" name="rom_id" value="${esc(s.rom_id || "")}">
            <button class="btn" type="button" data-action="perf-browse-bacnet" data-slot="${slot}">Find sensors</button>
            <div id="perf-browse-${slot}">${browseHtml}</div>
          </div>
          <details class="ap-group perf-adv perf-modbus-only" ${modbus ? "" : "hidden"}><summary>Advanced</summary>
            <div class="grid grid-2">
              <div class="field"><label>Register type</label><select name="register_type">${perfOptions([["input", "Input"], ["holding", "Holding"]], s.register_type)}</select></div>
              <div class="field"><label>Value type</label><select name="value_type" data-perf="value_type">${perfOptions(perfValueTypes, s.value_type)}</select></div>
              <div class="field"><label>Scale</label><select name="scale">${perfOptions([["1", "× 1"], ["0.1", "× 0.1"], ["0.01", "× 0.01"], ["0.001", "× 0.001"]], s.scale)}</select></div>
              <div class="field"><label>No-reading value</label><select name="no_reading" ${float ? "disabled" : ""}>${perfOptions(perfNoReadings, float ? "none" : s.no_reading)}</select></div>
            </div>
          </details>
          <div id="perf-reading-${slot}">${perfReadingHtml(slot)}</div>
        </div>
        <div id="perf-test-${slot}">${perfTestHtml(slot)}</div>
        <div class="btn-row" style="margin-top:14px">
          <button class="btn" type="button" data-action="perf-test" data-slot="${slot}" ${network ? "" : "hidden"}>Test sensor</button>
          <button class="btn primary" type="submit">Save</button></div>
      </form></section>`;
    }
    function perfBrowseHtml(slot) {
      const browse = state.perfBrowses[slot];
      return (browse?.running ? `<div class="perf-test"><span class="spinner-inline"></span> Finding sensors…</div>` :
        browse?.failed ? `<div class="perf-test notice bad">${esc(browse.failed)}</div>` :
        browse?.result ? `<div class="perf-test ok"><strong>${browse.result.sensors.length ? "Choose a sensor" : "No sensors found at this address"}</strong>${browse.result.truncated ? `<div class="metric-sub perf-warn">Showing the first ${browse.result.sensors.length} sensors. This device has more objects than can be listed — enter the object number under Advanced.</div>` : ""}${browse.result.sensors.map(x => `<button class="btn" type="button" data-action="perf-pick-bacnet" data-slot="${slot}" data-object-type="${esc(x.object_type)}" data-object-instance="${esc(x.object_instance)}" data-object-name="${esc(x.object_name)}" data-device-instance="${esc(browse.result.device_instance ?? "")}" data-rom-id="${esc(x.rom_id || "")}">${esc(x.object_name || `${x.object_type} ${x.object_instance}`)} — ${x.available ? perfTemp(x.celsius) : "unavailable"}</button>`).join("")}</div>` : "");
    }
    function performanceSettings() {
      const p = state.perf;
      if (!p) return `<section class="card"><div class="spinner"></div></section>`;
      const lim = p.limits || {};
      const water = p.fluid === "water";
      return `<div class="grid grid-2">
        <section class="card" id="perf-live">${perfLiveHtml()}</section>
        <section class="card"><h2>Flow and fluid</h2><form data-form="perf-flow">
          <div class="field"><label>Assumed flow rate (L/min)</label><input name="flow_lpm" type="number" step="0.1" min="${lim.flow_min_lpm ?? 1}" max="${lim.flow_max_lpm ?? 300}" value="${esc(p.flow_lpm)}" required></div>
          <div class="field"><label>Loop fluid</label><select name="fluid" data-perf="fluid">${perfOptions(perfFluids, p.fluid)}</select></div>

            <input name="glycol_pct" type="range" min="0" max="${lim.glycol_max_pct ?? 60}" step="${lim.glycol_step_pct ?? 5}" value="${esc(p.glycol_pct)}" ${water ? "disabled" : ""}></div>
          <button class="btn primary" type="submit">Save</button></form></section>
      </div>
      <h2 style="margin-top:28px">Temperature sensors</h2>
      <p class="metric-sub">Choose where each temperature comes from. If an external sensor stops answering, the estimate falls back to the heat pump's own sensors.</p>
      <div class="grid grid-2">${perfSlots.map(([slot, title]) => perfSensorCard(slot, title)).join("")}</div>`;
    }
    function diagnosticsSettings() {
      return `<section class="card"><div class="card-head"><div><h2>Diagnostics</h2><div class="metric-sub">Logs poll only while this page is open.</div></div>
        <select id="log-level" style="width:120px"><option>V</option><option>D</option><option>I</option><option>W</option><option>E</option></select></div>
        <div id="log-container" class="logs">${state.logs.map(l => `<div class="log ${esc(l.level)}">[${esc(l.level)}] ${esc(l.tag)}: ${esc(l.message)}</div>`).join("") || "No logs loaded."}</div>
        <div class="btn-row" style="margin-top:14px"><button class="btn" data-action="refresh-logs">Refresh</button><button class="btn danger" data-action="clear-logs">Clear logs</button>
          <a class="btn" href="/api/heatpump/diagnostic" download>Download report</a><a class="btn" href="/api/screenshot?format=jpeg" target="_blank">Device screenshot</a></div></section>`;
    }
    function systemSettings() {
      return `<div class="grid"><section class="card"><h2>Controller</h2>
        <div class="kv"><span>Firmware</span><strong>${esc(state.info.version || "--")}</strong></div>
        <div class="kv"><span>Platform</span><strong>${esc(state.info.platform || "--")}</strong></div>
        <div class="kv"><span>Free memory</span><strong>${fmtBytes(state.info.free_heap)}</strong></div>
        <p><button class="btn" data-action="reboot">Restart controller</button></p></section>
        <section class="card"><h2 style="color:var(--cp-danger)">Factory reset</h2><div class="notice bad">Permanently erases WiFi, settings, certificates, event history, and stored files.</div>
          <p><button class="btn danger" data-action="factory-reset">Erase and reset</button></p></section></div>`;
    }
    function settingsPage() {
      const pages = { wifi: wifiSettings, firmware: firmwareSettings, time: timeSettings, display: displaySettings,
        preferences: preferenceSettings, security: securitySettings, home_assistant: homeAssistantSettings,
        performance: performanceSettings, diagnostics: diagnosticsSettings, system: systemSettings };
      if (!state.settingsLoaded) {
        return settingsShell(`<section class="card"><div class="spinner"></div></section>`);
      }
      return settingsShell((pages[state.settingsPage] || wifiSettings)());
    }
    function loginPage() {
      return `<div class="login"><form class="card login-card" data-form="login"><div class="brand" style="margin-bottom:20px"><div class="brand-mark">A</div><span>Arctic Controller</span></div>
        <h1>Sign in</h1><p class="metric-sub">Enter the controller credentials.</p>
        ${state.auth.loginError ? `<div class="notice bad" style="margin:0 0 16px">${esc(state.auth.loginError)}</div>` : ""}
