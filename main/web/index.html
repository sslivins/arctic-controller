    <script>
        function app() {
            return {
                page: 'dashboard',
                loading: false,
                requiresLogin: false,
                isLoggedIn: false,
                lastUpdate: null,
                lang: localStorage.getItem('arctic_lang') || navigator.language.slice(0, 2) || 'en',
                
                loginForm: { username: '', password: '' },
                loginError: '',
                
                info: { version: '--', platform: '--', hostname: 'arctic', free_heap: 0 },
                status: { uptime_ms: 0, time: {} },
                wifi: {},
                heatpump: { 
                    connected: false, 
                    unit_on: false,
                    mode: 'unknown',
                    defrosting: false,
                    compressor: false, 
                    fans: false, 
                    fan_speed: 0,
                    pump: false, 
                    aux_heater: false,
                    temperatures: { tank: 0, outlet: 0, inlet: 0, outdoor: 0, discharge: 0, suction: 0, outdoor_coil: 0, indoor_coil: 0, ipm: 0 },
                    setpoints: { cooling: 0, heating: 0, hot_water: 0 },
                    readings: { compressor_freq: 0, fan_rpm: 0, ac_voltage: 0, ac_current: 0, high_pressure: 0, low_pressure: 0, primary_eev: 0, secondary_eev: 0, power_consumption: 0 },
                    has_error: false,
                    error: null 
                },
                ota: { state: 'idle', progress: 0, current_version: '--' },
                
                // Heat pump control state
                controlLoading: false,
                modes: [
                    { value: 'cooling', label: 'cooling' },
                    { value: 'floor_heating', label: 'floorHeating' },
                    { value: 'fan_coil_heating', label: 'fanCoilHeating' },
                    { value: 'hot_water', label: 'hotWater' },
                    { value: 'auto', label: 'auto' }
                ],
                
                // Error state
                errors: { active: [], history: [] },
                
                // Parameters state
                params: {},
                paramsConnected: false,
                paramsLoading: false,
                editingParam: null,
                editingParamValue: 0,
                paramCategories: [
                    { key: 'EEV', label: 'catEev' },
                    { key: 'Defrost', label: 'catDefrost' },
                    { key: 'Protection', label: 'catProtection' },
                    { key: 'Auto Mode', label: 'catAutoMode' },
                    { key: 'Pump & Valve', label: 'catPumpValve' }
                ],
                
                // GitHub update state
                github: {
                    checking: false,
                    checked: false,
                    updateAvailable: false,
                    latestVersion: '',
                    releaseNotes: '',
                    downloadReady: false,
                    error: ''
                },
                
                timeConfig: { timezone: 'EST5EDT,M3.2.0,M11.1.0', format24h: true, synced: false },
                security: { webAuthEnabled: false, apiAuthEnabled: false, username: '', newPassword: '', apiKey: '' },
                
                dataLoaded: false, // Prevents saving during initial load
                selectedFile: null,
                uploadState: 'idle', // idle, uploading, verifying, rebooting, complete, error
                uploadProgress: 0,
                uploadStatus: '',
                uploadError: '',
                showApiKey: false,
                
                toasts: [],
                toastId: 0,
                
                timezones: [
                    { name: 'US Eastern (EST/EDT)', value: 'EST5EDT,M3.2.0,M11.1.0' },
                    { name: 'US Central (CST/CDT)', value: 'CST6CDT,M3.2.0,M11.1.0' },
                    { name: 'US Mountain (MST/MDT)', value: 'MST7MDT,M3.2.0,M11.1.0' },
                    { name: 'US Pacific (PST/PDT)', value: 'PST8PDT,M3.2.0,M11.1.0' },
                    { name: 'US Alaska', value: 'AKST9AKDT,M3.2.0,M11.1.0' },
                    { name: 'US Hawaii', value: 'HST10' },
                    { name: 'US Arizona (no DST)', value: 'MST7' },
                    { name: 'Canada Atlantic', value: 'AST4ADT,M3.2.0,M11.1.0' },
                    { name: 'Canada Newfoundland', value: 'NST3:30NDT,M3.2.0,M11.1.0' },
                    { name: 'UK / London (GMT/BST)', value: 'GMT0BST,M3.5.0/1,M10.5.0' },
                    { name: 'Central Europe (CET/CEST)', value: 'CET-1CEST,M3.5.0,M10.5.0/3' },
                    { name: 'Eastern Europe (EET/EEST)', value: 'EET-2EEST,M3.5.0/3,M10.5.0/4' },
                    { name: 'Japan (JST)', value: 'JST-9' },
                    { name: 'China (CST)', value: 'CST-8' },
                    { name: 'India (IST)', value: 'IST-5:30' },
                    { name: 'Korea (KST)', value: 'KST-9' },
                    { name: 'Singapore/HK', value: 'SGT-8' },
                    { name: 'Australia Eastern (AEST)', value: 'AEST-10AEDT,M10.1.0,M4.1.0/3' },
                    { name: 'Australia Central', value: 'ACST-9:30ACDT,M10.1.0,M4.1.0/3' },
                    { name: 'Australia Western', value: 'AWST-8' },
                    { name: 'UTC (No offset)', value: 'UTC0' }
                ],
                
                async init() {
                    // Normalize language code
                    if (!translations[this.lang]) {
                        this.lang = 'en';
                    }
                    await this.checkAuth();
                    if (!this.requiresLogin || this.isLoggedIn) {
                        await this.loadAll();
                        this.startPolling();
                    }
                },
                
                // Translation helper
                t(key) {
                    const langData = translations[this.lang] || translations['en'];
                    return langData[key] || translations['en'][key] || key;
                },
                
                setLanguage(lang) {
                    this.lang = lang;
                    localStorage.setItem('arctic_lang', lang);
                },
                
                // Central fetch wrapper - reloads page on 401 (session expired after device reboot)
                async apiFetch(url, options) {
                    const res = await fetch(url, options);
                    if (res.status === 401) {
                        console.warn('Session expired (401), reloading page...');
                        location.reload();
                        // Return a never-resolving promise to stop further processing
                        return new Promise(() => {});
                    }
                    return res;
                },
                
                async checkAuth() {
                    try {
                        const res = await fetch('/api/auth/status');
                        const data = await res.json();
                        this.requiresLogin = data.web_auth_enabled;
                        this.isLoggedIn = data.session_valid;
                    } catch (e) {
                        console.error('Auth check failed:', e);
                    }
                },
                
                async login() {
                    this.loading = true;
                    this.loginError = '';
                    try {
                        const res = await fetch('/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.loginForm)
                        });
                        const data = await res.json();
                        if (res.ok && data.success) {
                            this.isLoggedIn = true;
                            await this.loadAll();
                            this.startPolling();
                        } else {
                            this.loginError = data.error || this.t('loginFailed');
                        }
                    } catch (e) {
                        this.loginError = this.t('connectionError');
                    }
                    this.loading = false;
                },
                
                async loadAll() {
                    await Promise.all([
                        this.loadInfo(),
                        this.loadStatus(),
                        this.loadWifi(),
                        this.loadOta(),
                        this.loadTimeConfig(),
                        this.loadSecurity(),
                        this.loadHeatpump(),
                        this.loadErrors()
                    ]);
                    this.dataLoaded = true;
                    this.lastUpdate = Date.now();
                },
                
                startPolling() {
                    // Adaptive polling - fast during OTA, normal otherwise
                    let prevOtaState = this.ota.state;
                    const poll = async () => {
                        await this.loadOta();
                        
                        // Reset github update state when OTA completes (ready_to_reboot)
                        // This ensures after reboot, the UI shows "Check for Updates" instead of stale state
                        if (this.ota.state === 'ready_to_reboot' && prevOtaState !== 'ready_to_reboot') {
                            this.github.checked = false;
                            this.github.updateAvailable = false;
                            this.github.latestVersion = '';
                            this.github.downloadReady = false;
                            this.github.error = '';
                        }
                        prevOtaState = this.ota.state;
                        
                        // Poll faster (500ms) when OTA is active for smooth progress
                        const otaActive = this.ota.state === 'downloading' || this.ota.state === 'verifying' || this.ota.state === 'uploading';
                        const interval = otaActive ? 500 : 5000;
                        
                        // Only load other status on slow poll interval
                        if (!otaActive) {
                            await this.loadStatus();
                            await this.loadHeatpump();
                            await this.loadErrors();
                            this.lastUpdate = Date.now();
                        }
                        
                        setTimeout(poll, interval);
                    };
                    poll();
                },
                
                async loadInfo() {
                    try {
                        const res = await this.apiFetch('/api/info');
                        this.info = await res.json();
                    } catch (e) { console.error(e); }
                },
                
                async loadStatus() {
                    try {
                        const res = await this.apiFetch('/api/status');
                        this.status = await res.json();
                    } catch (e) { console.error(e); }
                },
                
                async loadWifi() {
                    try {
                        const res = await this.apiFetch('/api/wifi');
                        this.wifi = await res.json();
                    } catch (e) { console.error(e); }
                },
                
                async loadOta() {
                    try {
                        const res = await this.apiFetch('/api/ota/status');
                        this.ota = await res.json();
                    } catch (e) { console.error(e); }
                },
                
                async loadTimeConfig() {
                    try {
                        const res = await this.apiFetch('/api/time/config');
                        const data = await res.json();
                        // Store what we're loading BEFORE setting reactive properties
                        // This prevents race conditions with @change handlers
                        const newTz = data.timezone || this.timeConfig.timezone;
                        const newFormat = data.format_24h !== undefined ? data.format_24h : this.timeConfig.format24h;
                        this._loadedTimezone = newTz;
                        this._loadedFormat24h = newFormat;
                        // Now set the reactive properties
                        this.timeConfig.timezone = newTz;
                        this.timeConfig.format24h = newFormat;
                        this.timeConfig.synced = data.synced || false;
                    } catch (e) { console.error(e); }
                },
                
                async loadSecurity() {
                    try {
                        const res = await this.apiFetch('/api/auth/config');
                        const data = await res.json();
                        // Map snake_case response to camelCase UI model
                        this.security.webAuthEnabled = data.web_auth_enabled || false;
                        this.security.apiAuthEnabled = data.api_auth_enabled || false;
                        this.security.username = data.username || '';
                        
                        // Also fetch the API key (requires authentication)
                        const keyRes = await this.apiFetch('/api/auth/apikey');
                        if (keyRes.ok) {
                            const keyData = await keyRes.json();
                            this.security.apiKey = keyData.api_key || '';
                        }
                    } catch (e) { console.error(e); }
                },
                
                async loadHeatpump() {
                    try {
                        const res = await this.apiFetch('/api/heatpump/status');
                        const data = await res.json();
                        // Merge with defaults to ensure all properties exist
                        this.heatpump = {
                            connected: data.connected || false,
                            unit_on: data.unit_on || false,
                            mode: data.mode || 'unknown',
                            defrosting: data.defrosting || false,
                            compressor: data.compressor || false,
                            fans: data.fans || false,
                            fan_speed: data.fan_speed || 0,
                            pump: data.pump || false,
                            aux_heater: data.aux_heater || false,
                            temperatures: data.temperatures || { tank: 0, outlet: 0, inlet: 0, outdoor: 0, discharge: 0, suction: 0, outdoor_coil: 0, indoor_coil: 0, ipm: 0 },
                            setpoints: data.setpoints || { cooling: 0, heating: 0, hot_water: 0 },
                            readings: data.readings || { compressor_freq: 0, fan_rpm: 0, ac_voltage: 0, ac_current: 0, high_pressure: 0, low_pressure: 0, primary_eev: 0, secondary_eev: 0, power_consumption: 0 },
                            has_error: data.has_error || false,
                            error: data.error || null
                        };
                    } catch (e) { 
                        console.error('Failed to load heatpump status:', e);
                    }
                },
                
                async checkForUpdates() {
                    this.github.checking = true;
                    this.github.error = '';
                    
                    try {
                        const res = await this.apiFetch('/api/ota/releases');
                        if (!res.ok) {
                            const err = await res.json();
                            this.github.error = err.error || this.t('checkFailed');
                        } else {
                            const data = await res.json();
                            this.github.updateAvailable = data.update_available;
                            this.github.latestVersion = data.latest_version;
                            this.github.releaseNotes = data.release_notes || '';
                            this.github.downloadReady = data.download_ready;
                        }
                        this.github.checked = true;
                    } catch (e) {
                        console.error(e);
                        this.github.error = this.t('checkFailed');
                        this.github.checked = true;
                    }
                    
                    this.github.checking = false;
                },
                
                async startGithubUpdate() {
                    if (!this.github.updateAvailable || !this.github.downloadReady) return;
                    
                    this.loading = true;
                    try {
                        const res = await this.apiFetch('/api/ota/github', { method: 'POST' });
                        if (!res.ok) {
                            const err = await res.json();
                            this.showToast(err.error || 'Update failed', 'error');
                        } else {
                            this.showToast('Update started - downloading...', 'info');
                            // Polling will pick up the progress
                        }
                    } catch (e) {
                        console.error(e);
                        this.showToast('Failed to start update', 'error');
                    }
                    this.loading = false;
                },
                
                async saveTimeConfig() {
                    if (!this.dataLoaded) return; // Don't save during initial load
                    // Only save if values actually changed from what was loaded
                    if (this.timeConfig.timezone === this._loadedTimezone &&
                        this.timeConfig.format24h === this._loadedFormat24h) {
                        return;
                    }
                    try {
                        await this.apiFetch('/api/time/config', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                timezone: this.timeConfig.timezone,
                                format_24h: this.timeConfig.format24h
                            })
                        });
                        // Update loaded values after successful save
                        this._loadedTimezone = this.timeConfig.timezone;
                        this._loadedFormat24h = this.timeConfig.format24h;
                    } catch (e) { console.error(e); }
                },
                
                async syncTime() {
                    this.loading = true;
                    try {
                        await this.apiFetch('/api/time/sync', { method: 'POST' });
                        await this.loadTimeConfig();
                    } catch (e) { console.error(e); }
                    this.loading = false;
                },
                
                async saveSecurityConfig() {
                    try {
                        const res = await this.apiFetch('/api/auth/config', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                web_auth_enabled: this.security.webAuthEnabled,
                                api_auth_enabled: this.security.apiAuthEnabled
                            })
                        });
                        const data = await res.json();
                        // If a new API key was auto-generated, update our display
                        if (data.api_key_generated && data.api_key) {
                            this.security.apiKey = data.api_key;
                            this.showApiKey = true; // Show the new key
                        }
                    } catch (e) { console.error(e); }
                },
                
                copyApiKey() {
                    const key = this.security.apiKey;
                    if (!key) return;
                    
                    // Fallback for non-secure contexts (HTTP)
                    const textarea = document.createElement('textarea');
                    textarea.value = key;
                    textarea.style.position = 'fixed';
                    textarea.style.left = '-9999px';
                    textarea.style.top = '-9999px';
                    document.body.appendChild(textarea);
                    textarea.focus();
                    textarea.select();
                    
                    try {
                        document.execCommand('copy');
                        // Brief visual feedback
                        const btn = event.target;
                        const originalText = btn.textContent;
                        btn.textContent = this.t('copied');
                        setTimeout(() => btn.textContent = originalText, 1500);
                    } catch (err) {
                        console.error('Copy failed:', err);
                        this.showToast(this.t('copyFailed'), 'error');
                    }
                    
                    document.body.removeChild(textarea);
                },
                
                async saveCredentials() {
                    this.loading = true;
                    try {
                        await this.apiFetch('/api/auth/credentials', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: this.security.username,
                                password: this.security.newPassword
                            })
                        });
                        this.security.newPassword = '';
                        this.showToast(this.t('credentialsSaved'), 'success');
                    } catch (e) { 
                        console.error(e);
                        this.showToast(this.t('credentialsFailed'), 'error');
                    }
                    this.loading = false;
                },
                
                showToast(message, type = 'info', duration = 3000) {
                    const id = ++this.toastId;
                    this.toasts.push({ id, message, type, hiding: false });
                    
                    setTimeout(() => {
                        const toast = this.toasts.find(t => t.id === id);
                        if (toast) toast.hiding = true;
                        setTimeout(() => {
                            this.toasts = this.toasts.filter(t => t.id !== id);
                        }, 300);
                    }, duration);
                },
                
                async regenerateApiKey() {
                    if (!confirm(this.t('regenerateConfirm'))) return;
                    try {
                        const res = await this.apiFetch('/api/auth/apikey/regenerate', { method: 'POST' });
                        const data = await res.json();
                        this.security.apiKey = data.api_key;
                    } catch (e) { console.error(e); }
                },
                
                handleFileSelect(e) {
                    this.selectedFile = e.target.files[0];
                },
                
                handleFileDrop(e) {
                    e.target.classList.remove('dragover');
                    const file = e.dataTransfer.files[0];
                    if (file && file.name.endsWith('.bin')) {
                        this.selectedFile = file;
                    }
                },
                
                async startOtaUpload() {
                    if (!this.selectedFile) return;
                    
                    // Validate file extension
                    if (!this.selectedFile.name.toLowerCase().endsWith('.bin')) {
                        this.uploadError = this.t('invalidFileType');
                        this.uploadState = 'error';
                        return;
                    }
                    
                    this.uploadState = 'uploading';
                    this.uploadProgress = 0;
                    this.uploadStatus = this.t('uploading');
                    this.uploadError = '';
                    this.loading = true;
                    
                    const xhr = new XMLHttpRequest();
                    const self = this;
                    
                    xhr.upload.onprogress = function(e) {
                        if (e.lengthComputable) {
                            // Use 0-90% for upload, 90-95% for verification
                            self.uploadProgress = Math.round((e.loaded / e.total) * 90);
                            self.uploadStatus = `${self.formatBytes(e.loaded)} / ${self.formatBytes(e.total)}`;
                        }
                    };
                    
                    xhr.onload = function() {
                        if (xhr.status === 200) {
                            try {
                                const result = JSON.parse(xhr.responseText);
                                if (result.success) {
                                    self.uploadProgress = 95;
                                    self.uploadStatus = self.t('verifying');
                                    self.uploadState = 'verifying';
                                    
                                    // Start reboot sequence
                                    setTimeout(() => {
                                        self.uploadProgress = 100;
                                        self.uploadStatus = self.t('rebooting');
                                        self.uploadState = 'rebooting';
                                        self.waitForReboot();
                                    }, 1000);
                                } else {
                                    self.uploadError = result.error || 'Upload failed';
                                    self.uploadState = 'error';
                                    self.loading = false;
                                }
                            } catch (e) {
                                self.uploadError = 'Invalid server response';
                                self.uploadState = 'error';
                                self.loading = false;
                            }
                        } else {
                            self.uploadError = `Upload failed (HTTP ${xhr.status})`;
                            self.uploadState = 'error';
                            self.loading = false;
                        }
                    };
                    
                    xhr.onerror = function() {
                        self.uploadError = 'Network error during upload';
                        self.uploadState = 'error';
                        self.loading = false;
                    };
                    
                    xhr.open('POST', '/api/ota/upload', true);
                    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
                    xhr.send(this.selectedFile);
                },
                
                async waitForReboot() {
                    this.uploadStatus = this.t('deviceRebooting');
                    let attempts = 0;
                    const maxAttempts = 60; // 60 seconds max wait
                    const self = this;
                    
                    const checkDevice = async () => {
                        attempts++;
                        try {
                            // Use a simple HEAD request to check if server is responding
                            // We check for any response (even 401) to know device is back
                            const res = await fetch('/api/info', { 
                                method: 'GET',
                                cache: 'no-cache'
                            });
                            
                            // Any response (including 401 Unauthorized) means device is back
                            // After firmware update, sessions are cleared so we just refresh the page
                            self.uploadState = 'complete';
                            self.uploadStatus = self.t('updateSuccessful');
                            self.loading = false;
                            
                            // Refresh the page - this will show login screen if auth is enabled
                            setTimeout(() => {
                                window.location.reload();
                            }, 1500);
                            return;
                        } catch (e) {
                            // Device not responding yet (network error)
                        }
                        
                        if (attempts < maxAttempts) {
                            self.uploadStatus = `${self.t('deviceRebooting').replace('...', '')} (${attempts}s)...`;
                            setTimeout(checkDevice, 1000);
                        } else {
                            self.uploadError = self.t('deviceRebootTimeout');
                            self.uploadState = 'error';
                            self.loading = false;
                        }
                    };
                    
                    // Wait a few seconds before starting to poll
                    setTimeout(checkDevice, 3000);
                },
                
                async reboot() {
                    if (!confirm(this.t('rebootConfirm'))) return;
                    await this.apiFetch('/api/ota/reboot', { method: 'POST' });
                    this.showToast(this.t('rebootingMsg'), 'info', 5000);
                },
                
                // ==========================================
                // Heat Pump Control Methods
                // ==========================================
                
                async togglePower() {
                    this.controlLoading = true;
                    try {
                        const res = await this.apiFetch('/api/heatpump/power', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ on: !this.heatpump.unit_on })
                        });
                        const data = await res.json();
                        if (data.success) {
                            this.heatpump.unit_on = data.on;
                            this.showToast(data.on ? this.t('turnOn') : this.t('turnOff'), 'success');
                        }
                    } catch (e) { console.error(e); }
                    this.controlLoading = false;
                    await this.loadHeatpump();
                },
                
                async setMode(mode) {
                    this.controlLoading = true;
                    try {
                        const res = await this.apiFetch('/api/heatpump/mode', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ mode })
                        });
                        const data = await res.json();
                        if (data.success) {
                            this.heatpump.mode = data.mode;
                        }
                    } catch (e) { console.error(e); }
                    this.controlLoading = false;
                    await this.loadHeatpump();
                },
                
                async adjustSetpoint(type, delta) {
                    const current = this.heatpump.setpoints[type];
                    if (current === undefined) return;
                    
                    const newVal = current + delta;
                    this.controlLoading = true;
                    try {
                        const body = {};
                        body[type] = newVal;
                        const res = await this.apiFetch('/api/heatpump/setpoints', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(body)
                        });
                        const data = await res.json();
                        if (data.success) {
                            this.heatpump.setpoints[type] = newVal;
                            this.showToast(this.t('setpointSaved'), 'success');
                        } else {
                            this.showToast(this.t('setpointFailed'), 'error');
                        }
                    } catch (e) {
                        console.error(e);
                        this.showToast(this.t('setpointFailed'), 'error');
                    }
                    this.controlLoading = false;
                },
                
                // ==========================================
                // Error Methods
                // ==========================================
                
                async loadErrors() {
                    try {
                        const res = await this.apiFetch('/api/heatpump/errors');
                        const data = await res.json();
                        this.errors = {
                            active: data.active || [],
                            history: data.history || []
                        };
                    } catch (e) { console.error(e); }
                },
                
                async clearErrorHistory() {
                    try {
                        await this.apiFetch('/api/heatpump/errors/history', { method: 'DELETE' });
                        this.errors.history = [];
                        this.showToast(this.t('clearHistory'), 'success');
                    } catch (e) { console.error(e); }
                },
                
                // ==========================================
                // Parameters Methods
                // ==========================================
                
                async loadParams() {
                    this.paramsLoading = true;
                    try {
                        const res = await this.apiFetch('/api/heatpump/params');
                        const data = await res.json();
                        this.paramsConnected = data.connected || false;
                        this.params = data.params || {};
                    } catch (e) {
                        console.error(e);
                        this.paramsConnected = false;
                    }
                    this.paramsLoading = false;
                },
                
                getParamsByCategory(category) {
                    return Object.entries(this.params).filter(([k, p]) => p.category === category);
                },
                
                startEditParam(key, p) {
                    this.editingParam = key;
                    this.editingParamValue = p.value !== null ? p.value : 0;
                },
                
                async saveParam(key) {
                    this.controlLoading = true;
                    try {
                        const res = await this.apiFetch('/api/heatpump/params/' + key, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'text/plain' },
                            body: String(this.editingParamValue)
                        });
                        const data = await res.json();
                        if (data.success) {
                            // Update local value
                            if (this.params[key]) {
                                this.params[key].value = this.editingParamValue;
                            }
                            this.editingParam = null;
                            this.showToast(this.t('paramSaved'), 'success');
                        } else {
                            this.showToast(data.error || this.t('paramFailed'), 'error');
                        }
                    } catch (e) {
                        console.error(e);
                        this.showToast(this.t('paramFailed'), 'error');
                    }
                    this.controlLoading = false;
                },
                
                capitalize(str) {
                    if (!str) return '';
                    return str.charAt(0).toUpperCase() + str.slice(1);
                },
                
                formatTimestamp(ts) {
                    if (!ts) return '--';
                    return new Date(ts * 1000).toLocaleString();
                },
                
                // Maps the current operating mode to the corresponding setpoint key
                getActiveSetpointKey() {
                    const mode = this.heatpump.mode;
                    if (mode === 'cooling') return 'cooling';
                    if (mode === 'hot_water') return 'hot_water';
                    return 'heating'; // floor_heating, fan_coil_heating, auto all use heating
                },
                
                // Returns the translated label for the active setpoint
                getActiveSetpointLabel() {
                    const mode = this.heatpump.mode;
                    if (mode === 'cooling') return this.t('coolingSetpoint');
                    if (mode === 'hot_water') return this.t('hotWaterSetpoint');
                    return this.t('heatingSetpoint');
                },
                
                // Returns the numeric value of the active setpoint
                getActiveSetpointValue() {
                    const key = this.getActiveSetpointKey();
                    return this.heatpump.setpoints[key] ?? '--';
                },
                
                formatPower(watts) {
                    if (!watts && watts !== 0) return '--';
                    if (watts >= 1000) return (watts / 1000).toFixed(1) + ' kW';
                    return watts + ' W';
                },
                
                formatUptime(ms) {
                    if (!ms) return '--';
                    const s = Math.floor(ms / 1000);
                    const d = Math.floor(s / 86400);
                    const h = Math.floor((s % 86400) / 3600);
                    const m = Math.floor((s % 3600) / 60);
                    if (d > 0) return `${d}d ${h}h ${m}m`;
                    if (h > 0) return `${h}h ${m}m`;
                    return `${m}m`;
                },
                
                formatBytes(bytes) {
                    if (!bytes) return '0 B';
                    const k = 1024;
                    const sizes = ['B', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
                },
                
                formatTime(ts) {
                    if (!ts) return '--';
                    return new Date(ts).toLocaleTimeString();
                },
                
                getSignalBars(rssi) {
                    if (rssi > -50) return '▂▄▆█';
                    if (rssi > -60) return '▂▄▆▁';
                    if (rssi > -70) return '▂▄▁▁';
                    if (rssi > -80) return '▂▁▁▁';
                    return '▁▁▁▁';
                },
                
                getSignalStrength(rssi) {
                    if (rssi > -50) return this.t('signalExcellent');
                    if (rssi > -60) return this.t('signalGood');
                    if (rssi > -70) return this.t('signalFair');
                    if (rssi > -80) return this.t('signalWeak');
                    return this.t('signalPoor');
                }
            };
        }
    </script>
</body>
