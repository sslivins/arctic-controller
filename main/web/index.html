<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arctic Controller</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    :root {
      --cp-bg: #f4f6fa;
      --cp-bg-elevated: #fbfcfe;
      --cp-surface-soft: #eef2f7;
      --cp-border: #d6dde6;
      --cp-border-strong: #8a97a6;
      --cp-accent: #005a9e;
      --cp-accent-hover: #044a86;
      --cp-accent-soft: rgba(0, 90, 158, 0.08);
      --cp-highlight: rgba(0, 90, 158, 0.12);
      --cp-panel: rgba(251, 252, 254, 0.86);
      --cp-panel-strong: rgba(251, 252, 254, 0.96);
    }
    html[data-theme="dark"] {
      --cp-bg: #1a1a2e;
      --cp-bg-elevated: #0f1a2e;
      --cp-surface: #1e2a4a;
      --cp-surface-soft: #1a2a4e;
      --cp-border: #0f3460;
      --cp-border-strong: #28496f;
      --cp-text: #eaeaea;
      --cp-text-muted: #9fb3c8;
      --cp-text-soft: #b9c6d6;
      --cp-accent: #00d4ff;
      --cp-accent-hover: #5ce0ff;
      --cp-accent-soft: rgba(0, 212, 255, 0.14);
      --cp-accent-fg: #062033;
      --cp-success: #4ade80;
      --cp-danger: #ef4444;
      --cp-warning: #fbbf24;
      --cp-link: #00d4ff;
      --cp-overlay: rgba(15, 26, 46, 0.88);
      --cp-panel: rgba(15, 26, 46, 0.72);
      --cp-panel-strong: rgba(15, 26, 46, 0.96);
      --cp-highlight: rgba(0, 212, 255, 0.12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.45;
    }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    a { color: var(--cp-link); }
    .hidden { display: none !important; }
    .app { min-height: 100vh; }
    .topbar {
      position: sticky; top: 0; z-index: 30;
      height: 64px; display: flex; align-items: center; gap: 16px;
      padding: 0 20px; background: var(--cp-panel-strong);
      border-bottom: 1px solid var(--cp-border);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 210px; font-weight: 700; }
    .brand-mark {
      width: 34px; height: 34px; display: grid; place-items: center;
      border-radius: 10px; background: var(--cp-accent); color: var(--cp-accent-fg);
      font-size: 19px;
    }
    .top-status { flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 16px; min-width: 0; }
    .status-item { display: flex; align-items: center; gap: 7px; color: var(--cp-text-muted); font-size: 13px; white-space: nowrap; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cp-border-strong); }
    .dot.good { background: var(--cp-success); }
    .dot.bad { background: var(--cp-danger); }
    .icon-btn {
      width: 38px; height: 38px; border: 1px solid var(--cp-border);
      border-radius: 10px; background: var(--cp-surface); color: var(--cp-text);
      display: grid; place-items: center; text-decoration: none;
    }
    .layout { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: calc(100vh - 64px); }
    .rail {
      position: sticky; top: 64px; align-self: start; height: calc(100vh - 64px);
      padding: 20px 12px; border-right: 1px solid var(--cp-border);
      background: var(--cp-bg-elevated);
    }
    .nav-link {
      width: 100%; border: 0; background: transparent; color: var(--cp-text-muted);
      border-radius: 10px; padding: 11px 12px; margin: 2px 0;
      display: flex; align-items: center; gap: 11px; text-align: left; font-weight: 600;
    }
    .nav-link:hover { background: var(--cp-surface-soft); color: var(--cp-text); }
    .nav-link.active { background: var(--cp-accent-soft); color: var(--cp-accent); }
    .nav-icon { width: 22px; text-align: center; font-size: 17px; }
    .main { min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 48px; }
    .page { max-width: 1220px; margin: 0 auto; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .page-head h1 { margin: 0; font-size: clamp(26px, 4vw, 36px); letter-spacing: -0.03em; }
    .page-head p { margin: 5px 0 0; color: var(--cp-text-muted); }
    .grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .card {
      background: var(--cp-surface); border: 1px solid var(--cp-border);
      border-radius: 16px; padding: 20px;
      box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
    }
    .card h2, .card h3 { margin: 0 0 12px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .hero { padding: 28px; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; }
    .eyebrow { text-transform: uppercase; font-size: 12px; letter-spacing: .1em; color: var(--cp-text-muted); font-weight: 700; }
    .hero-title { margin: 6px 0; font-size: clamp(32px, 6vw, 54px); line-height: 1; letter-spacing: -.04em; }
    .hero-sub { color: var(--cp-text-muted); }
    .temp-hero { text-align: right; }
    .temp-value { font-size: clamp(44px, 8vw, 72px); line-height: 1; font-weight: 650; letter-spacing: -.06em; }
    .temp-label { color: var(--cp-text-muted); margin-top: 6px; }
    .metric { min-height: 112px; }
    .metric-label { color: var(--cp-text-muted); font-size: 13px; }
    .metric-value { font-size: 28px; font-weight: 650; margin-top: 8px; }
    .metric-sub { color: var(--cp-text-soft); font-size: 13px; margin-top: 4px; }
    .component-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .component {
      padding: 13px; border: 1px solid var(--cp-border); border-radius: 10px;
      background: var(--cp-surface-soft);
    }
    .component strong { display: block; margin-top: 4px; }
    .state-on { color: var(--cp-success); }
    .state-off { color: var(--cp-text-muted); }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px;
      border-radius: 999px; font-size: 12px; font-weight: 700;
      background: var(--cp-surface-soft); color: var(--cp-text-muted);
    }
    .badge.good { color: var(--cp-success); background: var(--cp-surface-soft); }
    .badge.warn { color: var(--cp-warning); }
    .badge.bad { color: var(--cp-danger); }
    .btn {
      min-height: 40px; border-radius: 10px; padding: 8px 14px;
      border: 1px solid var(--cp-border-strong); background: var(--cp-surface);
      color: var(--cp-text); font-weight: 650;
    }
    .btn:hover { background: var(--cp-surface-soft); }
    .btn.primary { background: var(--cp-accent); border-color: var(--cp-accent); color: var(--cp-accent-fg); }
    .btn.primary:hover { background: var(--cp-accent-hover); }
    .btn.danger { color: var(--cp-danger); border-color: var(--cp-danger); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .field { display: grid; gap: 6px; margin-bottom: 14px; }
    .field label { color: var(--cp-text-muted); font-size: 13px; font-weight: 600; }
    input, select, textarea {
      width: 100%; border: 1px solid var(--cp-border-strong);
      background: var(--cp-surface); color: var(--cp-text);
      border-radius: 10px; padding: 10px 12px; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--cp-accent); box-shadow: 0 0 0 3px var(--cp-accent-soft); }
    textarea { min-height: 120px; resize: vertical; }
    .setpoint { display: grid; gap: 14px; }
    .range-editor { display: grid; gap: 8px; min-width: 0; }
    .range-readout { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .range-readout output { color: var(--cp-accent); font-size: 24px; font-weight: 750; }
    .range-limits { display: flex; justify-content: space-between; color: var(--cp-text-muted); font-size: 12px; }
    input.control-range {
      appearance: none; height: 28px; padding: 0; border: 0; background: transparent;
      box-shadow: none;
    }
    input.control-range:focus { box-shadow: none; }
    input.control-range::-webkit-slider-runnable-track {
      height: 8px; border-radius: 10px; background: var(--cp-border);
    }
    input.control-range::-webkit-slider-thumb {
      appearance: none; width: 26px; height: 26px; margin-top: -9px;
      border: 3px solid var(--cp-surface); border-radius: 50%; background: var(--cp-accent);
      box-shadow: 0 0 0 1px var(--cp-border-strong);
    }
    input.control-range::-moz-range-track {
      height: 8px; border-radius: 10px; background: var(--cp-border);
    }
    input.control-range::-moz-range-thumb {
      width: 20px; height: 20px; border: 3px solid var(--cp-surface);
      border-radius: 50%; background: var(--cp-accent);
      box-shadow: 0 0 0 1px var(--cp-border-strong);
    }
    .choice-editor { display: grid; gap: 8px; min-width: 0; }
    .choice-description {
      min-height: 38px; padding: 8px 10px; border-radius: 10px;
      background: var(--cp-surface-soft); color: var(--cp-text-muted);
      font-size: 13px; line-height: 1.4; overflow-wrap: anywhere;
    }
    .mode-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .mode-btn {
      min-height: 66px; padding: 8px; border: 1px solid var(--cp-border);
      border-radius: 10px; background: var(--cp-surface-soft); color: var(--cp-text-muted);
    }
    .mode-btn.active { border-color: var(--cp-accent); color: var(--cp-accent); background: var(--cp-accent-soft); }
    .power-btn {
      width: 100%; min-height: 72px; border-radius: 16px; border: 1px solid var(--cp-border-strong);
      background: var(--cp-surface-soft); color: var(--cp-text); font-size: 18px; font-weight: 700;
      position: relative; overflow: hidden;
    }
    .power-btn.on { color: var(--cp-danger); }
    .power-progress { position: absolute; inset: auto 0 0; height: 5px; background: var(--cp-accent); transform-origin: left; }
    @keyframes hold { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .ap-group { margin-top: 8px; border: 1px solid var(--cp-border); border-radius: 10px; overflow: hidden; }
    .ap-group > summary {
      padding: 13px 14px; cursor: pointer; font-weight: 700;
      background: var(--cp-surface-soft);
    }
    .ap-group > summary:hover { background: var(--cp-accent-soft); }
    .ap-group[open] > summary {
      color: var(--cp-accent); background: var(--cp-accent-soft);
      border-bottom: 1px solid var(--cp-border);
    }
    .ap-group > .ap-row { padding-inline: 14px; }
    .ap-row { padding: 14px 0; border-top: 1px solid var(--cp-border); display: grid; grid-template-columns: 1fr minmax(260px, 360px); gap: 16px; }
    .ap-row p { color: var(--cp-text-muted); margin: 5px 0 0; font-size: 13px; }
    .ap-value { display: grid; gap: 10px; align-content: center; }
    .event-toolbar { display: grid; grid-template-columns: 1fr 170px 170px; gap: 10px; margin-bottom: 16px; }
    .search-field { position: relative; }
    .search-field input { padding-right: 44px; }
    .search-field input::-webkit-search-cancel-button { appearance: none; }
    .search-clear {
      position: absolute; top: 50%; right: 5px; transform: translateY(-50%);
      width: 34px; height: 34px; padding: 0; border: 0; border-radius: 10px;
      background: transparent; color: var(--cp-text-muted); font-size: 22px; line-height: 1;
    }
    .search-clear:hover { background: var(--cp-surface-soft); color: var(--cp-text); }
    .search-clear[hidden] { display: none; }
    .event-list { display: grid; gap: 8px; }
    .event {
      display: grid; grid-template-columns: 110px 1fr auto; gap: 14px; align-items: center;
      padding: 14px 16px; border: 1px solid var(--cp-border); border-radius: 10px;
      background: var(--cp-surface);
    }
    .event-time { color: var(--cp-text-muted); font-size: 13px; }
    .event-title { font-weight: 650; }
    .event-detail { color: var(--cp-text-muted); font-size: 13px; }
    .settings-layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 20px; }
    .settings-nav { align-self: start; position: sticky; top: 88px; }
    .settings-nav .nav-link { font-weight: 600; }
    .kv { display: grid; grid-template-columns: minmax(130px, 1fr) auto; gap: 10px; padding: 10px 0; border-top: 1px solid var(--cp-border); }
    .kv:first-child { border-top: 0; }
    .kv span:first-child { color: var(--cp-text-muted); }
    .notice { border-left: 4px solid var(--cp-warning); padding: 12px 14px; background: var(--cp-surface-soft); border-radius: 0 10px 10px 0; }
    .notice.bad { border-left-color: var(--cp-danger); }
    .logs {
      height: 430px; overflow: auto; padding: 12px; border: 1px solid var(--cp-border);
      border-radius: 10px; background: var(--cp-bg-elevated);
      font-family: Consolas, "Courier New", Courier, monospace; font-size: 12px;
    }
    .log { padding: 3px 0; overflow-wrap: anywhere; }
    .log.E { color: var(--cp-danger); }
    .log.W { color: var(--cp-warning); }
    .error-item { padding: 14px 0; border-top: 1px solid var(--cp-border); }
    .error-item:first-child { border-top: 0; }
    .error-code { color: var(--cp-danger); font-weight: 750; }
    .empty { color: var(--cp-text-muted); text-align: center; padding: 36px 16px; }
    .toast-stack { position: fixed; top: 76px; right: 16px; z-index: 80; display: grid; gap: 8px; max-width: 360px; }
    .toast { padding: 12px 14px; border: 1px solid var(--cp-border); border-radius: 10px; background: var(--cp-panel-strong); box-shadow: var(--cp-shadow); }
    .toast.good { border-color: var(--cp-success); }
    .toast.bad { border-color: var(--cp-danger); }
    .login {
      min-height: 100vh; display: grid; place-items: center; padding: 20px;
      background: var(--cp-bg);
    }
    .login-card { width: min(420px, 100%); }
    .login-card h1 { margin-top: 0; }
    .mobile-nav { display: none; }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--cp-border); border-top-color: var(--cp-accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .rail { display: none; }
      .main { padding-bottom: 92px; }
      .mobile-nav {
        position: fixed; display: grid; grid-template-columns: repeat(4, 1fr);
        bottom: 0; left: 0; right: 0; z-index: 40;
        background: var(--cp-panel-strong); border-top: 1px solid var(--cp-border);
        padding: 6px 8px max(6px, env(safe-area-inset-bottom));
      }
      .mobile-nav .nav-link { justify-content: center; flex-direction: column; gap: 2px; padding: 7px; font-size: 11px; }
      .brand { min-width: 0; }
      .brand span:last-child { display: none; }
      .top-status .status-item:nth-child(2), .top-status .status-item:nth-child(3) { display: none; }
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .settings-layout { grid-template-columns: 1fr; }
      .settings-nav { position: static; display: flex; overflow-x: auto; gap: 4px; }
      .settings-nav .nav-link { width: auto; white-space: nowrap; }
    }
    @media (max-width: 620px) {
      .topbar { padding: 0 12px; }
      .main { padding-inline: 12px; padding-top: 20px; }
      .hero { grid-template-columns: 1fr; }
      .temp-hero { text-align: left; }
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .component-list { grid-template-columns: repeat(2, 1fr); }
      .mode-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .event-toolbar { grid-template-columns: 1fr; }
      .event { grid-template-columns: 1fr auto; }
      .event-time { grid-column: 1 / -1; }
      .ap-row { grid-template-columns: 1fr; }
      .page-head { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toasts" class="toast-stack"></div>
  <script>
    const $ = (selector, root = document) => root.querySelector(selector);
    const esc = value => String(value ?? "")
      .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    const titleCase = value => String(value || "").replaceAll("_", " ").replace(/\b\w/g, c => c.toUpperCase());
    const fmtBytes = value => {
      const n = Number(value || 0);
      if (n < 1024) return `${n} B`;
      if (n < 1048576) return `${(n / 1024).toFixed(1)} KB`;
      return `${(n / 1048576).toFixed(1)} MB`;
    };
    const fmtUptime = ms => {
      let seconds = Math.floor((ms || 0) / 1000);
      const days = Math.floor(seconds / 86400); seconds %= 86400;
      const hours = Math.floor(seconds / 3600); seconds %= 3600;
      const minutes = Math.floor(seconds / 60);
      return `${days ? `${days}d ` : ""}${hours}h ${minutes}m`;
    };
    const timezones = [
      ["US Eastern", "EST5EDT,M3.2.0,M11.1.0"], ["US Central", "CST6CDT,M3.2.0,M11.1.0"],
      ["US Mountain", "MST7MDT,M3.2.0,M11.1.0"], ["US Pacific", "PST8PDT,M3.2.0,M11.1.0"],
      ["Canada Atlantic", "AST4ADT,M3.2.0,M11.1.0"], ["UK / London", "GMT0BST,M3.5.0/1,M10.5.0"],
      ["Central Europe", "CET-1CEST,M3.5.0,M10.5.0/3"], ["Japan", "JST-9"],
      ["China", "CST-8"], ["India", "IST-5:30"], ["Australia Eastern", "AEST-10AEDT,M10.1.0,M4.1.0/3"],
      ["UTC", "UTC0"]
    ];
    const nav = [
      ["home", "⌂", "Home"], ["status", "▥", "Status"], ["control", "◉", "Control"], ["events", "≡", "Events"]
    ];
    const settingsNav = [
      ["wifi", "WiFi"], ["firmware", "Firmware"], ["time", "Time"], ["display", "Display"],
      ["preferences", "Preferences"], ["security", "Security"], ["home_assistant", "Home Assistant"],
      ["diagnostics", "Diagnostics"], ["system", "System"]
    ];
    const modes = ["cooling", "floor_heating", "fan_coil_heating", "hot_water", "auto"];

    const state = {
      auth: { checked: false, required: true, loggedIn: false, changeRequired: false, loginError: "" },
      route: "home", settingsPage: "wifi", busy: false,
      info: {}, status: { time: {} }, wifi: {}, hp: {
        temperatures: {}, setpoints: {}, setpoint_limits: {}, readings: {}
      },
      preferences: { temp_unit: "celsius", language_code: "en", brightness: 80 },
      errors: { active: [], history: [] }, params: {}, events: [], eventTotal: 0,
      currentBootId: 0, eventOffset: 0, eventFilters: { search: "", category: "all", time: "all" },
      ota: {}, release: null, timeConfig: {}, security: {}, tls: {}, networks: [],
      ha: {}, haTimer: null,
      settingsLoaded: false, settingsPromise: null,

    const queue = [];

    function api(url, options = {}) {
      return new Promise((resolve, reject) => {
        queue.push(async () => {
          activeRequests++;
          try {
            let response;
            try { response = await fetch(url, options); }
            catch (error) {
              const method = String(options.method || "GET").toUpperCase();
              if (method !== "GET") throw error;
              response = await fetch(url, options);
            }
            if (response.status === 401) {
              state.auth.loggedIn = false;
              render();
              throw new Error("Authentication required");
            }
            const type = response.headers.get("content-type") || "";
            const data = type.includes("json") ? await response.json() : await response.text();
            if (!response.ok) throw new Error(data.error || data.message || `HTTP ${response.status}`);
            resolve(data);
          } catch (error) { reject(error); }
          finally { activeRequests--; runQueue(); }
        });
        runQueue();
      });
    }
    function runQueue() {
      while (queue.length && activeRequests < 3) queue.shift()();

      return `<section class="card"><h2>Preferences</h2><form data-form="preferences">
        <div class="field"><label>Temperature units</label><select name="temp_unit"><option value="celsius" ${state.preferences.temp_unit==="celsius"?"selected":""}>Celsius</option>
          <option value="fahrenheit" ${state.preferences.temp_unit==="fahrenheit"?"selected":""}>Fahrenheit</option></select></div>
        <div class="field"><label>Device language</label><select name="language"><option value="en" ${state.preferences.language_code==="en"?"selected":""}>English</option>
          <option value="fr" ${state.preferences.language_code==="fr"?"selected":""}>Français</option><option value="es" ${state.preferences.language_code==="es"?"selected":""}>Español</option></select></div>
        <div class="field"><label><input style="width:auto" type="checkbox" name="demo_mode" ${state.preferences.demo_mode?"checked":""}> Enable demo mode</label></div>
        <button class="btn primary" type="submit">Save preferences</button></form>
        <p class="metric-sub">Changing demo mode requires a restart.</p></section>`;
    }
    function securitySettings() {
      return `<div class="grid"><section class="card"><h2>Authentication</h2>
        <div class="notice">Web login and API-key authentication are always required.</div>
        <h3 style="margin-top:24px">Credentials</h3><form data-form="credentials"><div class="field"><label>Username</label><input name="username" value="${esc(state.security.username || "arctic")}"></div>
          <div class="field"><label>New password</label><input name="password" type="password" minlength="12" autocomplete="new-password"></div><button class="btn" type="submit">Save credentials</button></form>
        <h3 style="margin-top:24px">API key</h3><div class="field"><input readonly value="${esc(state.security.api_key || "")}"></div>
        <div class="btn-row"><button class="btn" data-action="copy-key">Copy</button><button class="btn danger" data-action="regenerate-key">Regenerate</button></div></section>
        <section class="card"><div class="card-head"><h2>TLS certificate</h2><span class="badge ${state.tls.https_active?"good":""}">${state.tls.https_active?"HTTPS active":state.tls.has_certs?"Reboot required":"HTTP only"}</span></div>
          <form data-form="tls"><div class="field"><label>Certificate chain (PEM)</label><textarea name="cert"></textarea></div>
          <div class="field"><label>Private key (PEM)</label><textarea name="key"></textarea></div><button class="btn primary" type="submit" ${!state.tls.auth_ready?"disabled":""}>Upload certificate</button></form>
          ${state.tls.has_certs ? `<p><button class="btn danger" data-action="delete-tls">Delete certificate</button></p>` : ""}
          ${!state.tls.auth_ready ? `<div class="notice">Enable both authentication methods before provisioning TLS.</div>` : ""}</section></div>`;
    }
    function homeAssistantSettings() {
      const ha = state.ha || {};
      const paired = !!ha.paired;
      const active = !!ha.pairing_active;
      const code = ha.code || "";
      const remaining = Math.max(0, ha.remaining_seconds || 0);
      const clock = `${Math.floor(remaining / 60)}:${String(remaining % 60).padStart(2, "0")}`;
      let body;
      if (active && code) {
        body = `<div class="notice">Pairing is active. Enter this code in Home Assistant to finish.</div>
          <div style="font-size:44px;letter-spacing:12px;text-align:center;color:var(--cp-accent);font-weight:700;margin:14px 0">${esc(code)}</div>
          <div class="metric-sub" style="text-align:center">Expires in <span id="ha-clock">${clock}</span></div>
          <div class="btn-row" style="margin-top:14px"><button class="btn" data-action="copy-ha-code">Copy code</button><button class="btn danger" data-action="ha-cancel">Cancel pairing</button></div>`;
      } else if (active) {
        body = `<div class="notice">A pairing window is already open. Enter the code shown where it was started (this page or the controller's screen) into Home Assistant, or cancel to start a new one.</div>
          <div class="metric-sub" style="text-align:center">Expires in <span id="ha-clock">${clock}</span></div>
          <div class="btn-row" style="margin-top:14px"><button class="btn danger" data-action="ha-cancel">Cancel pairing</button></div>`;
      } else {
        const pairIntro = paired
          ? "This controller is paired with Home Assistant. Re-pair to connect a different Home Assistant or refresh the credential — the current connection keeps working until you finish."
          : "Start pairing to connect this controller to Home Assistant. A six-digit code will be shown here; enter it in Home Assistant to finish.";
        body = `<p class="metric-sub">${pairIntro}</p>
          <div class="btn-row"><button class="btn ${paired ? "" : "primary"}" data-action="ha-pair">${paired ? "Re-pair" : "Start pairing"}</button></div>`;
      }
      return `<div class="grid"><section class="card">
        <div class="card-head"><h2>Home Assistant</h2><span class="badge ${paired ? "good" : ""}">${paired ? "Paired" : "Not paired"}</span></div>
        <div class="kv"><span>Device name</span><strong>${esc(ha.device_name || "--")}</strong></div>
        ${body}
        ${paired ? `<div class="btn-row" style="margin-top:18px"><button class="btn danger" data-action="ha-revoke">Revoke pairing</button></div>` : ""}
      </section></div>`;
    }
    function diagnosticsSettings() {
      return `<section class="card"><div class="card-head"><div><h2>Diagnostics</h2><div class="metric-sub">Logs poll only while this page is open.</div></div>
        <select id="log-level" style="width:120px"><option>V</option><option>D</option><option>I</option><option>W</option><option>E</option></select></div>
        <div id="log-container" class="logs">${state.logs.map(l => `<div class="log ${esc(l.level)}">[${esc(l.level)}] ${esc(l.tag)}: ${esc(l.message)}</div>`).join("") || "No logs loaded."}</div>
        <div class="btn-row" style="margin-top:14px"><button class="btn" data-action="refresh-logs">Refresh</button><button class="btn danger" data-action="clear-logs">Clear logs</button>
          <a class="btn" href="/api/heatpump/diagnostic" download>Download report</a><a class="btn" href="/api/screenshot" target="_blank">Device screenshot</a></div></section>`;
    }
    function systemSettings() {
      return `<div class="grid"><section class="card"><h2>Controller</h2>
        <div class="kv"><span>Firmware</span><strong>${esc(state.info.version || "--")}</strong></div>
        <div class="kv"><span>Platform</span><strong>${esc(state.info.platform || "--")}</strong></div>
        <div class="kv"><span>Free memory</span><strong>${fmtBytes(state.info.free_heap)}</strong></div>
        <p><button class="btn" data-action="reboot">Restart controller</button></p></section>
        <section class="card"><h2 style="color:var(--cp-danger)">Factory reset</h2><div class="notice bad">Permanently erases WiFi, settings, certificates, event history, and stored files.</div>
          <p><button class="btn danger" data-action="factory-reset">Erase and reset</button></p></section></div>`;
    }
    function settingsPage() {
      const pages = { wifi: wifiSettings, firmware: firmwareSettings, time: timeSettings, display: displaySettings,
        preferences: preferenceSettings, security: securitySettings, home_assistant: homeAssistantSettings,
        diagnostics: diagnosticsSettings, system: systemSettings };
      if (!state.settingsLoaded) {
        return settingsShell(`<section class="card"><div class="spinner"></div></section>`);
      }
      return settingsShell((pages[state.settingsPage] || wifiSettings)());
    }
    function loginPage() {
      return `<div class="login"><form class="card login-card" data-form="login"><div class="brand" style="margin-bottom:20px"><div class="brand-mark">A</div><span>Arctic Controller</span></div>
        <h1>Sign in</h1><p class="metric-sub">Enter the controller credentials.</p>
        ${state.auth.loginError ? `<div class="notice bad" style="margin:0 0 16px">${esc(state.auth.loginError)}</div>` : ""}
        <div class="field"><label>Username</label><input name="username" autocomplete="username" required></div>
        <div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn primary" type="submit">Sign in</button></form></div>`;
    }
    function credentialChangePage() {
      return `<div class="login"><form class="card login-card" data-form="change-credentials">
        <div class="brand" style="margin-bottom:20px"><div class="brand-mark">A</div><span>Arctic Controller</span></div>
        <h1>Secure this controller</h1>
        <p class="metric-sub">Open Settings → Security on the controller's screen, tap Show Setup Code, and enter the six-digit code below to set your own password.</p>
        <div class="field"><label>Setup code</label><input name="pairing_code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></div>
        <div class="field"><label>Username</label><input name="username" value="arctic" autocomplete="username" required></div>
        <div class="field"><label>New password</label><input name="password" type="password" minlength="12" autocomplete="new-password" required></div>
        <div class="field"><label>Confirm password</label><input name="confirm_password" type="password" minlength="12" autocomplete="new-password" required></div>
        <button class="btn primary" type="submit">Save credentials</button></form></div>`;
    }
    function render() {
      if (!state.auth.checked) {
        $("#app").innerHTML = `<div class="login"><div class="spinner"></div></div>`;
        return;
      }
      if (state.auth.required && !state.auth.loggedIn) {
        $("#app").innerHTML = loginPage(); return;
      }
      if (state.auth.changeRequired) {
        $("#app").innerHTML = credentialChangePage(); return;
      }
      const pages = { home: homePage, status: statusPage, control: controlPage, events: eventsPage,
        errors: errorsPage, settings: settingsPage };
      $("#app").innerHTML = shell((pages[state.route] || homePage)());
      if (state.settingsPage === "diagnostics") {
        const logs = $("#log-container"); if (logs) logs.scrollTop = logs.scrollHeight;
      }
    }

    async function loadCore() {
      const results = await Promise.allSettled([
        api("/api/info"), api("/api/status"), api("/api/wifi"), api("/api/heatpump/status"),
        api("/api/preferences"), api("/api/heatpump/errors"), api("/api/ota/status")
      ]);
      const values = results.map(r => r.status === "fulfilled" ? r.value : {});
      [state.info, state.status, state.wifi, state.hp, state.preferences, state.errors, state.ota] = values;
    }
    async function loadParams() { const data = await api("/api/heatpump/advanced"); state.params = data.params || {}; }
    async function loadEvents(reset = false) {
      if (reset) { state.events = []; state.eventOffset = 0; }
      const data = await api(`/api/events?offset=${state.eventOffset}&limit=50`);
      state.events.push(...(data.events || [])); state.eventOffset = state.events.length;
      state.eventTotal = data.total || 0; state.currentBootId = data.current_boot_id || 0;
    }
    async function loadSettings() {
      const results = await Promise.allSettled([
        api("/api/time/config"), api("/api/auth/config"), api("/api/auth/apikey"), api("/api/tls/status")
      ]);
      if (results[0].status === "fulfilled") state.timeConfig = results[0].value;
      if (results[1].status === "fulfilled") state.security = results[1].value;
      if (results[2].status === "fulfilled") state.security.api_key = results[2].value.api_key;
      if (results[3].status === "fulfilled") state.tls = results[3].value;
      state.settingsLoaded = true;
    }
    async function ensureSettings() {
      if (state.settingsLoaded) return;
      if (!state.settingsPromise) {
        state.settingsPromise = loadSettings().finally(() => { state.settingsPromise = null; });
      }
      await state.settingsPromise;
    }
    async function loadNetworks() {
      const data = await api("/api/wifi/networks"); state.networks = data.networks || [];
      if (data.scanning) setTimeout(loadNetworks, 700); else render();
    }
    async function loadLogs(full = false) {
      const since = full ? 0 : state.logSeq;
      const data = await api(`/api/logs?since=${since}&level=${state.logLevel}&limit=256`);
      state.logs = full ? (data.entries || []) : state.logs.concat(data.entries || []).slice(-1000);
      state.logSeq = data.latest_seq || 0; render();
    }
    function startLogPolling() {
      stopLogPolling(); loadLogs(true).catch(e => toast(e.message, "bad"));
      state.logTimer = setInterval(() => {
        if (state.route === "settings" && state.settingsPage === "diagnostics") loadLogs(false).catch(() => {});
      }, 2000);
    }
    function stopLogPolling() { if (state.logTimer) clearInterval(state.logTimer); state.logTimer = null; }
    async function loadHaStatus() {
      const data = await api("/api/ha/status");
      if (data.pairing_active) {
        const code = (state.ha && state.ha.code) || sessionStorage.getItem("ha_pair_code") || "";
        state.ha = { ...data, code };
      } else {
        sessionStorage.removeItem("ha_pair_code");
        state.ha = { ...data, code: "" };
      }
    }
    function startHaPolling() {
      stopHaPolling();
      state.haTimer = setInterval(async () => {
        if (state.route !== "settings" || state.settingsPage !== "home_assistant") { stopHaPolling(); return; }
        try {
          const before = JSON.stringify([state.ha.paired, state.ha.pairing_active, state.ha.device_name, state.ha.code]);
          await loadHaStatus();
          const after = JSON.stringify([state.ha.paired, state.ha.pairing_active, state.ha.device_name, state.ha.code]);
          if (before !== after) { render(); return; }
          // Only the countdown changed: update it in place so an active code
          // stays selectable and the DOM isn't rebuilt every second.
          const clockEl = document.getElementById("ha-clock");
          if (clockEl) {
            const remaining = Math.max(0, state.ha.remaining_seconds || 0);
            clockEl.textContent = `${Math.floor(remaining / 60)}:${String(remaining % 60).padStart(2, "0")}`;
          }
        } catch (_) {}
      }, 1000);
    }
    function stopHaPolling() { if (state.haTimer) clearInterval(state.haTimer); state.haTimer = null; }
    async function navigate(route, settingsPage = null) {
      stopLogPolling();
      stopHaPolling();
      state.route = route;
      if (settingsPage) state.settingsPage = settingsPage;
      const targetHash = route === "settings" ? `#/settings/${state.settingsPage}` : `#/${route}`;
      if (location.hash !== targetHash) history.pushState(null, "", targetHash);
      render();
      try {
        if (route === "control" && !Object.keys(state.params).length) await loadParams();
        if (route === "events" && !state.events.length) await loadEvents(true);
        if (route === "settings") {
          await ensureSettings();
          if (state.settingsPage === "wifi") { await api("/api/wifi/scan", { method: "POST" }).catch(() => {}); setTimeout(loadNetworks, 500); }
          if (state.settingsPage === "diagnostics") startLogPolling();
          if (state.settingsPage === "home_assistant") { await loadHaStatus().catch(() => {}); startHaPolling(); }
        }
      } catch (error) { toast(error.message, "bad"); }
      if (route === "events" && document.activeElement?.id === "event-search") refreshEventResults();
      else render();
    }
    async function mutate(url, options, success) {
      state.busy = true;
      try { const data = await api(url, options); if (success) toast(success, "good"); return data; }
      catch (error) { toast(error.message, "bad"); error.toastShown = true; throw error; }
      finally { state.busy = false; }
    }
    function jsonOptions(method, body) {
      return { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
    }
    async function handleForm(form) {
      const type = form.dataset.form, data = new FormData(form);
      if (type === "login") {
        state.auth.loginError = "";
        try {
          await api("/login", jsonOptions("POST", { username: data.get("username"), password: data.get("password") }));
          const auth = await api("/api/auth/status");
          state.auth.loggedIn = !!auth.session_valid;
          state.auth.changeRequired = !!auth.credentials_change_required;
          if (!state.auth.changeRequired) await loadCore();
          render();
        } catch (error) {
          state.auth.loggedIn = false;
          state.auth.loginError = /authentication required|401|unauthorized/i.test(error.message)
            ? "Incorrect username or password." : error.message;
          render();
        }
      }
      if (type === "change-credentials") {
        const password = String(data.get("password") || "");
        if (password !== data.get("confirm_password")) {
          throw new Error("Passwords do not match");
        }
        await mutate("/api/auth/credentials", jsonOptions("POST", {
          username: data.get("username"), password,
          pairing_code: data.get("pairing_code")
        }), "Credentials changed. Sign in again.");
        state.auth.loggedIn = false;
        state.auth.changeRequired = false;
        render();
      }
      if (type === "setpoint") {
        const key = form.dataset.key, c = toCelsius(data.get("value"));
        await mutate("/api/heatpump/setpoints", jsonOptions("PUT", { [key]: c }), "Setpoint saved");
        state.hp.setpoints[key] = c; render();
      }
      if (type === "ap") {
        let value = Number(data.get("value"));
        if (form.dataset.kind !== "none") value = toCelsius(value, form.dataset.kind);
        await mutate(`/api/heatpump/advanced/${form.dataset.key}`, { method: "PUT", headers: { "Content-Type": "text/plain" }, body: String(value) }, "Parameter saved");
        state.params[form.dataset.key].value = value; render();
      }
      if (type === "wifi") await mutate("/api/wifi/connect", jsonOptions("POST", { ssid: data.get("ssid"), password: data.get("password") }), "Connection started");
      if (type === "time") {
        await mutate("/api/time/config", jsonOptions("POST", { timezone: data.get("timezone"), format_24h: data.get("format") === "24" }), "Time settings saved");
        state.timeConfig = await api("/api/time/config"); render();
      }
      if (type === "brightness") {
        const brightness = Number(data.get("brightness"));
        await mutate("/api/display/brightness", jsonOptions("PUT", { brightness }), "Brightness applied");
        state.preferences.brightness = brightness; render();
      }
      if (type === "preferences") {
        const response = await mutate("/api/preferences", jsonOptions("PATCH", {
          temp_unit: data.get("temp_unit"), language: data.get("language"), demo_mode: data.get("demo_mode") === "on"
        }), "Preferences saved");
        state.preferences = response;
        if (response.reboot_required) toast("Restart required for demo mode change");
        render();
      }
      if (type === "auth-config") {
        await mutate("/api/auth/config", jsonOptions("POST", { web_auth_enabled: data.get("web") === "on", api_auth_enabled: data.get("api") === "on" }), "Authentication saved");
        await loadSettings(); render();
      }
      if (type === "credentials") {
        await mutate("/api/auth/credentials", jsonOptions("POST", { username: data.get("username"), password: data.get("password") }), "Credentials saved");
      }
      if (type === "tls") {
        await mutate("/api/tls/certificate", jsonOptions("POST", { cert: data.get("cert"), key: data.get("key") }), "Certificate saved; restart required");
        await loadSettings(); render();
      }
      if (type === "firmware") {
        const file = data.get("firmware");
        if (!file?.name?.toLowerCase().endsWith(".bin")) return toast("Select a .bin firmware image", "bad");
        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/api/ota/upload");
        xhr.setRequestHeader("Content-Type", "application/octet-stream");
        xhr.upload.onprogress = e => { if (e.lengthComputable) toast(`Uploading ${Math.round(e.loaded / e.total * 100)}%`); };
        xhr.onload = () => xhr.status === 200 ? toast("Firmware uploaded; controller is restarting", "good") : toast("Firmware upload failed", "bad");
        xhr.onerror = () => toast("Firmware upload failed", "bad");
        xhr.send(file);
      }
    }
    async function handleAction(action, el) {
      if (action === "mode") {
        const data = await mutate("/api/heatpump/mode", jsonOptions("PUT", { mode: el.dataset.value }), "Mode changed");
        state.hp.mode = data.mode || el.dataset.value; render();
      }
      if (action === "reload-params") { await loadParams(); render(); }
      if (action === "load-more-events") { await loadEvents(false); render(); }
      if (action === "clear-events" && confirm("Clear all operational events?")) {
        await mutate("/api/events", { method: "DELETE" }, "Events cleared"); await loadEvents(true); render();
      }
      if (action === "clear-event-search") {
        state.eventFilters.search = "";
        const input = $("#event-search");
        if (input) { input.value = ""; input.focus(); }
        refreshEventResults();
      }
      if (action === "clear-error-history" && confirm("Clear error history?")) {
        await mutate("/api/heatpump/errors/history", { method: "DELETE" }, "Error history cleared");
        state.errors.history = []; render();
      }
      if (action === "scan-wifi") { await mutate("/api/wifi/scan", { method: "POST" }, "WiFi scan started"); setTimeout(loadNetworks, 500); }
      if (action === "disconnect-wifi" && confirm("Disconnect from WiFi? This page will close.")) await mutate("/api/wifi/disconnect", { method: "POST" });
      if (action === "sync-time") { await mutate("/api/time/sync", { method: "POST" }, "Time sync started"); }
      if (action === "check-update") { state.release = await mutate("/api/ota/releases", {}, "Update check complete"); render(); }
      if (action === "install-update" && confirm("Download and install this update?")) {
        await mutate("/api/ota/github", { method: "POST" }, "Update started");
        state.ota = await api("/api/ota/status").catch(() => state.ota); render();
      }
      if (action === "reboot" && confirm("Restart the controller now?")) await mutate("/api/ota/reboot", { method: "POST" }, "Controller restarting");
      if (action === "copy-key") { await navigator.clipboard.writeText(state.security.api_key || ""); toast("API key copied", "good"); }
      if (action === "regenerate-key" && confirm("Regenerate the API key? Existing integrations will stop working.")) {
        const data = await mutate("/api/auth/apikey/regenerate", { method: "POST" }, "API key regenerated");
        state.security.api_key = data.api_key; render();
      }
      if (action === "delete-tls" && confirm("Delete the TLS certificate?")) {
        await mutate("/api/tls/certificate", { method: "DELETE" }, "Certificate deleted; restart required"); await loadSettings(); render();
      }
      if (action === "logout") { await api("/logout", { method: "POST" }).catch(() => {}); location.reload(); return; }
      if (action === "copy-ha-code") { await navigator.clipboard.writeText(state.ha.code || ""); toast("Pairing code copied", "good"); }
      if (action === "ha-pair") {
        const data = await mutate("/api/ha/pair", { method: "POST" }, "Pairing started");
        const code = data.code || "";
        if (code) sessionStorage.setItem("ha_pair_code", code);
        state.ha = { ...state.ha, code, pairing_active: true, remaining_seconds: data.expires_in_seconds || 0 };
        render(); startHaPolling();
      }
      if (action === "ha-cancel") {
        await mutate("/api/ha/pair", { method: "DELETE" }, "Pairing cancelled");
        sessionStorage.removeItem("ha_pair_code");
        stopHaPolling(); state.ha = { ...state.ha, code: "", pairing_active: false, remaining_seconds: 0 }; render();
      }
      if (action === "ha-revoke" && confirm("Revoke Home Assistant pairing? Home Assistant will lose access until you pair again.")) {
        await mutate("/api/ha/revoke", { method: "POST" }, "Pairing revoked");
        sessionStorage.removeItem("ha_pair_code");
        stopHaPolling(); state.ha = { ...state.ha, paired: false, code: "", pairing_active: false, remaining_seconds: 0 }; render();
      }
      if (action === "refresh-logs") await loadLogs(true);
      if (action === "clear-logs" && confirm("Clear controller logs?")) {
        await mutate("/api/logs", { method: "DELETE" }, "Logs cleared"); state.logs = []; state.logSeq = 0; render();
      }
      if (action === "factory-reset" && confirm("Factory reset this controller? This cannot be undone.")) {
        const phrase = prompt('Type "factory-reset" to permanently erase the controller.');
        if (phrase === "factory-reset") await mutate("/api/factory-reset", jsonOptions("POST", { confirm: phrase }), "Factory reset started");
      }
    }
    function startPowerHold(el) {
      if (!state.hp.unit_on) {
        mutate("/api/heatpump/power", jsonOptions("PUT", { on: true }), "Power turned on")
          .then(() => { state.hp.unit_on = true; render(); }); return;
      }
      state.powerHolding = true; render();
      state.powerHoldTimer = setTimeout(async () => {
        state.powerHolding = false;
        await mutate("/api/heatpump/power", jsonOptions("PUT", { on: false }), "Power turned off");
        state.hp.unit_on = false; render();
      }, 3000);
    }
    function cancelPowerHold() {
      if (state.powerHoldTimer) clearTimeout(state.powerHoldTimer);
      state.powerHoldTimer = null;
      if (state.powerHolding) { state.powerHolding = false; render(); }
    }

    document.addEventListener("click", async event => {
      const route = event.target.closest("[data-route]");
      if (route) { event.preventDefault(); await navigate(route.dataset.route); return; }
      const settings = event.target.closest("[data-settings]");
      if (settings) { event.preventDefault(); await navigate("settings", settings.dataset.settings); return; }
      const action = event.target.closest("[data-action]");
      if (action && action.dataset.action !== "power-hold") {
        event.preventDefault(); handleAction(action.dataset.action, action).catch(error => {
          if (!error.toastShown) toast(error.message, "bad");
        });
      }
    });
    document.addEventListener("submit", event => {
      const form = event.target.closest("[data-form]");
      if (!form) return;
      event.preventDefault();
      handleForm(form).catch(error => {
        if (!error.toastShown) toast(error.message, "bad");
      });
    });
    document.addEventListener("pointerdown", event => {
      const button = event.target.closest('[data-action="power-hold"]');
      if (button) { event.preventDefault(); startPowerHold(button); }
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(name =>
      document.addEventListener(name, event => {
        if (event.target.closest?.('[data-action="power-hold"]')) cancelPowerHold();
      }));
    document.addEventListener("input", event => {
      if (event.target.id === "event-search") {
        state.eventFilters.search = event.target.value;
        refreshEventResults();
      }
      if (event.target.name === "brightness") {
        const value = $("#brightness-value"); if (value) value.textContent = `${event.target.value}%`;
      }
      if (event.target.matches(".control-range")) {
        const output = event.target.closest(".range-editor")?.querySelector("[data-range-output]");
        if (output) output.textContent = `${event.target.value}${event.target.dataset.unit ? ` ${event.target.dataset.unit}` : ""}`;
      }
    });
    document.addEventListener("change", event => {
      if (event.target.matches("select.choice-select")) {
        const description = event.target.closest(".choice-editor")?.querySelector(".choice-description");
        const selected = event.target.selectedOptions[0];
        if (description) description.textContent = selected?.dataset.description || "";
      }
      if (event.target.id === "event-category") { state.eventFilters.category = event.target.value.toLowerCase(); render(); }
      if (event.target.id === "event-time") { state.eventFilters.time = event.target.value; render(); }
      if (event.target.id === "log-level") { state.logLevel = event.target.value; loadLogs(true).catch(() => {}); }
    });
    async function navigateFromLocation() {
      routeFromHash();
      await navigate(state.route, state.settingsPage);
    }
    window.addEventListener("hashchange", navigateFromLocation);
    window.addEventListener("popstate", navigateFromLocation);

    async function init() {
      routeFromHash();
      try {
        const auth = await fetch("/api/auth/status").then(r => r.json());
        state.auth = {
          checked: true,
          required: true,
          loggedIn: !!auth.session_valid,
          changeRequired: !!auth.credentials_change_required
        };
        if (state.auth.loggedIn && !state.auth.changeRequired) {
          render();
          await loadCore();
          if (state.route === "control") await loadParams();
          if (state.route === "events") await loadEvents(true);
          if (state.route === "settings") await ensureSettings();
        }
      } catch (error) {
        state.auth.checked = true;
        toast(`Controller unavailable: ${error.message}`, "bad");
      }
      if (state.route === "events" && document.activeElement?.id === "event-search") refreshEventResults();
      else render();
      if (state.route === "settings" && state.settingsPage === "diagnostics") startLogPolling();
      if (state.route === "settings" && state.settingsPage === "home_assistant") {
        await loadHaStatus().catch(() => {});
        render();
        startHaPolling();
      }
      state.pollTimer = setInterval(async () => {
        if (!state.auth.loggedIn || state.auth.changeRequired) return;
        try {
          const [status, hp, wifi, ota, errors] = await Promise.all([
            api("/api/status"), api("/api/heatpump/status"), api("/api/wifi"), api("/api/ota/status"), api("/api/heatpump/errors")
          ]);
          Object.assign(state, { status, hp, wifi, ota, errors });
          if (state.route === "events") {
            const searchFocused = document.activeElement?.id === "event-search";
            await loadEvents(true);
            if (searchFocused) refreshEventResults();
            else render();
          } else if (["home", "status", "errors"].includes(state.route)) render();
          else if (state.route === "settings" && state.settingsPage === "firmware"
                   && ota && ota.state && ota.state !== "idle") render();
        } catch (_) {}
      }, 5000);
    }
    init();
  </script>
</body>
</html>
