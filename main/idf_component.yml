## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf: '>=6.1'
  ## cJSON left the IDF core in 6.x and is now a managed component
  espressif/cjson: ^1.7.19
  ## Upstream M5Stack Tab5 BSP (replaces the previously vendored fork in
  ## components/m5stack_tab5). The fork's only local change was wiring num_fbs to
  ## CONFIG_BSP_LCD_DPI_BUFFER_NUMS for the tearing fix, which upstream already does.
  espressif/m5stack_tab5: ^1.3.0
  espressif/esp_lcd_ili9881c: ^1.0.1
  ## Pin to M5Stack Tab5's compatible versions (matches pre-flashed C6 firmware).
  ## esp_hosted is vendored + patched locally (override_path): host-side backport of
  ## esp-hosted-mcu 2.12.8 MEMPOOL_PREFER_SPIRAM so the streaming SDIO RX buffer is
  ## allocated from PSRAM (P4 GDMA-reachable) instead of scarce internal DMA SRAM,
  ## fixing the sdio_rx_get_buffer:670 OOM assert during OTA. See the component's
  ## host/port/include/os_wrapper.h MEM_ALLOC macro.
  ## Version is declared as 2.11.0 to satisfy esp_wifi_remote's dependency bound;
  ## the code is still the 1.4.0 host implementation plus our PSRAM patch.
  espressif/esp_hosted:
    version: "2.11.0"
    override_path: "../components/espressif__esp_hosted"
  ## 1.6.4 is the first line shipping an idf_v6.1 source tree that compiles against
  ## released v6.1 (1.3.0's shim does not).
  espressif/esp_wifi_remote: "1.6.4"
  ## mDNS for local network discovery (arctic.local)
  espressif/mdns: "^1.4"
