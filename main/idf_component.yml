## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf: '>=5.3'
  espressif/esp_lcd_ili9881c: ^1.0.1
  ## Pin to M5Stack Tab5's compatible versions (matches pre-flashed C6 firmware)
  espressif/esp_hosted: "1.4.0"
  espressif/esp_wifi_remote: "0.8.5"
  ## mDNS for local network discovery (arctic.local)
  espressif/mdns: "^1.4"
  ## Modbus protocol for heat pump communication
  espressif/esp-modbus: "^1.0"
